<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sectis</title>
<meta name="description" content="Sectis, a private to-do app: Inbox, Today, Upcoming, projects, areas, tags, checklists and repeating to-dos. Works offline.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sectis">
<meta name="application-name" content="Sectis">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
/* Layout: two panes — a cool-grey sidebar of lists and a single reading column of to-dos.
   On phones the sidebar becomes the home screen and each list pushes in over it. */
:root {
  --bg: #ffffff;
  --side: #f3f4f7;
  --card: #ffffff;
  --pop: #ffffff;
  --fg: #1b1f27;
  --muted: #687082;
  --faint: #a4aab7;
  --line: #e5e7ed;
  --line-strong: #d3d7e0;
  --hover: #eceef3;
  --accent: #2c5be0;
  --accent-ink: #ffffff;
  --accent-tint: #e3eafc;
  --sel: #dfe7fb;
  --cb: #b9bfcb;
  --red: #e0453b;
  --c-inbox: #3e86d6;
  --c-today: #f0b31a;
  --c-evening: #5d6bd1;
  --c-upcoming: #e0453b;
  --c-anytime: #1f9e8b;
  --c-someday: #c49a52;
  --c-logbook: #36a46b;
  --c-trash: #8a909c;
  --c-area: #5b8f78;
  --shadow-card: 0 1px 2px rgba(20, 28, 48, .06), 0 10px 30px rgba(20, 28, 48, .13);
  --shadow-pop: 0 2px 6px rgba(20, 28, 48, .08), 0 18px 48px rgba(20, 28, 48, .2);
  --scrim: rgba(18, 22, 32, .32);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 14px;
  --row-h: 32px;
  --cb-size: 15px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191e; --side: #1e2027; --card: #22252d; --pop: #262a33; --fg: #e7e9ef; --muted: #9aa1b1; --faint: #626a7a;
    --line: #2c3039; --line-strong: #3a3f4a; --hover: #282c35; --accent: #6d8cff; --accent-ink: #0f1424; --accent-tint: #26304d;
    --sel: #263252; --cb: #5c6372; --red: #ff6a5f; --c-inbox: #5aa2ee; --c-today: #f6c443; --c-evening: #8d99f0;
    --c-upcoming: #ff6a5f; --c-anytime: #3cc3ad; --c-someday: #d9b370; --c-logbook: #4cc184; --c-trash: #9aa1b1; --c-area: #7cb59a;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); --shadow-pop: 0 2px 8px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-app-theme="dark"] {
  --bg: #17191e; --side: #1e2027; --card: #22252d; --pop: #262a33; --fg: #e7e9ef; --muted: #9aa1b1; --faint: #626a7a;
  --line: #2c3039; --line-strong: #3a3f4a; --hover: #282c35; --accent: #6d8cff; --accent-ink: #0f1424; --accent-tint: #26304d;
  --sel: #263252; --cb: #5c6372; --red: #ff6a5f; --c-inbox: #5aa2ee; --c-today: #f6c443; --c-evening: #8d99f0;
  --c-upcoming: #ff6a5f; --c-anytime: #3cc3ad; --c-someday: #d9b370; --c-logbook: #4cc184; --c-trash: #9aa1b1; --c-area: #7cb59a;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); --shadow-pop: 0 2px 8px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
}
:root[data-app-theme="light"] {
  --bg: #ffffff; --side: #f3f4f7; --card: #ffffff; --pop: #ffffff; --fg: #1b1f27; --muted: #687082; --faint: #a4aab7;
  --line: #e5e7ed; --line-strong: #d3d7e0; --hover: #eceef3; --accent: #2c5be0; --accent-ink: #ffffff; --accent-tint: #e3eafc;
  --sel: #dfe7fb; --cb: #b9bfcb; --red: #e0453b; --c-inbox: #3e86d6; --c-today: #f0b31a; --c-evening: #5d6bd1;
  --c-upcoming: #e0453b; --c-anytime: #1f9e8b; --c-someday: #c49a52; --c-logbook: #36a46b; --c-trash: #8a909c; --c-area: #5b8f78;
  --shadow-card: 0 1px 2px rgba(20, 28, 48, .06), 0 10px 30px rgba(20, 28, 48, .13); --shadow-pop: 0 2px 6px rgba(20, 28, 48, .08), 0 18px 48px rgba(20, 28, 48, .2);
  --scrim: rgba(18, 22, 32, .32); color-scheme: light;
}

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: var(--fs)/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { background: transparent; border: 0; outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
input:focus-visible, textarea:focus-visible { outline: none; }
kbd { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--bg); }

/* ---------- icons ---------- */
.ic { display: inline-flex; flex: none; width: 18px; height: 18px; align-items: center; justify-content: center; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic svg .fill { fill: currentColor; stroke: none; }
.ic svg .pie-ring { stroke-width: 2; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); height: 100%; }
.sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.main { position: relative; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.content { max-width: 780px; margin: 0 auto; padding-block: 52px 140px; padding-left: 40px; padding-right: max(40px, env(safe-area-inset-right, 0px)); }

.sb-top { padding-block: 14px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.sb-find { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 8px; color: var(--muted); background: var(--hover); }
.sb-find .ic { width: 15px; height: 15px; }
.sb-find > span:not(.ic) { flex: 1; text-align: left; }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.sb-group { display: flex; flex-direction: column; gap: 1px; padding-block: 8px; }
.sb-group + .sb-group { border-top: 0; }
.sb-item { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 30px; padding: 4px 8px; border-radius: 7px; text-align: left; color: var(--fg); position: relative; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--sel); }
.sb-item .ic { width: 17px; height: 17px; }
.sb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-name.untitled { color: var(--muted); }
.sb-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.sb-due { background: var(--red); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; line-height: 17px; font-variant-numeric: tabular-nums; }
.sb-area-row { font-weight: 600; }
.sb-area-row .ic { color: var(--c-area); }
.sb-proj { padding-left: 8px; }
.sb-proj .ic { color: var(--accent); }
.sb-foot { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 10px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.sb-new { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; color: var(--muted); flex: 1; text-align: left; }
.sb-new:hover, .ib:hover { background: var(--hover); color: var(--fg); }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; color: var(--muted); flex: none; }
.ib .ic { width: 18px; height: 18px; }
.sb-brand { display: none; }

/* ---------- list header ---------- */
.lh { display: flex; align-items: flex-start; gap: 12px; padding: 0 10px 6px; }
.lh > .lh-ic { margin-top: 3px; }
.lh > .ib, .lh > .btn { margin-top: 2px; }
.lh-ic { width: 28px; height: 28px; }
.lh-ic.pie-lg { color: var(--accent); }
.lh-title { flex: 1; min-width: 0; font: 700 28px/1.2 var(--display); letter-spacing: -.01em; margin: 0; padding: 0; }
.lh-title::placeholder { color: var(--faint); }
.lh-sub { padding: 0 10px 0 50px; color: var(--muted); font-size: 13px; margin-top: -4px; }
.lh-notes { display: block; width: 100%; resize: none; padding: 6px 10px 2px 50px; color: var(--fg); min-height: 28px; line-height: 1.5; overflow: hidden; }
.lh-notes::placeholder { color: var(--faint); }
.lh-meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 0 50px; }
.lh-banner { margin: 10px 10px 0 50px; padding: 8px 12px; border-radius: 8px; background: var(--hover); color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lh-banner b { color: var(--fg); font-weight: 600; }
.link-btn { color: var(--accent); font-weight: 600; }
.link-btn:hover { text-decoration: underline; }

/* ---------- tag filter bar ---------- */
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 10px 4px 50px; }
.tchip { font-size: 12px; line-height: 20px; padding: 1px 10px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line-strong); }
.tchip:hover { color: var(--fg); }
.tchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* ---------- sections & rows ---------- */
.list { padding-top: 18px; }
.sec { min-height: 6px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 22px 10px 4px; padding-bottom: 5px; border-bottom: 1px solid var(--line); color: var(--fg); font-weight: 650; font-size: 14px; }
.sec-h .ic { width: 16px; height: 16px; }
.sec-h.evening { color: var(--c-evening); }
.sec-h.evening > span:not(.ic) { color: var(--fg); }
.sec-h .sec-link { cursor: pointer; }
.sec-h .sec-link:hover { text-decoration: underline; }
.sec-h .ghost-count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.grp-h { display: flex; align-items: center; gap: 8px; margin: 26px 10px 2px; padding-bottom: 5px; border-bottom: 1px solid var(--line); font-weight: 650; }
.grp-h.area-h { font-size: 15px; }
.grp-h .ic { width: 17px; height: 17px; }
.grp-h.area-h .ic { color: var(--c-area); }
.grp-h.proj-h .ic { color: var(--accent); }
.grp-h button { text-align: left; }
.grp-h button:hover { text-decoration: underline; }

.row { display: flex; align-items: flex-start; gap: 10px; min-height: var(--row-h); padding: 6px 10px; border-radius: 7px; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: default; }
.row.selected { background: var(--sel); }
.row.dragging { opacity: .35; }
.r-main { flex: 1; min-width: 0; }
.r-line { display: block; min-height: 20px; line-height: 20px; overflow-wrap: anywhere; }
.r-line > * { margin-right: 6px; vertical-align: -3px; }
.r-line > .r-title { vertical-align: baseline; }
.r-line > .tg, .r-line > .r-when { display: inline-block; vertical-align: 1px; }
.r-line > .r-ck { vertical-align: -2px; }
.r-title { min-width: 0; overflow-wrap: anywhere; }
.r-title.untitled { color: var(--faint); }
.r-sub { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-ic { color: var(--faint); width: 14px; height: 14px; }
.r-star { color: var(--c-today); width: 14px; height: 14px; }
.r-moon { color: var(--c-evening); width: 14px; height: 14px; }
.r-box { color: var(--c-someday); width: 14px; height: 14px; }
.r-when { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--hover); border-radius: 5px; padding: 0 6px; line-height: 18px; }
.r-ck { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.r-right { display: flex; align-items: center; gap: 8px; flex: none; min-height: 20px; }
.dl { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl .ic { width: 13px; height: 13px; }
.dl.due { color: var(--red); }
.tg { font-size: 11px; line-height: 17px; padding: 0 7px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line-strong); white-space: nowrap; }
.row.done .r-title, .row.canceled .r-title { color: var(--muted); }
.row.canceled .r-title { text-decoration: line-through; }
.row.ghost { opacity: .55; cursor: pointer; }
.row.ghost:hover { opacity: .8; }
.row.trashed-row .r-title { color: var(--muted); }
.r-date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; min-width: 48px; padding-top: 1px; }
.restore { font-size: 12px; color: var(--accent); font-weight: 600; padding: 0 4px; }

.cb { position: relative; flex: none; width: var(--cb-size); height: var(--cb-size); margin-top: 2.5px; border: 1.5px solid var(--cb); border-radius: 4.5px; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background .15s, border-color .15s; }
.cb::before { content: ""; position: absolute; inset: -9px; }
.cb:hover { border-color: var(--muted); }
.cb .ic { width: 11px; height: 11px; }
.cb .ic svg { stroke-width: 3; }
.cb.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cb.canceled { background: var(--cb); border-color: var(--cb); color: var(--bg); }
.cb.repeat-due { border-style: dashed; }
.card .cb, .row .cb { background-clip: padding-box; }
.prow .pie-ic { color: var(--accent); width: 17px; height: 17px; margin-top: 1px; }
.prow .r-title { font-weight: 600; }
.prow { cursor: pointer; }

.hrow { display: flex; align-items: flex-start; gap: 6px; margin: 24px 10px 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--accent); user-select: none; -webkit-user-select: none; }
.hrow.dragging { opacity: .35; }
.h-title { flex: 1; min-width: 0; font-weight: 650; color: var(--accent); padding: 0; line-height: 1.45; }
.h-title::placeholder { color: var(--faint); }
.hrow .ib { width: 26px; height: 26px; opacity: 0; }
.hrow:hover .ib, .hrow:focus-within .ib, .touch .hrow .ib { opacity: 1; }
.empty { padding: 56px 10px 24px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 44px; height: 44px; opacity: .3; }
.empty p { margin: 0; max-width: 34ch; }
.show-more { margin: 10px 10px 0; color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
.show-more:hover { background: var(--hover); color: var(--fg); }

/* Upcoming */
.day-h { display: flex; align-items: baseline; gap: 10px; margin: 18px 10px 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.day-n { font: 700 28px/1 var(--display); min-width: 34px; font-variant-numeric: tabular-nums; }
.day-w { font-weight: 650; color: var(--muted); }
.day-h.month .day-n { font-size: 22px; min-width: 0; }

/* Logbook */
.lb-h { margin: 24px 10px 4px; font-weight: 650; color: var(--muted); font-size: 13px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }

/* ---------- editor card ---------- */
.card { position: relative; margin: 10px -4px 16px; padding: 12px 14px 10px; background: var(--card); border-radius: 11px; box-shadow: var(--shadow-card); animation: cardIn .16s ease-out; }
@keyframes cardIn { from { transform: scale(.985); opacity: .6; } to { transform: none; opacity: 1; } }
.c-top { display: flex; align-items: flex-start; gap: 10px; }
.c-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; padding: 0; line-height: 21px; }
.c-title::placeholder { color: var(--faint); font-weight: 400; }
.c-body { padding-left: 25px; }
.c-notes { display: block; width: 100%; resize: none; margin-top: 6px; min-height: 24px; line-height: 1.5; color: var(--fg); overflow: hidden; padding: 0; }
.c-notes::placeholder { color: var(--faint); }
.c-tpl { margin: 2px 0 6px 25px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.c-tpl .ic { width: 14px; height: 14px; }
.ck { margin-top: 10px; border-top: 1px solid var(--line); }
.ck-item { display: flex; align-items: center; gap: 8px; min-height: 30px; border-bottom: 1px solid var(--line); }
.ck-box { flex: none; width: 13px; height: 13px; border: 1.5px solid var(--cb); border-radius: 50%; position: relative; display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.ck-box::before { content: ""; position: absolute; inset: -8px; }
.ck-box.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ck-box .ic { width: 9px; height: 9px; }
.ck-box .ic svg { stroke-width: 3.4; }
.ck-input { flex: 1; min-width: 0; padding: 4px 0; }
.ck-item.on .ck-input { color: var(--muted); text-decoration: line-through; }
.ck-del { width: 22px; height: 22px; opacity: 0; }
.ck-item:hover .ck-del, .ck-item:focus-within .ck-del, .touch .ck-del { opacity: .7; }
.c-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.c-tags .tg { cursor: pointer; }
.c-tags .tg:hover { color: var(--fg); border-color: var(--muted); }
.c-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.c-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.c-tools { display: flex; gap: 2px; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border-radius: 7px; background: var(--hover); font-size: 13px; line-height: 20px; max-width: 100%; }
.chip > button.chip-main { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.chip .ic { width: 15px; height: 15px; }
.chip .chip-x { width: 18px; height: 18px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.chip .chip-x:hover { background: var(--line); color: var(--fg); }
.chip .chip-x .ic { width: 11px; height: 11px; }
.chip.today .chip-main .ic { color: var(--c-today); }
.chip.evening .chip-main .ic { color: var(--c-evening); }
.chip.date .chip-main .ic { color: var(--c-upcoming); }
.chip.someday .chip-main .ic { color: var(--c-someday); }
.chip.deadline .chip-main .ic { color: var(--red); }
.chip.deadline.due { color: var(--red); }
.chip.repeat .chip-main .ic { color: var(--accent); }
.chip.tagc .chip-main .ic { color: var(--muted); }

/* ---------- magic plus, batch bar, mobile bar ---------- */
.magic { position: fixed; right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 10px rgba(44, 91, 224, .35), 0 1px 2px rgba(0, 0, 0, .15); display: flex; align-items: center; justify-content: center; z-index: 20; touch-action: none; transition: transform .12s; }
.magic:hover { transform: scale(1.05); }
.magic .ic { width: 22px; height: 22px; }
.magic .ic svg { stroke-width: 2.4; }
.magic.hidden-in { display: none; }
.batch { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 14px; background: var(--pop); box-shadow: var(--shadow-pop); max-width: calc(100vw - 32px); overflow-x: auto; }
.batch .bcount { padding: 0 10px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.batch button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 9px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.batch button:hover { background: var(--hover); color: var(--fg); }
.batch button .ic { width: 18px; height: 18px; }
.batch .bdone { color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px 12px; }
.m-bar { display: none; }
.sel-ring { display: none; }

/* ---------- popovers, sheets, modals ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; }
.scrim.dim { background: var(--scrim); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.pop { position: fixed; z-index: 41; width: 286px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--pop); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 8px; animation: popIn .12s ease-out; }
.pop.wide { width: 320px; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } }
.modal { position: fixed; z-index: 41; left: 50%; top: 10vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; background: var(--pop); border-radius: 14px; box-shadow: var(--shadow-pop); animation: popIn .14s ease-out; }
.modal.narrow { width: min(400px, calc(100vw - 32px)); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px; }
.modal-h h2 { margin: 0; font: 700 18px/1.3 var(--display); flex: 1; }
.modal-b { padding: 4px 18px 18px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; flex-wrap: wrap; }
.btn { padding: 7px 14px; border-radius: 8px; background: var(--hover); font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: var(--red); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

.pk-h { font-weight: 650; text-align: center; padding: 4px 0 8px; }
.pk-in, .field { width: 100%; padding: 7px 10px; border-radius: 8px; background: var(--hover); }
.pk-hint { min-height: 18px; font-size: 12px; color: var(--accent); padding: 4px 10px 2px; }
.pk-hint.bad { color: var(--muted); }
.pk-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.pk-opt:hover, .pk-opt.kbd { background: var(--hover); }
.pk-opt .ic { width: 17px; height: 17px; }
.pk-opt.today .ic { color: var(--c-today); }
.pk-opt.evening .ic { color: var(--c-evening); }
.pk-opt.someday .ic { color: var(--c-someday); }
.pk-opt.on { font-weight: 650; }
.pk-opt .check { margin-left: auto; color: var(--accent); }
.pk-clear { display: block; width: 100%; margin-top: 6px; padding: 7px; border-radius: 8px; background: var(--hover); font-weight: 600; font-size: 13px; }
.pk-rem { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.pk-rem .ic { width: 16px; height: 16px; color: var(--muted); }
.pk-rem input { flex: 1; padding: 4px 8px; border-radius: 6px; background: var(--hover); }
.pk-sep { height: 1px; background: var(--line); margin: 6px 0; }
.cal { padding: 4px 2px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; font-weight: 650; }
.cal-h .ib { width: 26px; height: 26px; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-g .wd { font-size: 10px; color: var(--muted); padding: 2px 0; text-transform: uppercase; letter-spacing: .04em; }
.cal-d { height: 32px; border-radius: 8px; font-variant-numeric: tabular-nums; font-size: 13px; }
.cal-d:hover { background: var(--hover); }
.cal-d.out { color: var(--faint); }
.cal-d.past { color: var(--faint); opacity: .5; pointer-events: none; }
.cal-d.today { color: var(--c-today); font-weight: 700; }
.cal-d.today::after { content: "★"; font-size: 0; }
.cal-d.sel { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.menu-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.menu-i:hover, .menu-i.kbd { background: var(--hover); }
.menu-i .ic { width: 17px; height: 17px; color: var(--muted); }
.menu-i.danger, .menu-i.danger .ic { color: var(--red); }
.menu-i:disabled { opacity: .45; }
.menu-i .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-h { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px 4px; }
.pick-list { max-height: 320px; overflow-y: auto; margin-top: 6px; }
.pick-i { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; border-radius: 8px; text-align: left; }
.pick-i:hover, .pick-i.kbd { background: var(--hover); }
.pick-i .ic { width: 16px; height: 16px; color: var(--muted); }
.pick-i.p .ic { color: var(--accent); }
.pick-i.a { font-weight: 650; }
.pick-i.a .ic { color: var(--c-area); }
.pick-i.inbox .ic { color: var(--c-inbox); }
.pick-i.h { padding-left: 38px; color: var(--muted); font-size: 13px; }
.pick-i.cur { color: var(--accent); }
.pick-i .check { margin-left: auto; color: var(--accent); }
.pick-i .partial { margin-left: auto; color: var(--muted); }

/* Quick Find */
.qf-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.qf-in .ic { color: var(--muted); }
.qf-in input { flex: 1; font-size: 17px; }
.qf-res { padding: 6px; max-height: 56vh; overflow-y: auto; }
.qf-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.qf-i.kbd { background: var(--sel); }
.qf-i .ic { width: 17px; height: 17px; }
.qf-i .qf-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qf-i .qf-s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.qf-g { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 10px 4px; }
.qf-foot { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.qf-foot label { display: flex; align-items: center; gap: 6px; margin-left: auto; cursor: pointer; }

/* Quick Entry */
.qe { padding: 16px 18px 14px; }
.qe .c-top { gap: 10px; }
.qe-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 500; padding: 0; line-height: 22px; }
.qe-parsed { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 0 25px; }
.qe-p { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px 2px 8px; border-radius: 6px; background: var(--accent-tint); color: var(--accent); }
.qe-p button { color: inherit; opacity: .7; display: inline-flex; }
.qe-p .ic { width: 11px; height: 11px; }
.qe-dest { font-size: 12px; color: var(--muted); padding: 10px 0 0 25px; display: flex; gap: 6px; align-items: center; }
.qe-dest .ic { width: 14px; height: 14px; }

/* Settings */
.set-sec { padding: 12px 0; border-top: 1px solid var(--line); }
.set-sec:first-child { border-top: 0; padding-top: 0; }
.set-sec h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; flex-wrap: wrap; }
.set-row .lbl { flex: 1; min-width: 160px; }
.set-row .lbl small { display: block; color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; background: var(--hover); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg button { padding: 4px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--pop); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.set-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.about { color: var(--muted); font-size: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.about b { color: var(--fg); font-weight: 650; }
.ta { width: 100%; min-height: 160px; font: 12px/1.4 var(--mono); padding: 10px; border-radius: 8px; background: var(--hover); resize: vertical; }
.note { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.warn { color: var(--red); }

/* Tag manager */
.tm-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.tm-row input.field { flex: 1; min-width: 0; padding: 5px 8px; }
.tm-row select { padding: 5px 6px; border-radius: 8px; background: var(--hover); border: 0; max-width: 40%; }
.tm-row .ib.del-armed { color: #fff; background: var(--red); width: auto; padding: 0 8px; font-size: 12px; font-weight: 600; }

/* Repeat editor */
#rp-body > .seg { margin-bottom: 8px; }
.rp-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
.rp-row > span:first-child { min-width: 72px; color: var(--muted); }
.rp-row select, .rp-row input[type="number"], .rp-row input[type="date"], .rp-row input[type="time"] { padding: 5px 8px; border-radius: 8px; background: var(--hover); border: 0; }
.rp-row input[type="number"] { width: 64px; }
.wd-pick { display: flex; gap: 4px; flex-wrap: wrap; }
.wd-pick button { width: 34px; height: 30px; border-radius: 8px; background: var(--hover); font-size: 12px; font-weight: 600; color: var(--muted); }
.wd-pick button.on { background: var(--accent); color: var(--accent-ink); }
.rp-prev { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--hover); font-size: 13px; color: var(--muted); }
.rp-prev b { color: var(--fg); }

/* Shortcuts */
.sc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 24px; }
.sc-grid h4 { grid-column: 1 / -1; margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sc { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
.sc kbd { white-space: nowrap; }

/* Toasts */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 14px; border-radius: 10px; background: #23272f; color: #f2f4f8; box-shadow: 0 8px 26px rgba(0, 0, 0, .28); font-size: 13px; animation: popIn .15s ease-out; max-width: 100%; }
.toast .t-msg { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.toast button { color: #9db4ff; font-weight: 650; padding: 2px 6px; border-radius: 6px; white-space: nowrap; }
.toast button:hover { background: rgba(255, 255, 255, .08); }
.banner { position: sticky; top: 0; z-index: 15; display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--accent-tint); color: var(--fg); font-size: 13px; flex-wrap: wrap; }

/* Drag */
.drag-ghost { position: fixed; z-index: 100; pointer-events: none; padding: 6px 12px; border-radius: 8px; background: var(--pop); box-shadow: var(--shadow-pop); max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.drag-ghost .n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 6px; }
.drop-line { position: fixed; z-index: 99; height: 2px; background: var(--accent); border-radius: 2px; pointer-events: none; }
.drop-line::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--accent); background: var(--bg); }
.drop-hover { background: var(--accent-tint) !important; box-shadow: inset 0 0 0 1.5px var(--accent); }
.dragging-active, .dragging-active * { cursor: grabbing !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- phones ---------- */
@media (max-width: 760px) {
  :root { --fs: 16px; --row-h: 44px; --cb-size: 20px; }
  .app { display: block; position: relative; }
  .sidebar, .main { position: absolute; inset: 0; }
  .app.m-home .main { display: none; }
  .app.m-list .sidebar { display: none; }
  .sidebar { background: var(--bg); border-right: 0; }
  .sb-brand { display: block; font: 700 30px/1.2 var(--display); padding: 8px 6px 4px; }
  .sb-top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 10px; }
  .sb-find { padding: 9px 12px; }
  .sb-find kbd { display: none; }
  .sb-scroll { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: 96px; }
  .sb-item { padding-left: 4px; padding-right: 6px; }
  .sb-item { min-height: 44px; font-size: 17px; gap: 12px; }
  .sb-item .ic { width: 21px; height: 21px; }
  .sb-group { padding-block: 10px; }
  .sb-foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .content { padding-block: 4px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .m-bar { display: flex; align-items: center; gap: 4px; position: sticky; top: 0; z-index: 12; background: var(--bg); padding-block: 6px; margin: 0 -6px 4px; }
  .m-back { display: flex; align-items: center; gap: 2px; color: var(--accent); font-size: 17px; padding: 6px 4px; }
  .m-back .ic { width: 22px; height: 22px; }
  .m-bar .spacer { flex: 1; }
  .m-bar .ib { width: 38px; height: 38px; color: var(--accent); }
  .m-bar .ib .ic { width: 22px; height: 22px; }
  .lh { padding: 4px 4px 6px; }
  .sec-h, .grp-h, .hrow, .day-h, .lb-h { margin-left: 4px; margin-right: 4px; }
  .lh-title { font-size: 28px; }
  .lh > .ib { display: none; }
  .lh-sub, .lh-notes, .lh-meta, .tagbar { padding-left: 44px; padding-right: 4px; }
  .lh-banner { margin-left: 44px; }
  .row { padding: 10px 6px; align-items: center; }
  .row .r-line { min-height: 24px; }
  .cb { margin-top: 0; border-radius: 6px; }
  .cb .ic { width: 14px; height: 14px; }
  .r-ic, .r-star, .r-moon, .r-box { width: 16px; height: 16px; }
  .r-sub { font-size: 13px; }
  .r-when, .tg, .r-ck, .dl { font-size: 12px; }
  .card { margin: 8px 0 16px; padding: 14px 14px 12px; }
  .c-title { font-size: 17px; line-height: 24px; }
  .c-body { padding-left: 30px; }
  .c-tpl { margin-left: 30px; }
  .ck-item { min-height: 40px; }
  .ck-box { width: 17px; height: 17px; }
  .chip { font-size: 15px; }
  .c-tools .ib { width: 38px; height: 38px; }
  .hrow .ib { opacity: 1; width: 34px; height: 34px; }
  .grp-h, .sec-h { font-size: 15px; }
  .magic { right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; }
  .magic .ic { width: 26px; height: 26px; }
  .pop, .pop.wide { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-height: 86%; border-radius: 16px 16px 0 0; padding: 10px 12px; padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); animation: sheetIn .2s ease-out; }
  @keyframes sheetIn { from { transform: translateY(30%); opacity: .4; } }
  .pop .pk-opt, .pop .menu-i, .pop .pick-i { min-height: 44px; font-size: 16px; }
  .cal-d { height: 40px; font-size: 15px; }
  .modal, .modal.narrow { top: auto; bottom: 0; transform: none; left: 0; right: 0; width: auto; max-height: 92%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: sheetIn .2s ease-out; }
  .modal.top { top: 0; bottom: auto; border-radius: 0 0 16px 16px; max-height: 100%; padding-top: env(safe-area-inset-top, 0px); }
  .qf-res { max-height: none; }
  .pk-in, .field, .qf-in input, .qe-title, .ck-input, .h-title, .rp-row select, .rp-row input, .tm-row select { font-size: 16px; }
  .sel-mode .sel-ring { display: inline-flex; flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--cb); align-items: center; justify-content: center; color: transparent; }
  .sel-mode .selected .sel-ring { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .sel-mode .sel-ring .ic { width: 13px; height: 13px; }
  .sel-mode .row .cb { display: none; }
  .sel-mode .row.selected { background: var(--sel); }
  .batch { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); transform: none; justify-content: space-between; border-radius: 16px; max-width: none; }
  .batch .bcount { display: none; }
  .batch button { flex: 1; padding: 6px 2px; }
  .m-bar .sel-count { flex: 1; text-align: center; font-weight: 650; font-size: 16px; }
  .sb-foot { padding-right: calc(92px + env(safe-area-inset-right, 0px)); }
  .sb-foot [data-action="quick-entry"] { display: none; }
  .toasts { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* template modal, quick entry, find */
.modal .card { margin: 0; padding: 0; box-shadow: none; background: transparent; animation: none; }
.tpl-modal .modal-b { padding-top: 0; }
.qe-modal .qe .c-notes { min-height: 44px; }
.find .qf-res:empty { display: none; }
.menu .menu-i { font-size: 13.5px; }
@media (max-width: 760px) { .menu .menu-i { font-size: 16px; } }
[data-sec^="areaprojects"]:not(:empty) { margin-top: 16px; }

/* sync */
.sync-ind .ic { width: 18px; height: 18px; }
.sync-ind.synced { color: var(--c-logbook); }
.sync-ind.syncing, .sync-ind.connecting { color: var(--accent); animation: syncPulse 1.2s ease-in-out infinite; }
.sync-ind.offline { color: var(--faint); }
.sync-ind.error { color: var(--red); }
@keyframes syncPulse { 50% { opacity: .35; } }
.steps { margin: 0 0 12px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.steps code, .modal-b code { font: 12px var(--mono); background: var(--hover); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; }
.rules-box { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.rules-box pre { margin: 0; width: 100%; overflow-x: auto; font: 11.5px/1.45 var(--mono); padding: 10px 12px; border-radius: 8px; background: var(--hover); }

/* one-line fields that wrap: textareas styled like the text around them */
textarea[data-oneline] { display: block; resize: none; overflow: hidden; -webkit-appearance: none; appearance: none; border-radius: 0; overflow-wrap: anywhere; }
.c-top { align-items: flex-start; }

/* formatted notes */
.notes-view { cursor: text; overflow-wrap: anywhere; min-height: 0; }
.notes-view > :first-child { margin-top: 0; }
.notes-view > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .55em; }
.md ul, .md ol { margin: 0 0 .55em; padding-left: 1.35em; }
.md li { margin: .1em 0; }
.md li.md-task { list-style: none; position: relative; }
.md li.md-task::before { content: "☐"; position: absolute; left: -1.25em; color: var(--muted); }
.md li.md-task.done::before { content: "☑"; color: var(--accent); }
.md li.md-task.done { color: var(--muted); text-decoration: line-through; }
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; cursor: pointer; overflow-wrap: anywhere; }
.md code { font: .9em var(--mono); background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.md strong { font-weight: 650; }
.md del { color: var(--muted); }
.md blockquote { margin: 0 0 .55em; padding-left: 10px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.md .md-h1 { font-size: 1.2em; font-weight: 700; margin-bottom: .35em; }
.md .md-h2 { font-size: 1.08em; font-weight: 700; margin-bottom: .3em; }
.md .md-h3 { font-weight: 700; margin-bottom: .25em; }
.c-notes.notes-view { margin-top: 6px; }
.lh-notes.notes-view { padding-top: 6px; padding-bottom: 2px; }

/* checklist grip and menu */
.ck-item .ck-more, .ck-item .ck-grip { opacity: 0; transition: opacity .12s; }
.ck-item:hover .ck-more, .ck-item:hover .ck-grip, .ck-item:focus-within .ck-more, .touch .ck-more, .touch .ck-grip { opacity: .6; }
.ck-more { width: 24px; height: 24px; }
.ck-more .ic { width: 16px; height: 16px; }
.ck-grip { flex: none; width: 22px; height: 26px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.ck-grip .ic { width: 14px; height: 14px; }
.ck-item.ck-dragging { background: var(--hover); border-radius: 6px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); position: relative; z-index: 2; }
.ck-item.ck-dragging .ck-grip { opacity: 1; cursor: grabbing; }

/* repeating projects */
.cb.tpl-cb { border-style: dashed; opacity: .45; pointer-events: none; }
.rp-banner { gap: 8px; }
.rp-banner .ic { width: 16px; height: 16px; color: var(--accent); flex: none; }
.rp-banner span { flex: 1; min-width: 0; }

/* backups */
.bk-list { display: flex; flex-direction: column; }
.bk-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.bk-row:first-child { border-top: 0; }
.bk-main { flex: 1; min-width: 180px; }
.bk-main small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 760px) { .ck-grip { width: 30px; height: 34px; } .ck-more { width: 32px; height: 32px; } .lh-notes.notes-view { padding-left: 44px; } }

.ck-item { align-items: flex-start; }
.ck-item .ck-input { line-height: 20px; padding: 5px 0; }
.ck-item .ck-box { margin-top: 8.5px; }
.ck-item .ck-more { margin-top: 3px; }
.ck-item .ck-grip { margin-top: 2px; }
@media (max-width: 760px) {
  .ck-item .ck-input { line-height: 23px; padding: 8px 0; }
  .ck-item .ck-box { margin-top: 11px; }
  .ck-item .ck-more { margin-top: 3px; }
  .ck-item .ck-grip { margin-top: 2px; }
}

.pop:focus, .pop:focus-visible { outline: none; }

/* share */
.share-modal .sh-fmt { margin-bottom: 4px; }
.sh-opts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 10px; }
.sh-opt { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.share-modal #sh-out { min-height: 240px; white-space: pre-wrap; overflow: auto; font: 13.5px/1.55 var(--ui); tab-size: 4; }
.share-modal #sh-out.csv { font: 12px/1.45 var(--mono); white-space: pre; }
#print-root { display: none; }
@media print {
  html.printing, html.printing body { height: auto !important; overflow: visible !important; background: #fff !important; padding: 0 !important; }
  html.printing body > *:not(#print-root) { display: none !important; }
  html.printing #print-root { display: block !important; }
}
@media (max-width: 760px) {
  .share-modal .modal-f .btn { flex: 1 1 0; margin-right: 0 !important; white-space: nowrap; }
  .share-modal .modal-f .btn.primary { order: -1; flex-basis: 100%; padding-block: 11px; }

.exp-bar { display: flex; align-items: center; gap: 14px; margin: 18px 10px 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }
.exp-bar span { flex: 1; }
.exp-bar .link-btn { text-transform: none; letter-spacing: 0; font-size: 12.5px; font-weight: 600; }
.exp-bar .link-btn:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.disc { flex: none; width: 20px; height: 20px; margin: 0 -4px 0 -6px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; transition: transform .15s; }
.disc:hover { background: var(--hover); color: var(--fg); }
.disc .ic { width: 14px; height: 14px; }
.disc .ic svg { stroke-width: 2.4; }

.chip.linkc.done { color: var(--muted); }
@media (max-width: 760px) {
  .disc { width: 28px; height: 28px; margin: 0 -2px 0 -8px; }
  .disc .ic { width: 16px; height: 16px; }
  .pchildren { margin-left: 18px; padding-left: 6px; }
  .prow .open-proj { width: 34px; height: 34px; }
}

/* ---- Tags picker ---- */

  openLayer({ modal: true, html: `<div class="modal-h"><h2>Export Backup</h2><button class="ib" data-action="close-layer" aria-label="Close">${ic('x')}</button></div><div class="modal-b"><p style="margin-top:0">${plural(n, 'to-do')}, ${plural(S.projects.length, 'project')}, ${plural(S.areas.length, 'area')} and ${plural(S.tags.length, 'tag')}. ${canSave ? 'Save the file somewhere safe, or copy the text.' : 'Copy the text and keep it in a file somewhere safe.'}</p><textarea class="ta" id="ex-ta" readonly aria-label="Backup data">${esc(json)}</textarea><p class="note" id="ex-note"></p></div><div class="modal-f"><button class="btn${canSave ? '' : ' primary'}" data-ex="copy">Copy</button>${canSave ? `<button class="btn primary" data-ex="file">Save ${esc(name)}</button>` : ''}</div>`,
    onMount: (el) => el.addEventListener('click', async (e) => {

      const note = $('#ex-note', el);

      else { try { await navigator.clipboard.writeText(json); note.textContent = 'Copied. Paste it into a text file to keep it.'; } catch (err) { const ta = $('#ex-ta', el); ta.focus(); ta.select(); note.textContent = 'Press ' + MODK + 'C to copy the selected text.'; } }
    }) });
}
function openImport() {
  let pending = null;
  const L = openLayer({ modal: true, html: `<div class="modal-h"><h2>Import</h2><button class="ib" data-action="close-layer" aria-label="Close">${ic('x')}</button></div><div class="modal-b">
    <p style="margin-top:0">Choose a Sectis backup file, or paste its text. You can also paste a plain list to add each line as a to-do in your Inbox.</p>
    <input type="file" id="im-file" accept=".json,application/json,text/plain" aria-label="Backup file"><textarea class="ta" id="im-ta" placeholder="…or paste here" aria-label="Backup text" style="margin-top:10px;min-height:120px"></textarea><p class="note" id="im-note"></p></div>
    <div class="modal-f"><button class="btn" data-action="close-layer">Cancel</button><button class="btn primary" id="im-go" disabled>Import</button></div>`,

        } catch (e) {

        }

      go.addEventListener('click', async () => {
        if (!pending) return;
        if (pending.kind === 'backup') { const data = pending.data; await makeBackup('import'); commit('Import', () => { const keepFs = S.meta && S.meta.fileName; S = normalizeState(data); if (keepFs) S.meta.fileName = keepFs; S.meta.sampleLoaded = true; }); closeLayer(L); navigate('today'); toast('Backup imported', { undo: true }); }
        else { commit('Add To-Dos', () => { let o = topOrder(inboxItems()) - pending.lines.length; pending.lines.forEach((line) => { S.todos.push(makeTodo({ title: line, start: 'inbox', order: o++ })); }); }); closeLayer(L); navigate('inbox'); toast(`Added ${plural(pending.lines.length, 'to-do')}`, { undo: true }); }
      });
    } });
}

/* ===================== Sync (Firebase Firestore) =====================
   No accounts. A random sync key decides where the data lives in Firestore
   (a hash of it) and encrypts every record (AES-GCM) before upload.
   Each to-do, project, heading, area and tag is its own document; the most
   recent edit of an item wins. Deletions leave a small marker. */
const SYNC_KEY = 'sectis.sync.v1';
const FB_VERSION = '10.14.1';
const SYNC_KINDS = { todo: 'todos', project: 'projects', heading: 'headings', area: 'areas', tag: 'tags' };
const Y = {
  enabled: false, cfg: null, key: null, space: null, base: {}, pending: {}, cursor: [0, 0], lastSync: 0,
  status: 'off', error: '', db: null, col: null, aes: null, unsub: null, pushing: false, again: false,
  queue: Promise.resolve(), firstPull: null, hints: {}, applying: false,
};
const syncAvailable = () => SECTIS_WEB && !IN_FRAME && !!(window.crypto && crypto.subtle);

/* ---- small helpers ---- */
function canon(v) {
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
const recHash = (rec) => fnv(canon(rec));
function b64(bytes) { let s = ''; const a = new Uint8Array(bytes); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(str) { const s = atob(str); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
const utf8 = (s) => new TextEncoder().encode(s);
async function sha256hex(s) { const h = await crypto.subtle.digest('SHA-256', utf8(s)); return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join(''); }
function newSyncKey() {
  const bytes = crypto.getRandomValues(new Uint8Array(26)), A = 'abcdefghijkmnpqrstuvwxyz23456789';
  return Array.from(bytes, (b) => A[b % 32]).join('');
}
function syncHint(id) { Y.hints[id] = pd(T0()).getTime(); }

function syncSaveState() {
  if (!Y.enabled) { lsSet(SYNC_KEY, JSON.stringify({ enabled: false })); return; }
  lsSet(SYNC_KEY, JSON.stringify({ enabled: true, cfg: Y.cfg, key: Y.key, base: Y.base, pending: Y.pending, cursor: Y.cursor, lastSync: Y.lastSync }));
}
const syncSaveSoon = debounce(syncSaveState, 400);
window.addEventListener('pagehide', () => { if (Y.enabled) syncSaveSoon.flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && Y.enabled) syncSaveSoon.flush(); });
function syncLoadState() {
  try { const s = JSON.parse(lsGet(SYNC_KEY) || 'null'); if (s && s.enabled && s.cfg && s.key) Object.assign(Y, { enabled: true, cfg: s.cfg, key: s.key, base: s.base || {}, pending: s.pending || {}, cursor: s.cursor || [0, 0], lastSync: s.lastSync || 0 }); } catch (e) { /* ignore */ }
}

/* ---- Firebase config & join codes ---- */
function parseFirebaseConfig(text) {
  const t = String(text || '').trim(); if (!t) return null;
  let cfg = null;
  try { const j = JSON.parse(t); if (j && typeof j === 'object') cfg = j; } catch (e) { /* not JSON */ }
  if (!cfg) { cfg = {}; t.replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (m, k, v) => { cfg[k] = v; return m; }); }
  if (!cfg.apiKey || !cfg.projectId) return null;
  const out = { apiKey: cfg.apiKey, projectId: cfg.projectId };
  if (cfg.appId) out.appId = cfg.appId;
  out.authDomain = cfg.authDomain || `${cfg.projectId}.firebaseapp.com`;
  return out;
}
function makeJoinCode() {
  const json = JSON.stringify({ c: Y.cfg, k: Y.key });
  return 'SECTIS-' + btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function readJoinCode(code) {
  try {
    const raw = String(code || '').replace(/\s+/g, '').replace(/^SECTIS-/i, '').replace(/-/g, '+').replace(/_/g, '/');
    const j = JSON.parse(decodeURIComponent(escape(atob(raw + '==='.slice((raw.length + 3) % 4)))));
    if (j && j.c && j.c.apiKey && j.c.projectId && j.k && j.k.length >= 20) return { cfg: j.c, key: j.k };
  } catch (e) { /* fall through */ }
  return null;
}

/* ---- connection ---- */
function loadScript(src) {
  return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = resolve; s.onerror = () => reject(new Error('Couldn’t download the sync library. Check your internet connection.')); document.head.append(s); });
}
async function loadFirebase() {
  if (window.firebase && window.firebase.firestore) return window.firebase;
  const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}`;
  await loadScript(`${base}/firebase-app-compat.js`);
  await loadScript(`${base}/firebase-firestore-compat.js`);
  return window.firebase;
}
async function syncConnect(cfg, key) {
  const fb = await loadFirebase();
  try { const old = fb.apps && fb.apps.find((a) => a.name === 'sectis'); if (old) await old.delete(); } catch (e) { /* ignore */ }
  const app = fb.initializeApp(cfg, 'sectis');
  const db = app.firestore();
  const space = (await sha256hex('sectis-space|' + key)).slice(0, 40);
  const material = await crypto.subtle.importKey('raw', utf8(key), 'PBKDF2', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: utf8('sectis-sync-v1|' + space), iterations: 150000, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  return { fb, db, space, aes, col: db.collection('sectis').doc(space).collection('items') };
}
async function encryptRec(rec) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, Y.aes, utf8(JSON.stringify(rec)));
  return { c: b64(ct), iv: b64(iv) };
}
async function decryptRec(doc) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(doc.iv) }, Y.aes, unb64(doc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
function friendlySyncError(e) {
  const code = (e && (e.code || e.name)) || '';
  if (/permission/i.test(code)) return 'Your Firestore rules don’t allow Sectis yet. Add the Sectis rules in the Firebase console (Settings → Sync → How to set up).';
  if (/unavailable|network|timeout/i.test(code) || /network|timed out|internet/i.test((e && e.message) || '')) return 'Can’t reach Firebase right now. Changes are kept and will sync when you’re back online.';
  if (/not-found/i.test(code)) return 'This Firebase project has no Firestore database yet. Create one in the Firebase console.';
  if (/invalid-api-key|api-key/i.test(code + ((e && e.message) || ''))) return 'Firebase didn’t accept that config. Copy it again from Project settings → Your apps.';
  return (e && e.message) || 'Sync stopped because of an unexpected error.';
}
function setSyncStatus(status, error = '') {
  Y.status = status; Y.error = error;
  renderSyncIndicator();
  const el = document.getElementById('sync-status'); if (el) el.innerHTML = syncStatusText();
}
function syncStatusText() {
  if (!Y.enabled) return 'Off';
  if (Y.status === 'error') return `<span class="warn">${esc(Y.error)}</span>`;
  if (Y.status === 'offline') return 'Offline. Changes will sync when you reconnect.';
  if (Y.status === 'connecting') return 'Connecting…';
  if (Y.status === 'syncing') return 'Syncing…';
  const pend = Object.keys(Y.pending).length;
  return `On${Y.lastSync ? ` · last synced ${esc(relTime(Y.lastSync))}` : ''}${pend ? ` · ${plural(pend, 'change')} waiting` : ''}`;
}
function relTime(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 45) return 'just now'; if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} hr ago`;
  return new Date(ms).toLocaleDateString();
}
function renderSyncIndicator() {
  const el = document.getElementById('sync-ind'); if (!el) return;
  el.hidden = !Y.enabled;
  el.className = `ib sync-ind ${Y.status}`;
  el.title = Y.enabled ? `Sync: ${syncStatusText().replace(/<[^>]+>/g, '')}` : '';
}

/* ---- pushing local changes ---- */
function syncRecords() {
  const out = new Map();
  for (const [kind, list] of Object.entries(SYNC_KINDS)) for (const r of S[list]) if (r && r.id && !r.isDraft) out.set(r.id, { k: kind, rec: r });
  return out;
}
function syncDiff() {
  const recs = syncRecords(), now = Date.now(); let changed = false;
  for (const [id, { k, rec }] of recs) {
    const h = recHash(rec), b = Y.base[id];
    if (b && !b.d && b.h === h) continue;
    const m = Y.hints[id] ? Math.max(Y.hints[id], ((b && b.m) || 0) + 1) : Math.max(now, ((b && b.m) || 0) + 1);
    Y.pending[id] = { k, m }; Y.base[id] = { h, m, k }; changed = true;
  }
  for (const id of Object.keys(Y.base)) {
    const b = Y.base[id];
    if (recs.has(id) || b.d) continue;
    const m = Math.max(now, (b.m || 0) + 1);
    Y.pending[id] = { k: b.k, m, d: true }; Y.base[id] = { h: '', m, k: b.k, d: true }; changed = true;
  }
  Y.hints = {};
  if (changed) syncSaveSoon();
  return changed;
}
function syncLocalSaved() {
  if (!Y.enabled || Y.applying || !Y.col) return;
  if (syncDiff()) pushSoon();
}
const pushSoon = debounce(() => syncPush(), 600);
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error(msg), { code: 'timeout' })), ms))]); }
async function syncPush() {
  if (!Y.enabled || !Y.col) return;
  if (Y.pushing) { Y.again = true; return; }
  const ids = Object.keys(Y.pending);
  if (!ids.length) { if (Y.status === 'syncing') setSyncStatus('synced'); return; }
  Y.pushing = true; setSyncStatus('syncing');
  try {
    const recs = syncRecords();
    for (let i = 0; i < ids.length; i += 400) {
      const chunk = ids.slice(i, i + 400), sent = {};
      const batch = Y.db.batch();
      for (const id of chunk) {
        const p = Y.pending[id]; if (!p) continue;
        const r = recs.get(id);
        const ts = Y.fb.firestore.FieldValue.serverTimestamp();
        if (r && !p.d) batch.set(Y.col.doc(id), Object.assign({ k: p.k, m: p.m, d: false, t: ts }, await encryptRec(r.rec)));
        else batch.set(Y.col.doc(id), { k: p.k, m: p.m, d: true, c: '', iv: '', t: ts });
        sent[id] = p.m;
      }
      await withTimeout(batch.commit(), 20000, 'Sync timed out');
      for (const id of Object.keys(sent)) if (Y.pending[id] && Y.pending[id].m === sent[id]) delete Y.pending[id];
    }
    Y.lastSync = Date.now(); syncSaveState();
    setSyncStatus('synced');
  } catch (e) {
    setSyncStatus(navigator.onLine === false || (e && e.code === 'timeout') ? 'offline' : 'error', friendlySyncError(e));
  } finally {
    Y.pushing = false;
    if (Y.again) { Y.again = false; setTimeout(syncPush, 50); }
  }
}

/* ---- pulling remote changes ---- */
function normalizeRecord(kind, rec) {
  if (kind === 'todo') return Object.assign(newTodoShape(), rec, { tags: rec.tags || [], checklist: rec.checklist || [] });
  if (kind === 'project') return Object.assign(newProjectShape(), rec, { tags: rec.tags || [] });
  if (kind === 'area') return Object.assign({ title: '', tags: [], order: 0 }, rec, { tags: rec.tags || [] });
  return rec;
}
function tsAfter(t, cur) { return t.seconds > cur[0] || (t.seconds === cur[0] && t.nanoseconds > cur[1]); }
async function syncApplyRemote(docs) {
  const updates = [];
  for (const d of docs) {
    if (d.t && typeof d.t.seconds === 'number' && tsAfter(d.t, Y.cursor)) Y.cursor = [d.t.seconds, d.t.nanoseconds];
    if (!SYNC_KINDS[d.k]) continue;
    const b = Y.base[d.id];
    if (b && d.m <= b.m) { if (Y.pending[d.id] && Y.pending[d.id].m === d.m) delete Y.pending[d.id]; continue; }
    let rec = null;
    if (!d.d) { try { rec = await decryptRec(d); } catch (e) { continue; } }
    updates.push({ id: d.id, k: d.k, m: d.m, d: !!d.d, rec });
  }
  if (updates.length) {
    Y.applying = true;
    try {
      for (const u of updates) {
        const list = S[SYNC_KINDS[u.k]];
        const i = list.findIndex((x) => x.id === u.id);
        if (u.d) { if (i >= 0) list.splice(i, 1); Y.base[u.id] = { h: '', m: u.m, k: u.k, d: true }; }
        else { const rec = normalizeRecord(u.k, u.rec); if (i >= 0) list[i] = rec; else list.push(rec); Y.base[u.id] = { h: recHash(rec), m: u.m, k: u.k }; }
        delete Y.pending[u.id];
      }
      reindex();
      for (const id of [...ui.sel]) if (!itemById(id)) ui.sel.delete(id);
      if (ui.editing && !getT(ui.editing)) ui.editing = null;
      undoStack.length = 0; // undo would otherwise roll back changes made on the other device
      S.savedAt = Date.now(); lsSet(STORE_KEY, JSON.stringify(S)); syncSaveState();
      if (typeof fileSyncWrite === 'function') fileSyncWrite(JSON.stringify(S));
    } finally { Y.applying = false; }
    render();
  }
  Y.lastSync = Date.now(); syncSaveSoon();
  if (Y.status !== 'error' && !Y.pushing) setSyncStatus('synced'); else renderSyncIndicator();
}
function syncListen() {
  if (Y.unsub) { try { Y.unsub(); } catch (e) { /* ignore */ } }
  let resolveFirst; Y.firstPull = new Promise((r) => { resolveFirst = r; });
  const since = new Y.fb.firestore.Timestamp(Y.cursor[0], Y.cursor[1]);
  Y.unsub = Y.col.where('t', '>', since).orderBy('t').onSnapshot((snap) => {
    const docs = snap.docChanges().filter((c) => c.type !== 'removed' && !c.doc.metadata.hasPendingWrites).map((c) => Object.assign({ id: c.doc.id }, c.doc.data()));
    Y.queue = Y.queue.then(() => syncApplyRemote(docs)).catch(() => {}).then(() => resolveFirst());
  }, (err) => { setSyncStatus('error', friendlySyncError(err)); resolveFirst(); });
  return Y.firstPull;
}

/* ---- start, set up, join, stop ---- */
async function syncStart() {
  if (!Y.enabled || !syncAvailable()) return;
  setSyncStatus('connecting');
  try {
    const c = await syncConnect(Y.cfg, Y.key);
    Object.assign(Y, c);
    const first = syncListen();
    syncDiff(); pushSoon();
    await Promise.race([first, new Promise((r) => setTimeout(r, 6000))]);
  } catch (e) {
    setSyncStatus(navigator.onLine === false ? 'offline' : 'error', friendlySyncError(e));
  }
}
async function syncSetup(cfg) {
  const key = newSyncKey();
  const c = await syncConnect(cfg, key);
  Object.assign(Y, c, { enabled: true, cfg, key, base: {}, pending: {}, cursor: [0, 0], lastSync: 0, hints: {} });
  syncDiff();
  setSyncStatus('syncing');
  await syncPushOrThrow();
  syncSaveState(); syncListen();
  setSyncStatus('synced');
}
async function syncPushOrThrow() {
  await syncPush();
  if (Y.status === 'error' || Y.status === 'offline') { const msg = Y.error; syncStopLocal(); throw new Error(msg); }
}
async function syncJoin(code) {
  const j = readJoinCode(code);
  if (!j) throw new Error('That doesn’t look like a Sectis join code. Copy the whole code from Settings → Sync on your other device.');
  const c = await syncConnect(j.cfg, j.key);
  let hasRemote = false;
  try { const snap = await withTimeout(c.col.limit(1).get(), 15000, 'Timed out'); hasRemote = !snap.empty; }
  catch (e) { throw new Error(friendlySyncError(e)); }
  let mode = 'merge';
  if (hasRemote) {
    const localReal = S.todos.some((t) => !t.sample && !t.isDraft) || S.projects.some((p) => !p.sample) || S.areas.some((a) => !a.sample);
    if (localReal) {
      const r = await choiceDialog({ title: 'This device already has to-dos', body: 'Keep them and add them to the synced list, or replace them with what’s already synced?', choices: [{ id: 'replace', label: 'Use Synced To-Dos' }, { id: 'merge', label: 'Keep Both', primary: true }] });
      if (!r) throw Object.assign(new Error(''), { quiet: true });
      mode = r;
    } else mode = 'replace';
  }
  if (mode === 'replace' && hasRealData()) await makeBackup('join');
  snapshot('Join Sync');
  if (mode === 'replace') { for (const list of Object.values(SYNC_KINDS)) S[list] = []; reindex(); }
  else if (hasRemote) dropSampleData(); // the other device already has the tour
  Object.assign(Y, c, { enabled: true, cfg: j.cfg, key: j.key, base: {}, pending: {}, cursor: [0, 0], lastSync: 0, hints: {} });
  setSyncStatus('syncing');
  await Promise.race([syncListen(), new Promise((r) => setTimeout(r, 15000))]);
  if (mode === 'merge') dedupeTags();
  syncDiff(); syncSaveState();
  await syncPush();
  generateRepeats();
  saveNow(); render();
  if (Y.status !== 'error') setSyncStatus('synced');
  return mode;
}
function dedupeTags() {
  const seen = new Map(), remap = {};
  for (const t of S.tags.slice().sort((a, b) => ((Y.base[a.id] && !Y.pending[a.id]) ? 0 : 1) - ((Y.base[b.id] && !Y.pending[b.id]) ? 0 : 1))) {
    const k = t.title.trim().toLowerCase();
    if (seen.has(k)) remap[t.id] = seen.get(k); else seen.set(k, t.id);
  }
  if (!Object.keys(remap).length) return;
  S.tags = S.tags.filter((t) => !remap[t.id]);
  S.tags.forEach((t) => { if (remap[t.parentId]) t.parentId = remap[t.parentId]; });
  S.todos.concat(S.projects, S.areas).forEach((x) => { if (x.tags.some((id) => remap[id])) x.tags = Array.from(new Set(x.tags.map((id) => remap[id] || id))); });
  reindex();
}
function syncStopLocal() {
  if (Y.unsub) { try { Y.unsub(); } catch (e) { /* ignore */ } }
  Object.assign(Y, { enabled: false, cfg: null, key: null, space: null, base: {}, pending: {}, cursor: [0, 0], lastSync: 0, db: null, col: null, aes: null, unsub: null });

/* ---- data file (Chrome/Edge): keep to-dos in a JSON file, e.g. on a thumb drive ---- */
const fileSync = { handle: null, name: null, needsPermission: false, writing: false, pending: null };
function fileSyncSupported() { return !IN_FRAME && typeof window.showSaveFilePicker === 'function' && 'indexedDB' in window; }
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('sectis', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { const db = req.result; const tx = db.transaction('kv', mode); const st = tx.objectStore('kv'); const r = fn(st); tx.oncomplete = () => { resolve(r && 'result' in r ? r.result : undefined); db.close(); }; tx.onerror = () => reject(tx.error); };
  });
}
const idbGet = (k) => idb('readonly', (s) => s.get(k));
const idbSet = (k, v) => idb('readwrite', (s) => s.put(v, k));
const idbDel = (k) => idb('readwrite', (s) => s.delete(k));
async function fileSyncInit() {
  if (!fileSyncSupported()) return;
  try {
    const h = await idbGet('dataFile'); if (!h) return;
    fileSync.handle = h; fileSync.name = h.name;
    const p = await h.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') await fileSyncLoad(); else { fileSync.needsPermission = true; showFileBanner(); }
  } catch (e) { /* no stored file */ }
}
async function fileSyncLoad() {
  const text = await (await fileSync.handle.getFile()).text();
  if (text.trim()) {
    const data = JSON.parse(text);
    if (Array.isArray(data.todos) && (data.savedAt || 0) > (S.savedAt || 0)) { S = normalizeState(data); reindex(); generateRepeats(); lsSet(STORE_KEY, JSON.stringify(S)); render(); toast(`Loaded ${fileSync.name}`); return; }
  }
  fileSyncWrite(JSON.stringify(S));
}
function fileSyncWrite(json) {
  if (!fileSync.handle || fileSync.needsPermission) return;
  fileSync.pending = json;
  if (fileSync.writing) return;
  fileSync.writing = true;
  (async () => {
    while (fileSync.pending) {
      const data = fileSync.pending; fileSync.pending = null;
      try { const w = await fileSync.handle.createWritable(); await w.write(data); await w.close(); }
      catch (e) { fileSync.needsPermission = true; showFileBanner(); break; }
    }
    fileSync.writing = false;
  })();
}
const FILE_TYPES = [{ description: 'Sectis data', accept: { 'application/json': ['.json'] } }];
async function fileSyncCreate() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'sectis-data.json', types: FILE_TYPES });
    Object.assign(fileSync, { handle: h, name: h.name, needsPermission: false });
    await idbSet('dataFile', h); saveNow(); toast(`Now saving to ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast('That file can’t be used. Try another folder.'); }
}

    if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') { toast('Sectis needs permission to save to that file'); return; }
    Object.assign(fileSync, { handle: h, name: h.name, needsPermission: false });

/* ---- updates: an installed copy (Dock or Home Screen) can stay open for days,
   so it checks for a newer version and offers to load it ---- */
const upd = { checkedAt: 0, latest: null, offered: null };
function updatesAvailable() { return typeof SECTIS_WEB !== 'undefined' && SECTIS_WEB && !IN_FRAME && /^https?:/.test(location.protocol); }
function newerVersion(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); }
  return false;
}
async function checkForUpdate(manual) {
  if (!updatesAvailable()) return null;
  upd.checkedAt = Date.now();
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('bad response');
    const v = (await r.json()).version;
    upd.latest = v;
    if (v && newerVersion(v, APP_VERSION)) {
      const msg = `Sectis ${v} is available`;
      if (manual || !$$('#toasts .t-msg').some((m) => m.textContent === msg)) {
        upd.offered = v;
        toast(msg, { action: 'Update Now', fn: applyUpdate, ms: 30 * 60e3 });
      }
      return v;
    }
    return false;
  } catch (e) { return null; }
}
async function applyUpdate() {
  toast('Updating…', { ms: 8000 });
  try { saveNow(); } catch (e) { /* ignore */ }
  try { if (typeof syncSaveState === 'function' && Y.enabled) syncSaveState(); } catch (e) { /* ignore */ }
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await Promise.race([reg.update(), new Promise((res) => setTimeout(res, 5000))]);
  } catch (e) { /* ignore */ }
  try { // drop the old version's saved files so the reload can't fall back to them
    const keep = `sectis-${upd.latest}`;
    const keys = await caches.keys();
    await Promise.all(keys.filter((k) => k.startsWith('sectis-') && k !== keep).map((k) => caches.delete(k)));
  } catch (e) { /* ignore */ }
  try { await fetch(location.pathname, { cache: 'reload' }); } catch (e) { /* refresh the browser's copy of the page */ }
  location.reload();
}

/* ===================== Formatted notes =====================
   Notes are plain text with light Markdown: **bold**, *italic*, ~~strike~~, `code`,

function safeHref(url) {

  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
  if (/^www\./i.test(u) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return 'https://' + u;
  return null;
}
function mdInline(raw) {
  const tokens = [];
  const keep = (html) => `\u0001${tokens.push(html) - 1}\u0002`;
  const link = (href, text) => keep(`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${text}</a>`);
  let s = String(raw).replace(/[\u0001\u0002]/g, '');
  s = s.replace(/`([^`\n]+)`/g, (m, c) => keep(`<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, text, url) => { const h = safeHref(url); return h ? link(h, esc(text)) : m; });
  s = s.replace(/\b((?:https?:\/\/|www\.)[^\s<>"'\u0001\u0002]+)/gi, (m, url) => {
    let trail = '';
    while (/[.,;:!?'")\]]$/.test(url)) {
      if (url.endsWith(')') && (url.match(/\(/g) || []).length >= (url.match(/\)/g) || []).length) break;
      trail = url.slice(-1) + trail; url = url.slice(0, -1);
    }
    const h = safeHref(url);
    return (h ? link(h, esc(url)) : esc(url)) + trail;
  });
  s = s.replace(/\b([\w.+-]+@[\w-]+(?:\.[\w-]+)+)\b/g, (m, e) => keep(`<a href="mailto:${esc(e)}">${esc(e)}</a>`));
  s = esc(s);
  s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, (m, x) => (/\s$/.test(x) ? m : `<strong>${x}</strong>`));
  s = s.replace(/(^|[^\w])__(?=\S)(.+?)__(?!\w)/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<strong>${x}</strong>`));
  s = s.replace(/(^|[^\w*])\*(?=[^\s*])([^*]+?)\*(?![\w*])/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<em>${x}</em>`));
  s = s.replace(/(^|[^\w])_(?=[^\s_])([^_]+?)_(?!\w)/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<em>${x}</em>`));
  s = s.replace(/~~(?=\S)(.+?)~~/g, (m, x) => `<del>${x}</del>`);
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => tokens[+i]);
}
function renderMarkdown(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  let html = '', list = null, para = [];
  const flush = () => { if (para.length) { html += `<p>${para.map(mdInline).join('<br>')}</p>`; para = []; } };
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  const open = (tag, start) => { if (list !== tag) { close(); html += tag === 'ol' && start && start !== '1' ? `<ol start="${+start}">` : `<${tag}>`; list = tag; } };
  for (const line of lines) {
    let m;
    if (!line.trim()) { flush(); close(); continue; }
    if ((m = line.match(/^\s{0,3}(#{1,3})\s+(.+)$/))) { flush(); close(); html += `<p class="md-h${m[1].length}">${mdInline(m[2])}</p>`; continue; }
    if ((m = line.match(/^\s*[-*•+]\s+\[( |x|X)\]\s+(.*)$/))) { flush(); open('ul'); html += `<li class="md-task${m[1] === ' ' ? '' : ' done'}">${mdInline(m[2])}</li>`; continue; }
    if ((m = line.match(/^\s*[-*•+]\s+(.*)$/))) { flush(); open('ul'); html += `<li>${mdInline(m[1])}</li>`; continue; }
    if ((m = line.match(/^\s*(\d{1,4})[.)]\s+(.*)$/))) { flush(); open('ol', m[1]); html += `<li>${mdInline(m[2])}</li>`; continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { flush(); close(); html += `<blockquote>${mdInline(m[1])}</blockquote>`; continue; }
    close(); para.push(line);
  }
  flush(); close();
  return html;
}

/* switch between the formatted view and the text box */

/* ===================== Checklist: reorder and spin off ===================== */
function ckMove(todoId, ckId, dir) {
  const t = getT(todoId); if (!t) return;
  const i = t.checklist.findIndex((c) => c.id === ckId), j = i + dir;
  if (i < 0 || j < 0 || j >= t.checklist.length) return;
  commit('Reorder Checklist', () => { const [c] = t.checklist.splice(i, 1); t.checklist.splice(j, 0, c); touch(t); }, { render: false });
  ui.focusAfter = `[data-fkey="ck-${ckId}"]`; render();
  const el = $(`[data-fkey="ck-${CSS.escape(ckId)}"]`); if (el) { const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) { /* ignore */ } }
}
function ckToTodo(todoId, ckId) {
  const t = getT(todoId); if (!t) return;
  const i = t.checklist.findIndex((c) => c.id === ckId); if (i < 0) return;
  const c = t.checklist[i];
  if (!c.title.trim()) { ckRemove(todoId, ckId, false); return; }
  commit('Make To-Do', () => {
    t.checklist.splice(i, 1); touch(t);
    const nt = makeTodo({
      title: c.title.trim(), start: t.start, when: t.when, evening: t.evening,
      projectId: t.projectId, areaId: t.areaId, headingId: t.headingId, tags: t.tags.slice(),
      status: c.done ? 'done' : 'open', completedAt: c.done ? Date.now() : null,
    });
    const after = S.todos.filter((x) => x !== t && !x.trashed && containerKey(x) === containerKey(t) && x.order > t.order);
    nt.order = orderBetween(t.order, minOf(after, 'order'))[0];
    const afterToday = S.todos.filter((x) => x !== t && x.todayOrder > t.todayOrder);
    nt.todayOrder = orderBetween(t.todayOrder, minOf(afterToday, 'todayOrder'))[0];
    S.todos.push(nt);
