  for (const d of docs) {
    if (d.t && typeof d.t.seconds === 'number' && tsAfter(d.t, cursor)) cursor = [d.t.seconds, d.t.nanoseconds];
    if (!SYNC_KINDS[d.k]) continue;
    const b = Y.base[d.id];
    if (b && (opts.theirs ? d.m < b.m : d.m <= b.m)) { if (Y.pending[d.id] && Y.pending[d.id].m === d.m) delete Y.pending[d.id]; continue; }
    let rec = null;
    if (!d.d) { try { rec = await decryptRec(d); } catch (e) { continue; } }
    updates.push({ id: d.id, k: d.k, m: d.m, d: !!d.d, rec });
  }
  if (updates.length) {
    Y.applying = true;
    try {
      for (const u of updates) {
        const list = S[SYNC_KINDS[u.k]];
        const i = list.findIndex((x) => x.id === u.id);
        if (u.d) { if (i >= 0) list.splice(i, 1); Y.base[u.id] = { h: '', m: u.m, k: u.k, d: true }; }
        else { const rec = normalizeRecord(u.k, u.rec); if (i >= 0) list[i] = rec; else list.push(rec); Y.base[u.id] = { h: recHash(rec), m: u.m, k: u.k }; }
        delete Y.pending[u.id];
      }
      converted = convertHeadings(); // a heading from a device on an older version becomes a sub-project
      reindex();
      for (const id of [...ui.sel]) if (!itemById(id)) ui.sel.delete(id);
      if (ui.editing && !getT(ui.editing)) ui.editing = null;
      undoStack.length = 0; // undo would otherwise roll back changes made on the other device
      S.savedAt = Date.now(); lsSet(STORE_KEY, JSON.stringify(S));
      if (typeof fileSyncWrite === 'function') fileSyncWrite(JSON.stringify(S));
    } finally { Y.applying = false; }
    if (!opts.theirs) Y.cursor = cursor; // (copies read while sending don't move it: changes before them may still be on the way)
    syncSaveState();
    if (converted) saveSoon(); // send the sub-projects back out
    render();
  } else if (!opts.theirs) Y.cursor = cursor;
  Y.lastSync = Date.now(); syncSaveSoon();
  if (Y.status !== 'error' && !Y.pushing) setSyncStatus('synced'); else renderSyncIndicator();
}
function syncListen() {

  const since = new Y.fb.firestore.Timestamp(Y.cursor[0], Y.cursor[1]);
  Y.unsub = Y.col.where('t', '>', since).orderBy('t').onSnapshot((snap) => {
    const docs = snap.docChanges().filter((c) => c.type !== 'removed' && !c.doc.metadata.hasPendingWrites).map((c) => Object.assign({ id: c.doc.id }, c.doc.data()));
    Y.queue = Y.queue.then(() => syncApplyRemote(docs)).catch(() => {}).then(() => resolveFirst());

/* ---- start, set up, join, stop ---- */
async function syncStart() {
  if (!Y.enabled || !syncAvailable()) return;
  setSyncStatus('connecting');
  if (navigator.onLine === false) syncReady(); // nothing can come in: stamp edits as they're made
  try {
    const c = await syncConnect(Y.cfg, Y.key);
    Object.assign(Y, c);
    const first = syncListen();
    // the other devices' changes first (a slow connection gets 20 seconds); then what changed here goes up
    const came = await Promise.race([first.then(() => true), new Promise((r) => setTimeout(() => r(false), 20000))]);
    syncReady(); pushSoon();
    if (came && lsGet('sectis.sync.check') !== SYNC_CHECK) syncCheckAll().then((r) => { if (r) lsSet('sectis.sync.check', SYNC_CHECK); }).catch(() => {});
  } catch (e) {
    syncReady();

/* compare everything with what's in Firebase: what another device changed that never arrived

async function syncCheckAll() {

  snap.forEach((doc) => {

    if (!SYNC_KINDS[d.k] || typeof d.m !== 'number' || Y.pending[d.id]) return;
    const b = Y.base[d.id];

    else if (d.m < b.m && (b.d || recs.has(d.id))) { Y.pending[d.id] = b.d ? { k: b.k, m: b.m, d: true } : { k: b.k, m: b.m }; up++; }
  });

function checkReminders() {
  const T = T0(), now = new Date(), hm = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
  const fired = S.meta.fired || (S.meta.fired = {});
  let changed = false;
  for (const t of S.todos) {
    if (t.status !== 'open' || t.trashed || t.isTemplate || t.isDraft || !t.reminder || t.when !== T || t.reminder > hm) continue;
    const key = `${t.id}@${T}@${t.reminder}`;
    if (fired[key]) continue;
    fired[key] = Date.now(); changed = true;
    toast(`Reminder: ${t.title || 'New To-Do'}`, { action: 'Open', fn: () => revealTodo(t.id), ms: 15000 });
    if (S.settings.notify && 'Notification' in window && Notification.permission === 'granted') {
      try { const n = new Notification('Sectis', { body: t.title || 'To-do', tag: t.id }); n.onclick = () => { window.focus(); revealTodo(t.id); }; }
      catch (e) { if (navigator.serviceWorker) navigator.serviceWorker.ready.then((r) => r.showNotification('Sectis', { body: t.title || 'To-do', tag: t.id })).catch(() => {}); }
    }

  const cutoff = Date.now() - 4 * 864e5;
  for (const k in fired) if (fired[k] < cutoff) { delete fired[k]; changed = true; }

}

/* ---- data file (Chrome/Edge): keep to-dos in a JSON file, e.g. on a thumb drive ---- */
const fileSync = { handle: null, name: null, needsPermission: false, writing: false, pending: null };
function fileSyncSupported() { return !IN_FRAME && typeof window.showSaveFilePicker === 'function' && 'indexedDB' in window; }
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('sectis', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { const db = req.result; const tx = db.transaction('kv', mode); const st = tx.objectStore('kv'); const r = fn(st); tx.oncomplete = () => { resolve(r && 'result' in r ? r.result : undefined); db.close(); }; tx.onerror = () => reject(tx.error); };

}
const idbGet = (k) => idb('readonly', (s) => s.get(k));
const idbSet = (k, v) => idb('readwrite', (s) => s.put(v, k));
const idbDel = (k) => idb('readwrite', (s) => s.delete(k));
async function fileSyncInit() {
  if (!fileSyncSupported()) return;
  try {
    const h = await idbGet('dataFile'); if (!h) return;
    fileSync.handle = h; fileSync.name = h.name;
    const p = await h.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') await fileSyncLoad(); else { fileSync.needsPermission = true; showFileBanner(); }
  } catch (e) { /* no stored file */ }
}
async function fileSyncLoad() {
  const text = await (await fileSync.handle.getFile()).text();

    const data = JSON.parse(text);
    if (Array.isArray(data.todos) && (data.savedAt || 0) > (S.savedAt || 0)) { S = normalizeState(data); reindex(); generateRepeats(); lsSet(STORE_KEY, JSON.stringify(S)); render(); toast(`Loaded ${fileSync.name}`); return; }
  }
  fileSyncWrite(JSON.stringify(S));
}
function fileSyncWrite(json) {
  if (!fileSync.handle || fileSync.needsPermission) return;
  fileSync.pending = json;
  if (fileSync.writing) return;
  fileSync.writing = true;
  (async () => {
    while (fileSync.pending) {
      const data = fileSync.pending; fileSync.pending = null;
      try { const w = await fileSync.handle.createWritable(); await w.write(data); await w.close(); }
      catch (e) { fileSync.needsPermission = true; showFileBanner(); break; }
    }
    fileSync.writing = false;
  })();
}
const FILE_TYPES = [{ description: 'Sectis data', accept: { 'application/json': ['.json'] } }];
async function fileSyncCreate() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'sectis-data.json', types: FILE_TYPES });
    Object.assign(fileSync, { handle: h, name: h.name, needsPermission: false });
    await idbSet('dataFile', h); saveNow(); toast(`Now saving to ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast('That file can’t be used. Try another folder.'); }
}
async function fileSyncOpen() {
  try {
    const [h] = await window.showOpenFilePicker({ types: FILE_TYPES });
    const text = await (await h.getFile()).text();
    let data = null;
    if (text.trim()) { data = JSON.parse(text); if (!data || !Array.isArray(data.todos)) throw new Error('not sectis'); }
    if ((await h.requestPermission({ mode: 'readwrite' })) !== 'granted') { toast('Sectis needs permission to save to that file'); return; }
    Object.assign(fileSync, { handle: h, name: h.name, needsPermission: false });
    await idbSet('dataFile', h);
    if (data) {
      const ok = await confirmDialog({ title: 'Use the to-dos in this file?', body: `${esc(h.name)} has ${plural(data.todos.filter((t) => !t.trashed && !t.isTemplate).length, 'to-do')}. They’ll replace what’s in this browser right now (you can undo).`, ok: 'Use File' });
      if (ok) { commit('Open Data File', () => { S = normalizeState(data); }); navigate('today'); } else saveNow();
    } else saveNow();
    toast(`Now saving to ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') toast('That file couldn’t be read as Sectis data'); }
}
async function fileSyncReconnect() {
  if (!fileSync.handle) return;
  try { if ((await fileSync.handle.requestPermission({ mode: 'readwrite' })) === 'granted') { fileSync.needsPermission = false; hideFileBanner(); await fileSyncLoad(); } }
  catch (e) { toast('Couldn’t reconnect the file. Is the drive plugged in?'); }
}
async function fileSyncUnlink() {
  Object.assign(fileSync, { handle: null, name: null, needsPermission: false });

}
function showFileBanner() {
  const b = $('#banner'); if (!b) return;
  b.innerHTML = `<div class="banner">${ic('file')}<span>Allow Sectis to keep saving to <b>${esc(fileSync.name || 'your data file')}</b>.</span><button class="btn primary" data-fs="reconnect">Reconnect</button><button class="btn" data-fs="unlink">Disconnect</button></div>`;
  b.hidden = false;

}

/* ---- updates: an installed copy (Dock or Home Screen) can stay open for days,
   so it checks for a newer version and offers to load it ---- */
const upd = { checkedAt: 0, latest: null, offered: null };
function updatesAvailable() { return typeof SECTIS_WEB !== 'undefined' && SECTIS_WEB && !IN_FRAME && /^https?:/.test(location.protocol); }
function newerVersion(a, b) {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); }
  return false;
}
async function checkForUpdate(manual) {
  if (!updatesAvailable()) return null;
  upd.checkedAt = Date.now();
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('bad response');
    const v = (await r.json()).version;
    upd.latest = v;
    if (v && newerVersion(v, APP_VERSION)) {
      const msg = `Sectis ${v} is available`;
      if (manual || !$$('#toasts .t-msg').some((m) => m.textContent === msg)) {
        upd.offered = v;
        toast(msg, { action: 'Update Now', fn: applyUpdate, ms: 30 * 60e3 });
      }
      return v;
    }
    return false;
  } catch (e) { return null; }
}
async function applyUpdate() {
  toast('Updating…', { ms: 8000 });
  try { saveNow(); } catch (e) { /* ignore */ }
  try { if (typeof syncSaveState === 'function' && Y.enabled) syncSaveState(); } catch (e) { /* ignore */ }
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await Promise.race([reg.update(), new Promise((res) => setTimeout(res, 5000))]);
  } catch (e) { /* ignore */ }
  try { // drop the old version's saved files so the reload can't fall back to them
    const keep = `sectis-${upd.latest}`;
    const keys = await caches.keys();
    await Promise.all(keys.filter((k) => k.startsWith('sectis-') && k !== keep).map((k) => caches.delete(k)));
  } catch (e) { /* ignore */ }
  try { await fetch(location.pathname, { cache: 'reload' }); } catch (e) { /* refresh the browser's copy of the page */ }
  location.reload();
}

/* ===================== Formatted notes =====================
   Notes are plain text with light Markdown: **bold**, *italic*, ~~strike~~, `code`,
   # headings, - bullets, 1. numbered lists, > quotes, [text](link) and bare links.
   Web links open in a new tab; app links (sintr://…) open the app, so they get no target. */
function safeHref(url) {
  const u = String(url || '').trim();
  if (!u || /^(javascript|data|vbscript|file):/i.test(u)) return null;
  if (/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
  if (/^www\./i.test(u) || /^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return 'https://' + u;
  return null;
}
/* In the Notepad (opts.values), the things you keep notes for become one-click copy chips:
   serial numbers and other labelled values (Serial: …, S/N …, Ticket #…, Key: …), MAC and IP
   addresses, GUIDs, license keys, code-like tokens (C02XK1JHJG5J) and long numbers; `code`
   spans too. Phone numbers become call links with a copy button. */
const VAL_LABELS = /(^|[^\w])((?:serial|model|part|account|acct|order|invoice|tracking|confirmation|reference|ref)(?:\s*(?:no\.?|number|num|#))?|s\/n|sn|p\/n|service\s*tag|asset(?:\s*tag)?|license(?:\s*key)?|product\s*key|activation\s*key|key|ticket|case|po|imei|uuid|vin|rma|claim|policy|warranty|pin|passcode|code|ext(?:ension)?|id)(\s*(?:#|:|=|-|–)?\s*)([A-Za-z0-9][A-Za-z0-9._\/-]*)/gi;
function copyChip(v, shown) { return `<button type="button" class="np-val" data-copy="${esc(v)}" title="Click to copy">${shown == null ? esc(v) : shown}<span class="np-cp" aria-hidden="true">${I.copy}</span></button>`; }
function noteValues(s, keep) {
  const chip = (v) => keep(copyChip(v));
  s = s.replace(VAL_LABELS, (m, pre, label, sep, v) => {
    const val = v.replace(/[._\/-]+$/, ''), tail = v.slice(val.length);
    if (val.length < 3 || !/\d/.test(val)) return m;
    return pre + label + sep + chip(val) + tail;
  });
  s = s.replace(/\b[0-9A-Fa-f]{2}([:-])(?:[0-9A-Fa-f]{2}\1){4}[0-9A-Fa-f]{2}\b|\b[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\.[0-9A-Fa-f]{4}\b/g, (m) => chip(m)); // MAC
  s = s.replace(/\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b/g, (m) => chip(m)); // GUID
  s = s.replace(/(^|[^\w.])((?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}(?:\/\d{1,2}|:\d{1,5})?)(?![\w.]*\d)/g, (m, pre, ip) => pre + chip(ip)); // IPv4
  s = s.replace(/(^|[^\w:])((?:[0-9A-Fa-f]{1,4}:){1,7}(?::?[0-9A-Fa-f]{1,4}){1,7})(?![\w:])/g, (m, pre, ip) => {
    const full = ip.split(':').length >= 6 && !ip.includes('::'), short = ip.includes('::') && /[a-f]/i.test(ip);
    return full || short ? pre + chip(ip) : m;
  }); // IPv6
  s = s.replace(/(^|[^\w+\/.-])((?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]\d{4}(?:\s*(?:x|ext\.?|extension)\s*\d{1,6})?|\+\d{1,3}[\s.-]?\(?\d{1,4}\)?(?:[\s.-]?\d{2,4}){2,4})(?![\w-])/g, (m, pre, ph) => {
    const digits = ph.replace(/\s*(?:x|ext\.?|extension)\s*(\d+)$/i, ',$1').replace(/[^\d+,]/g, '');
    if (digits.replace(/\D/g, '').length < 10) return m;
    return pre + keep(`<a href="tel:${esc(digits)}" class="np-tel">${esc(ph)}</a><button type="button" class="np-cpb" data-copy="${esc(ph)}" title="Copy" aria-label="Copy ${esc(ph)}">${I.copy}</button>`);
  }); // phone
  s = s.replace(/\b[A-Z0-9]{4,8}(?:-[A-Z0-9]{4,8}){2,}\b/g, (m) => (/\d/.test(m) && /[A-Z]/.test(m) ? chip(m) : m)); // license keys
  s = s.replace(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{6,}\b|\b\d{8,}\b/g, (m) => chip(m)); // serial-like tokens, long numbers
  return s;
}
function mdInline(raw, opts) {
  const tokens = [];
  const keep = (html) => `\u0001${tokens.push(html) - 1}\u0002`;
  const link = (href, text) => keep(/^(https?|mailto):/i.test(href)
    ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${text}</a>`
    : `<a href="${esc(appLinkHref(href))}" class="app-link">${text}</a>`);
  const values = opts && opts.values;
  let s = String(raw).replace(/[\u0001\u0002]/g, '');
  s = s.replace(/`([^`\n]+)`/g, (m, c) => keep(values ? copyChip(c, `<code>${esc(c)}</code>`) : `<code>${esc(c)}</code>`));
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, (m, text, url) => { const h = safeHref(url); return h ? link(h, esc(text)) : m; });
  s = s.replace(/\b((?:https?:\/\/|www\.|sintr:\/\/)[^\s<>"'\u0001\u0002]+)/gi, (m, url) => {
    let trail = '';
    while (/[.,;:!?'")\]]$/.test(url)) {
      if (url.endsWith(')') && (url.match(/\(/g) || []).length >= (url.match(/\)/g) || []).length) break;
      trail = url.slice(-1) + trail; url = url.slice(0, -1);
    }
    const h = safeHref(url);
    return (h ? link(h, esc(url)) : esc(url)) + trail;
  });
  s = s.replace(/\b([\w.+-]+@[\w-]+(?:\.[\w-]+)+)\b/g, (m, e) => keep(`<a href="mailto:${esc(e)}">${esc(e)}</a>`));
  if (values) s = noteValues(s, keep);
  s = esc(s);
  s = s.replace(/\*\*(?=\S)(.+?)\*\*/g, (m, x) => (/\s$/.test(x) ? m : `<strong>${x}</strong>`));
  s = s.replace(/(^|[^\w])__(?=\S)(.+?)__(?!\w)/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<strong>${x}</strong>`));
  s = s.replace(/(^|[^\w*])\*(?=[^\s*])([^*]+?)\*(?![\w*])/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<em>${x}</em>`));
  s = s.replace(/(^|[^\w])_(?=[^\s_])([^_]+?)_(?!\w)/g, (m, pre, x) => (/\s$/.test(x) ? m : `${pre}<em>${x}</em>`));
  s = s.replace(/~~(?=\S)(.+?)~~/g, (m, x) => `<del>${x}</del>`);
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => tokens[+i]);
}
/* opts.tasks (the Notepad): checkboxes you can click, and each line marked with where it is in
   the text (data-ln), so a click in the formatted note puts the caret on the same spot */
function renderMarkdown(text, opts) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n'), tasks = !!(opts && opts.tasks);
  let html = '', list = null, para = [];
  const flush = () => { if (para.length) { html += `<p>${para.map(([l, i]) => (tasks ? `<span data-ln="${i}">${mdInline(l, opts)}</span>` : mdInline(l, opts))).join('<br>')}</p>`; para = []; } };
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  const open = (tag, start) => { if (list !== tag) { close(); html += tag === 'ol' && start && start !== '1' ? `<ol start="${+start}">` : `<${tag}>`; list = tag; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i], ln = tasks ? ` data-ln="${i}"` : '';
    let m;
    if (!line.trim()) { flush(); close(); continue; }
    if ((m = line.match(/^\s{0,3}(#{1,3})\s+(.+)$/))) { flush(); close(); html += `<p class="md-h${m[1].length}"${ln}>${mdInline(m[2], opts)}</p>`; continue; }
    if ((m = line.match(/^\s*[-*•+]\s+\[( |x|X)\]\s+(.*)$/))) {

/* ===================== Checklist: reorder and spin off ===================== */

/* drag the grip to reorder (mouse and touch) */
document.addEventListener('pointerdown', (e) => {
  const grip = e.target.closest('[data-ckgrip]'); if (!grip) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const item = grip.closest('.ck-item'), list = item && item.parentElement, card = grip.closest('.card');
  if (!item || !list || !card) return;
  e.preventDefault();
  const todoId = card.dataset.id;
  const startOrder = $$(':scope > .ck-item[data-ck]', list).map((x) => x.dataset.ck).join();
  item.classList.add('ck-dragging');
  document.body.classList.add('dragging-active');
  const move = (ev) => {
    if (ev.cancelable) ev.preventDefault();
    const items = $$(':scope > .ck-item[data-ck]', list).filter((x) => x !== item);
    let before = null;
    for (const it of items) { const r = it.getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { before = it; break; } }
    const target = before || list.querySelector(':scope > .ck-item:not([data-ck])');

    const t = getT(todoId); if (!t || order.join() === startOrder) return;
    commit('Reorder Checklist', () => { const byId = new Map(t.checklist.map((c) => [c.id, c])); t.checklist = order.map((id) => byId.get(id)).filter(Boolean); touch(t); });
  };
  document.addEventListener('pointermove', move, { passive: false });
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
});

/* ===================== One to-do in several places =====================

   checkbox (and checklist ticks, dates and position), so it can be checked off

function linkSiblings(t) {

}
function samePlace(t, target) {

}

      if (t.tags.join() !== src.tags.join()) { t.tags = src.tags.slice(); changed = true; }

/* ===================== Board =====================

/* ===================== Status report =====================

function reportGroups(items) {

/* ===================== Sorting and compact rows =====================

}

  // items without the value keep their hand-arranged order, after the rest
  const by = (f) => items.slice().sort((a, b) => { const x = f(a), y = f(b); if (x === y) return 0; if (x == null) return 1; if (y == null) return -1; return x < y ? -1 : 1; });

/* ===================== Sintr =====================

  if (!m) return null;

  let found = false;
  if (type === 'todo') { const t = getT(id); if (t && !t.isDraft) { found = true; revealTodo(id); } }
  else if (type === 'project') { const p = getP(id); if (p && !p.trashed) { found = true; navigate('project:' + id); } }

/* ===================== Completion date =====================
   When a to-do or project was completed (or canceled) can be changed, for something done weeks
   ago and only now checked off. Typed dates look back: "fri" is last Friday, "oct 2" the most
   recent October 2, "3 weeks ago" works too. The Logbook, status reports and the order of
   completed to-dos all follow the new date. */
function parsePastDate(raw) {
  const T = T0();
  const s = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,]+$/, '');
  if (!s) return null;
  if (['today', 'tod', 'now'].includes(s)) return T;
  if (s === 'last week') return addDays(T, -7);
  let m;
  if ((m = s.match(/^(\d{1,3})\s*(d|days?|w|wks?|weeks?|m|mos?|months?|y|yrs?|years?)(?: ago)?$/)) || (s === 'last month' && (m = [0, '1', 'm'])) || (s === 'last year' && (m = [0, '1', 'y']))) {
    const n = +m[1], u = m[2][0];
    if (u === 'd') return addDays(T, -n);
    if (u === 'w') return addDays(T, -7 * n);
    const d = pd(T), tot = d.getFullYear() * 12 + d.getMonth() - (u === 'm' ? n : 12 * n);
    const y = Math.floor(tot / 12), mo = ((tot % 12) + 12) % 12;
    return dateFromParts(y, mo, Math.min(d.getDate(), daysInMonth(y, mo)));
  }
  if ((m = s.match(/^(last |on |this )?([a-z]+)$/))) {
    const wd = matchWeekday(m[2]);
    if (wd >= 0) { let d = m[1] === 'last ' ? addDays(T, -1) : T; while (dow(d) !== wd) d = addDays(d, -1); return d; }
  }
  if ((m = s.match(/^(?:the )?(\d{1,2})(?:st|nd|rd|th)?$/))) { // the 15th: this month's, or the last one that's passed
    const n = +m[1], d0 = pd(T); let y = d0.getFullYear(), mo = d0.getMonth();
    for (let i = 0; i < 14; i++) { if (n <= daysInMonth(y, mo)) { const c = dateFromParts(y, mo, n); if (c <= T) return c; } if (--mo < 0) { mo = 11; y--; } }
    return null;
  }
  const p = parseDateText(s);

  if (p.special === 'today' || p.special === 'evening') return T;
  if (!p.date) return null;
  if (p.date <= T) return p.date;
  // a month and day still ahead this year means last year's; "tomorrow", "next week" or a date with its year can't be
  const monthDay = s.split(/[\s,]+/).some((w) => matchMonth(w) >= 0) || /^\d{1,2}[/-]\d{1,2}$/.test(s);
  if (!monthDay || /\d{4}/.test(s)) return null;
  let d = p.date;
  for (let i = 0; i < 2 && d > T; i++) { const x = pd(d), y = x.getFullYear() - 1; d = dateFromParts(y, x.getMonth(), Math.min(x.getDate(), daysInMonth(y, x.getMonth()))); }
  return d <= T ? d : null;
}

  if (trow && isBlueprint(itemById(trow.dataset.tplrow))) return take(() => templateMenu(trow.dataset.tplrow, at));
  const binned = t.closest('#content .tpl-row.trashed-row'); // a template in the Trash
  if (binned) { const b = binned.querySelector('[data-action="restore"]'), x = b && itemById(b.dataset.id); if (x) return take(() => openMenu(at, [{ header: tplName(x) }, { label: 'Put Back', icon: 'reopen', fn: () => restoreItems([x.id]) }])); }
  const ghost = t.closest('#content [data-tpl]');
  if (ghost && getT(ghost.dataset.tpl)) return take(() => todoMenu(ghost.dataset.tpl, at));
  const day = t.closest('#content .day-h[data-zone^="upcoming:"]:not(.month)');
  if (day) { const d = day.dataset.zone.slice(9); return take(() => dayMenu('upcoming:' + d, fmtDate(d), at)); }
  const dlg = t.closest('#content .dl-h[data-dlg]');
  if (dlg) return take(() => deadlineGroupMenu(dlg.dataset.dlg, at));
  const eve = t.closest('#content [data-zone="evening"]');
  if (eve && !t.closest('.row')) return take(() => dayMenu('evening', 'This Evening', at));
  const named = t.closest('#content [data-nav^="project:"], #content [data-nav^="area:"], #notepad [data-nav^="project:"], #notepad [data-nav^="area:"]');
  if (named && !t.closest('.row')) {
    const [k, id] = named.dataset.nav.split(':');
    if (k === 'project' && getP(id)) return take(() => projectMenu(getP(id), at));
    if (k === 'area' && getA(id)) return take(() => areaMenu(getA(id), at));
  }
  if (t.closest('#content .lh')) {
    const v = ui.view;
    if (v.type === 'project' && getP(v.id)) return take(() => projectMenu(getP(v.id), at, batchMenuItems(at).length ? batchMenuItems(at) : (() => { const p = listPasteMenuItems(); return p.length ? [...p, { sep: 1 }] : []; })()));
    if (v.type === 'area' && getA(v.id)) return take(() => areaMenu(getA(v.id), at, batchMenuItems(at)));
    if (v.type === 'board') return take(() => openMenu(at, boardsMenuItems()));
    return take(() => viewMenu(at));
  }
  const sb = t.closest('#sidebar .sb-item[data-nav]');
  if (sb && !sb.dataset.kind) {
    const key = sb.dataset.nav.split(':')[0]; // Board items are board:<id>
    if (LISTS[key]) return take(() => listMenu(key, at));
  }
  const sm = t.closest('#sidebar .sb-item[data-kind="smart"]');
  if (sm) { const sl = getSmart(sm.dataset.nav.split(':')[1]); if (sl) return take(() => openMenu(at, smartMenuItems(sl, at))); }
  if (t.closest('#sidebar .fx-bar')) return take(() => openFocusMenu(at));
}, true);

/* clicks */
document.addEventListener('click', (e) => {
  if (!e.target.closest) return;
  // the circle by a project's name: complete it (or reopen it), like a to-do's checkbox
  const pie = e.target.closest('#content .lh .pie-lg');
  if (pie && ui.view.type === 'project') {
    const p = getP(ui.view.id);
    if (p && !p.trashed && !p.isTemplate && !p.blueprint) { e.preventDefault(); if (p.status === 'open') completeProjectFlow(p, 'done'); else reopenProject(p); }
    return;
  }
  // the faint box by "New checklist item" puts the cursor there
  const nb = e.target.closest('#content .card .ck-item > span.ck-box');
  if (nb) { const ta = nb.parentElement.querySelector('textarea'); if (ta) ta.focus(); }
});
// Double-click a sidebar project or area to rename it, a smart list to edit it. The first click
// re-draws the sidebar, so the browser never sends a dblclick: two quick clicks on the same item count.
let sbLastClick = null;
function sbDouble(sb) {
  const k = sb.dataset.kind, id = (sb.dataset.id || (sb.dataset.nav || '').split(':')[1]);
  if (k === 'project' && getP(id)) { startRename('p', id); return true; }
  if (k === 'area' && getA(id)) { startRename('a', id); return true; }
  if (k === 'smart' && getSmart(id)) { openSmartEditor(getSmart(id)); return true; }
  return false;
}
document.addEventListener('click', (e) => {
  if (isCoarse() || !e.target.closest || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) { sbLastClick = null; return; }
  const sb = e.target.closest('#sidebar .sb-item[data-kind]');
  if (!sb) { sbLastClick = null; return; }
  const key = sb.dataset.kind + ':' + (sb.dataset.id || sb.dataset.nav || ''), now = Date.now();
  if (sbLastClick && sbLastClick.key === key && now - sbLastClick.t < 450) {
    sbLastClick = null;
    if (sbDouble(sb)) { e.preventDefault(); e.stopPropagation(); }
    return;
  }
  sbLastClick = { key, t: now };
}, true);

/* ===================== Settings =====================
   One window with a pane per subject: the list on the left picks the pane on the right. In a
   narrow window, and on iPhone, the list comes first and each pane opens over it.
   - Search finds a setting by any word in its name or description, across every pane.
   - Windows opened from here (Manage Tags, Backups, a focus, sync set-up) open over Settings
     and come back to the same pane when they close.
   - openSettings('sync') (or any pane's id) opens straight to that pane. */
const SET_PANES = [
  { id: 'general', title: 'General', icon: 'sliders' },
  { id: 'lists', title: 'Lists', icon: 'checklist' },
  { id: 'tags', title: 'Tags', icon: 'tag' },
  { id: 'focus', title: 'Focus', icon: 'focus' },
  { id: 'sync', title: 'Sync', icon: 'cloud' },
  { id: 'data', title: 'Your Data', icon: 'archive' },
  { id: 'about', title: 'About', icon: 'info' },
];
ui.setPane = 'general'; // the pane you were last in, while Sectis stays open

/* one setting: its name and a line about it on the left, its control on the right */
function setRow(label, desc, ctl, cls = '') {
  return `<div class="set-row${cls ? ' ' + cls : ''}"><div class="lbl"><span>${label}</span>${desc ? `<small>${desc}</small>` : ''}</div>${ctl ? `<div class="set-ctl">${ctl}</div>` : ''}</div>`;
}
/* settings that belong together, in one outlined box under a small heading */
function setGroup(title, rows, note = '') {
  const list = rows.filter(Boolean);
  if (!list.length) return '';
  return `<section class="set-grp">${title ? `<h3>${title}</h3>` : ''}<div class="set-card">${list.join('')}</div>${note ? `<p class="note">${note}</p>` : ''}</section>`;
}

function openSettings(pane) {
  if (ui.editing) closeEditor({ noRender: false });
  const known = (id) => typeof id === 'string' && SET_PANES.some((p) => p.id === id);
  let cur = known(pane) ? pane : known(ui.setPane) ? ui.setPane : 'general';
  let atNav = !known(pane); // a narrow window starts at the list, unless a pane was asked for
  let q = '';
  const seg = (key, opts, label) => `<div class="seg" role="group" aria-label="${esc(label)}">${opts.map(([v, l]) => { const on = String(S.settings[key]) === String(v); return `<button data-set="${key}" data-val="${v}" class="${on ? 'on' : ''}" aria-pressed="${on}">${l}</button>`; }).join('')}</div>`;
  const sw = (key, label) => `<button class="switch${S.settings[key] ? ' on' : ''}" data-switch="${key}" role="switch" aria-checked="${!!S.settings[key]}" aria-label="${esc(label)}"></button>`;
  const segRow = (label, desc, key, opts) => setRow(label, desc, seg(key, opts, label), 'has-seg');
  const swRow = (label, desc, key) => setRow(label, desc, sw(key, label), 'tog');
  const PANE = {
    general: () => {
      const notif = !('Notification' in window) || IN_FRAME ? 'unavailable' : Notification.permission;
      return setGroup('Appearance', [
        segRow('Theme', '', 'theme', [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']]),
        segRow('Row spacing', 'Compact fits more to-dos on screen. Each device keeps its own.', 'density', [['comfortable', 'Comfortable'], ['compact', 'Compact']]),
      ]) + setGroup('Dates and typing', [
        segRow('Week starts on', '', 'weekStart', [[0, 'Sunday'], [1, 'Monday']]),
        swRow('Quick Entry reads dates, tags and places', '“Pay rent friday @Home #Bills !oct 31” sets When, the area, a tag and a deadline.', 'parseEntry'),
      ]) + setGroup('Reminders', [
        notif === 'unavailable' ? setRow('System notifications', 'Not available here. Reminders still show inside Sectis while it is open.')
          : notif === 'denied' ? setRow('System notifications', 'Blocked in your browser’s settings. Reminders still show inside Sectis.')
            : swRow('System notifications', 'Show reminders as banners while Sectis is open, in a tab or as an installed app.', 'notify'),
      ]);
    },
    lists: () => setGroup('Order', [
      swRow('Keep higher priorities on top', 'High, then Medium, then Low, in every list you haven’t sorted another way. You can still arrange to-dos within each priority.', 'prioTop'),
      swRow('Group Today by project and area', '', 'groupToday'),
    ]) + setGroup('Completed to-dos', [
      segRow('When you check one off', 'Move to Bottom puts it below the rest of its list. Unchecking it puts it back where it was.', 'doneSink', [['bottom', 'Move to Bottom'], ['stay', 'Stay in Place']]),
      segRow('Move completed items to the Logbook', 'Until then they stay in their list, checked.', 'logMode', [['immediate', 'Immediately'], ['daily', 'Daily'], ['manual', 'Manually']]),
      segRow('Logged to-dos in projects and areas', 'At the Bottom keeps them at the end, behind Show logged items. Where They Were lists each one in its project or sub-project, with the day it was done.', 'loggedPlace', [['bottom', 'At the Bottom'], ['inline', 'Where They Were']]),
    ]),
    tags: () => {
      const n = S.tags.filter((t) => !t.group).length;
      return setGroup('', [
        setRow('Your tags', n ? `${plural(n, 'tag')}. Rename, color, group and reorder them.` : 'No tags yet. Make some here, or press # on a to-do.', '<button class="btn" data-s="tags">Manage Tags…</button>'),
      ]) + setGroup('In lists', [
        segRow('Tags shown in lists', 'Own Only leaves out the tags a to-do gets from its project or area. Open a to-do to see them all.', 'rowTags', [['own', 'Own Only'], ['all', 'All'], ['none', 'None']]),
      ]) + setGroup('Projects and areas', [
        swRow('To-dos take on the tags of their project and area', 'Adding or moving a to-do into a project or area gives it that place’s tags. Moving it elsewhere swaps them.', 'inheritTags'),
        setRow('Tag to-dos already in projects and areas', 'Adds each project’s and area’s tags to the to-dos inside it now. You can undo it.', '<button class="btn" data-s="retag-all">Tag Them Now</button>'),
      ]);
    },
    focus: () => focusSettingsHTML(),
    sync: () => syncSettingsHTML(),
    data: () => {
      const hasSample = S.todos.some((t) => t.sample) || S.projects.some((p) => p.sample) || S.areas.some((a) => a.sample);
      const file = !fileSyncSupported() ? '' : fileSync.name
        ? setRow('Data file', `Saving to <b>${esc(fileSync.name)}</b>${fileSync.needsPermission ? '. Click Reconnect to allow access.' : '.'}`, `${fileSync.needsPermission ? '<button class="btn primary" data-s="fs-reconnect">Reconnect</button>' : ''}<button class="btn" data-s="fs-unlink">Disconnect</button>`)
        : setRow('Data file', 'Keep your to-dos in a file, for example on a thumb drive next to Sectis.', '<button class="btn" data-s="fs-new">Create File…</button><button class="btn" data-s="fs-open">Open File…</button>');
      return `<p class="set-lead">${Y.enabled ? 'Your to-dos are saved in this browser on this device, and synced, encrypted, through your own Firebase project.' : 'Your to-dos are saved in this browser on this device. Nothing is sent anywhere.'}</p>`
        + setGroup('Backups', [
          setRow('Automatic backups', 'A copy every day for 14 days, and one before big changes.', '<button class="btn" data-s="backups">Backups…</button>'),
          setRow('Export', 'Save everything as a file you can keep somewhere safe.', '<button class="btn" data-s="export">Export Backup…</button>'),
          setRow('Import', 'Bring in a backup file, or paste a list to add as to-dos.', '<button class="btn" data-s="import">Import…</button>'),
          file,
        ]) + setGroup('Start over', [
          hasSample ? setRow('Sample to-dos', 'The tour and examples Sectis started with.', '<button class="btn" data-s="sample-remove">Remove Sample To-Dos</button>')
            : setRow('Sample to-dos', 'Bring back the tour and examples Sectis started with.', '<button class="btn" data-s="sample-add">Add Sample To-Dos</button>'),
          setRow('Erase all data', Y.enabled ? 'Deletes every to-do, project, area and tag here and on every device that syncs with this one.' : 'Deletes every to-do, project, area and tag in this browser.', '<button class="btn danger-quiet" data-s="erase">Erase All Data…</button>'),
        ]);
    },
    about: () => {
      const canUpdate = updatesAvailable(), newer = canUpdate && upd.latest && newerVersion(upd.latest, APP_VERSION);
      return setGroup('', [
        setRow('Sectis', `Version ${APP_VERSION}${canUpdate ? '. Sectis checks for updates when you bring it to the front.' : ''}`, canUpdate ? `<button class="btn${newer ? ' primary' : ''}" data-s="update-check" id="upd-btn">${newer ? `Update to ${esc(upd.latest)}` : 'Check for Updates'}</button>` : ''),
        setRow('Keyboard shortcuts', `Press <kbd>?</kbd> on any list to see them all.`, '<button class="btn" data-s="shortcuts">Show Shortcuts</button>'),
      ]) + `<p class="set-lead set-fine">A private to-do app. No account, and nothing leaves this device unless you turn on sync.</p>`;
    },
  };
  const title = (id) => (SET_PANES.find((p) => p.id === id) || SET_PANES[0]).title;
  const words = () => q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  /* every pane, cut down to the settings whose text has all the words */
  const searchHTML = () => {
    const ws = words(), tmp = document.createElement('div');
    const has = (text) => ws.every((w) => text.toLowerCase().includes(w));
    let out = '';
    SET_PANES.forEach((p) => {
      tmp.innerHTML = PANE[p.id]();
      if (!has(p.title)) {
        $$('.set-lead, .set-btns', tmp).forEach((n) => n.remove());
        $$('.set-grp', tmp).forEach((g) => {
          const h = $('h3', g);
          if (h && has(h.textContent)) return;
          $$('.set-row', g).forEach((r) => { if (!has(r.textContent)) r.remove(); });
          if (!$('.set-row', g)) g.remove(); else { const n = $('.note', g); if (n) n.remove(); }
        });
      }
      if ($('.set-grp', tmp)) out += `<div class="set-found"><button class="set-found-h" data-pane="${p.id}" title="Open ${esc(p.title)}">${ic(p.icon)}<span>${esc(p.title)}</span>${ic('chevR', 'chev')}</button>${tmp.innerHTML}</div>`;
    });
    return out || `<p class="set-none">No settings match “${esc(q.trim())}”.</p>`;
  };
  const shell = `<div class="st">
    <div class="st-side">
      <div class="st-side-h"><h2>Settings</h2><button class="ib st-x" data-action="close-layer" aria-label="Close">${ic('x')}</button></div>
      <label class="st-search">${ic('search')}<input id="st-q" type="text" placeholder="Search settings" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search settings" enterkeyhint="search"><button class="st-clear" data-st="clear" aria-label="Clear search" hidden>${ic('x')}</button></label>
      <nav class="st-tabs" aria-label="Settings sections">${SET_PANES.map((p) => `<button class="st-tab" data-pane="${p.id}">${ic(p.icon)}<span>${p.title}</span>${ic('chevR', 'chev')}</button>`).join('')}</nav>
      <div class="st-ver">Sectis ${APP_VERSION}</div>
    </div>
    <div class="st-main">
      <div class="st-head"><button class="st-back" data-st="back" aria-label="Back to Settings">${ic('chevL')}<span>Settings</span></button><h2 id="st-title"></h2><button class="ib" data-action="close-layer" aria-label="Close">${ic('x')}</button></div>
      <div class="st-body" id="st-body"></div>
    </div></div>`;
  const L = openLayer({ modal: true, cls: 'settings', html: shell, onMount: (el, layer) => {
    const root = $('.st', el), body = $('#st-body', el), inp = $('#st-q', el);
    el.setAttribute('aria-label', 'Settings');
    /* the control that had the keyboard keeps it when the pane is redrawn */
    const focusKey = (a) => {
      if (!a || !a.dataset || !body.contains(a)) return null;
      if (a.dataset.set) return `[data-set="${a.dataset.set}"][data-val="${a.dataset.val}"]`;
      if (a.dataset.switch) return `[data-switch="${a.dataset.switch}"]`;
      if (a.dataset.s) return `[data-s="${a.dataset.s}"]${a.dataset.id ? `[data-id="${a.dataset.id}"]` : ''}`;
      return null;
    };
    const paint = (keep) => {
      if (!el.isConnected) return;
      const searching = !!q.trim(), top = keep ? body.scrollTop : 0, fk = keep ? focusKey(document.activeElement) : null;
      root.classList.toggle('at-nav', atNav);
      root.classList.toggle('searching', searching);
      $('.st-clear', el).hidden = !q;
      $$('.st-tab', el).forEach((b) => { const on = !searching && b.dataset.pane === cur; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
      $('#st-title', el).textContent = searching ? 'Search' : title(cur);
      body.innerHTML = searching ? searchHTML() : PANE[cur]();
      body.scrollTop = top;
      if (fk) { const f = $(fk, body); if (f) f.focus({ preventScroll: true }); }
    };
    const show = (id) => { cur = id; ui.setPane = id; atNav = false; q = ''; inp.value = ''; paint(false); };
    layer.onReveal = () => paint(true); // a window opened from here has closed
    paint(false);
    inp.addEventListener('input', () => { q = inp.value; paint(false); });
    el.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (e.key === 'Escape' && q) { e.preventDefault(); e.stopPropagation(); q = ''; inp.value = ''; paint(false); return; }
      if ((mod && e.key.toLowerCase() === 'f') || (e.key === '/' && e.target !== inp && !mod)) { e.preventDefault(); e.stopPropagation(); inp.focus(); inp.select(); return; }
      // ↑ ↓ walk the panes while the list has the keyboard
      const tab = e.target.closest && e.target.closest('.st-tab');
      if (tab && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        const tabs = $$('.st-tab', el), i = tabs.indexOf(tab), n = tabs[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, tabs.length - 1)];
        if (n && n !== tab) { show(n.dataset.pane); n.focus(); }
      }
    });
    el.addEventListener('click', async (e) => {
      const t = e.target.closest('[data-pane]');
      if (t) { show(t.dataset.pane); return; }
      const st = e.target.closest('[data-st]');
      if (st) { if (st.dataset.st === 'back') { atNav = true; paint(false); } else { q = ''; inp.value = ''; paint(false); inp.focus(); } return; }
      const s = e.target.closest('[data-set]');
      if (s) { const key = s.dataset.set; let v = s.dataset.val; if (key === 'weekStart') v = +v; S.settings[key] = v; saveSoon(); if (key === 'logMode') autoLog(); render(); paint(true); return; }
      // a switch, or anywhere on its row
      const togRow = e.target.closest('.set-row.tog');
      const w = e.target.closest('[data-switch]') || (togRow && !e.target.closest('button, a, input') ? $('[data-switch]', togRow) : null);
      if (w) {
        const key = w.dataset.switch;
        if (key === 'notify' && !S.settings.notify) { try { const r = await Notification.requestPermission(); if (r !== 'granted') { toast('Notifications were not allowed'); paint(true); return; } } catch (err) { toast('Notifications aren’t available here'); return; } }
        S.settings[key] = !S.settings[key]; saveSoon(); render(); paint(true);
        return;
      }
      const b = e.target.closest('[data-s]'); if (!b) return;
      const act = b.dataset.s;
      if (act === 'tags') { openTagManager(); return; }
      if (act === 'shortcuts') { openShortcuts(); return; }
      if (act === 'focus-new') { openFocusEditor(); return; }
      if (act === 'focus-edit') { const f = getFocus(b.dataset.id); if (f) openFocusEditor(f); return; }
      if (act === 'retag-all') {
        let n = 0;
        commit('Tag To-Dos', () => S.todos.forEach((t) => {
          if (t.trashed || t.isTemplate || t.isDraft || (!t.projectId && !t.areaId)) return;
          const before = t.tags.join(); const keep = S.settings.inheritTags; S.settings.inheritTags = true; retag(t, new Set()); S.settings.inheritTags = keep;
          if (t.tags.join() !== before) { touch(t); n++; }
        }));
        toast(n ? `Tagged ${plural(n, 'to-do')}` : 'Every to-do already has its project’s and area’s tags', n ? { undo: true } : {});
        return;
      }
      if (act === 'backups') { openBackups(); return; }
      if (act === 'export') { openExport(); return; }
      if (act === 'import') { openImport(); return; }
      if (act === 'update-check') {
        if (upd.latest && newerVersion(upd.latest, APP_VERSION)) { applyUpdate(); return; }
        b.textContent = 'Checking…'; b.disabled = true;
        const v = await checkForUpdate(true);
        if (!b.isConnected) return;
        b.disabled = false;
        if (v) { b.textContent = `Update to ${v}`; b.classList.add('primary'); }
        else b.textContent = v === false ? 'You have the latest version' : 'Couldn’t check. Are you online?';
        return;
      }
      if (act === 'sample-remove') { removeSample(); paint(true); return; }
      if (act === 'sample-add') { commit('Sample To-Dos', () => seedSample()); paint(true); return; }
      if (act === 'erase') {
        const ok = await confirmDialog({ title: 'Erase all data?', body: Y.enabled ? 'Every to-do, project, area and tag will be deleted here and on every device that syncs with this one. Export a backup first if you might want them back.' : 'Every to-do, project, area and tag in this browser will be deleted. Export a backup first if you might want them back.', ok: 'Erase Everything', danger: true });
        if (ok) { await makeBackup('erase'); commit('Erase All', () => { const keep = S.settings; S = emptyState(); S.settings = keep; S.meta.sampleLoaded = true; }); navigate('inbox'); closeLayer(L); }
        return;
      }
      if (act === 'fs-new') { await fileSyncCreate(); paint(true); return; }
      if (act === 'fs-open') { await fileSyncOpen(); paint(true); return; }
      if (act === 'fs-reconnect') { await fileSyncReconnect(); paint(true); return; }
      if (act === 'fs-unlink') { await fileSyncUnlink(); paint(true); return; }
      if (act === 'sync-setup') { openSyncSetup(); return; }
      if (act === 'sync-join') { openSyncJoin(); return; }
      if (act === 'sync-code') { openJoinCode(false); return; }
      if (act === 'sync-check') {
        b.disabled = true; b.textContent = 'Checking…';
        try {
          if (!Y.col) await syncStart();
          const r = await syncCheckAll();
          toast(!r ? 'Couldn’t reach Firebase. Try again when you’re online.' : !r.up && !r.down ? 'Everything matches your other devices.' : [r.down ? `${plural(r.down, 'change')} brought in` : '', r.up ? `${plural(r.up, 'item')} sent back up` : ''].filter(Boolean).join(', ') + '.');
        } catch (err) { toast(friendlySyncError(err)); }
        paint(true); return;
      }
      if (act === 'sync-now') { b.disabled = true; b.textContent = 'Syncing…'; await syncNow(); paint(true); return; }
      if (act === 'sync-off') { if (await confirmSyncOff()) paint(true); }
    });
  } });
  return L;
}

/* ===================== When follows the project =====================
   A to-do or sub-project takes its project's When (a date, This Evening, or no date) unless it
   has one of its own. Give Hamilton a When and everything in it starts then too; move Hamilton
   and they move with it, sub-projects and theirs included.
   - Picking a date (or Someday) for one of them makes that date its own: it stays put when the
     project's changes. Clearing it (✕, or Same as … in the When picker) puts it back to the
     project's.
   - Items that follow carry whenFrom (their project's id). Nothing else needs to know: Today,
     Upcoming, the Timeline and the rest just see the date.
   - It runs after every change (commit), comparing each item's When and place before and after,
     so it doesn't matter how a date changed: the picker, dragging, Quick Entry, the Timeline…
   - A new to-do, or one moved into a project, follows it unless it brings a different date of
     its own (or Someday). A sub-project made a top-level project keeps its date as its own.
   - Projects that hadn't started yet when this arrived (1.50) had their undated to-dos and
     sub-projects made to follow them, once per device. Ones already started were left alone, so
     their to-dos didn't all land in Today at once; they join when the project's When changes. */
const whenKey = (x) => (x.start === 'someday' ? 'someday' : x.start === 'anytime' && x.when ? x.when + (x.evening ? '+e' : '') : '');
const placeOf = (x) => (x.type === 'todo' ? x.projectId || null : x.parentId && x.parentId !== x.id ? x.parentId : null);
const canFollow = (x) => x.status === 'open' && !x.trashed && !x.isTemplate && !x.blueprint;
/* the project whose When this one follows (when it follows one) */
function whenParent(x) { const pid = x && x.whenFrom && placeOf(x); return pid === x.whenFrom ? getP(pid) || null : null; }
/* the project it would follow if its date were cleared */
function whenHome(x) { const pid = x && placeOf(x); return pid ? getP(pid) || null : null; }
const followsHere = (x) => !!x.whenFrom && ui.view.type === 'project'; // its project's date is in the header
function whenBefore() {
  const m = new Map();
  if (!S) return m;
  for (const t of S.todos) m.set(t.id, [whenKey(t), placeOf(t)]);
  for (const p of S.projects) m.set(p.id, [whenKey(p), placeOf(p)]);
  return m;
}
/* c takes p's When */
function followWhen(c, p) {
  const was = whenKey(c) + '|' + (c.whenFrom || '');
  c.whenFrom = p.id;
  if (p.start === 'anytime' && p.when) { c.start = 'anytime'; c.when = p.when; c.evening = !!p.evening; }
  else { if (c.start !== 'inbox') c.start = 'anytime'; c.when = null; c.evening = false; }
  if (!c.when) c.reminder = null;
  if (whenKey(c) + '|' + c.whenFrom !== was) touch(c);
}
function stopFollowing(c) { if (c.whenFrom) { delete c.whenFrom; touch(c); } }
function propagateWhens(before) {
  if (!S) return;
  const projs = new Map(S.projects.map((p) => [p.id, p]));
  const kids = new Map();
  const add = (pid, x) => { if (!kids.has(pid)) kids.set(pid, []); kids.get(pid).push(x); };
  for (const t of S.todos) { if (t.projectId && projs.has(t.projectId)) add(t.projectId, t); else if (t.whenFrom) stopFollowing(t); }
  for (const p of S.projects) { const pid = placeOf(p); if (pid && projs.has(pid)) add(pid, p); else if (p.whenFrom) stopFollowing(p); }
  const seen = new Set();
  const changed = (x) => { const b = before && before.get(x.id); return !b || b[0] !== whenKey(x); };
  const visit = (p) => {
    if (seen.has(p.id)) return; seen.add(p.id);
    if (p.isTemplate || p.blueprint || p.trashed) return; // templates keep what they have
    const pChanged = changed(p), pKey = whenKey(p);
    for (const c of kids.get(p.id) || []) {
      if (canFollow(c)) {
        const b = before && before.get(c.id), key = whenKey(c);
        const placed = !b || b[1] !== p.id; // new here, or just moved in
        const edited = !!b && b[0] !== key; // its own When changed in this change
        let follow;
        if (placed) follow = key === '' || key === pKey || (!!c.whenFrom && !edited);
        else if (edited) follow = key === '' || key === pKey; // cleared, or set to the project's
        else if (pChanged) follow = !!c.whenFrom || key === '';
        else follow = !!c.whenFrom; // keep up (a change that came from another device)
        if (follow) followWhen(c, p); else stopFollowing(c);
      }
      if (c.type === 'project') visit(c);
    }
  };
  for (const p of S.projects) if (!placeOf(p) || !projs.has(placeOf(p))) visit(p);
  for (const p of S.projects) visit(p); // anything a broken tree left out
}
/* everything undated inside p (and inside its sub-projects that follow) follows it */
function adoptWhen(p, seen = new Set()) {
  if (seen.has(p.id) || p.isTemplate || p.blueprint) return; seen.add(p.id);
  const inside = S.todos.filter((t) => t.projectId === p.id).concat(childProjects(p));
  for (const c of inside) {
    if (canFollow(c) && (c.whenFrom || whenKey(c) === '' || whenKey(c) === whenKey(p))) followWhen(c, p);
    if (c.type === 'project') adoptWhen(c, seen);
  }
}
/* once per device: projects that haven't started yet take their undated to-dos and sub-projects
   along (see above) */
function followWhensOnce() {
  if (lsGet('sectis.whenFollow') === '1' || !S) return;
  const T = T0();
  S.projects.filter((p) => canFollow(p) && !p.logged && p.start === 'anytime' && p.when && p.when > T).forEach((p) => adoptWhen(p));
  lsSet('sectis.whenFollow', '1');
  reindex(); saveSoon();
}

/* ===================== Start ===================== */
init();

})();
</script>
