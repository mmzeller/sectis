<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sectis</title>
<meta name="description" content="Sectis, a private to-do app: Inbox, Today, Upcoming, projects, areas, tags, checklists and repeating to-dos. Works offline.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sectis">
<meta name="application-name" content="Sectis">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
/* Layout: two panes — a cool-grey sidebar of lists and a single reading column of to-dos.
   On phones the sidebar becomes the home screen and each list pushes in over it. */
:root {
  --bg: #ffffff;
  --side: #f3f4f7;
  --card: #ffffff;
  --pop: #ffffff;
  --fg: #1b1f27;
  --muted: #687082;
  --faint: #a4aab7;
  --line: #e5e7ed;
  --line-strong: #d3d7e0;
  --hover: #eceef3;
  --accent: #2c5be0;
  --accent-ink: #ffffff;
  --accent-tint: #e3eafc;
  --sel: #dfe7fb;
  --cb: #b9bfcb;
  --red: #e0453b;
  --c-inbox: #3e86d6;
  --c-today: #f0b31a;
  --c-evening: #5d6bd1;
  --c-upcoming: #e0453b;
  --c-anytime: #1f9e8b;
  --c-someday: #c49a52;
  --c-logbook: #36a46b;
  --c-trash: #8a909c;
  --c-area: #5b8f78;
  --c-board: #8b6fd6; --c-smart: #2f98b8;
  --c-template: #7a8ca3;
  --c-waiting: #d9822b; --c-timeline: #4f7fd9; --c-note: #c9962e;
  --shadow-card: 0 1px 2px rgba(20, 28, 48, .06), 0 10px 30px rgba(20, 28, 48, .13);
  --shadow-pop: 0 2px 6px rgba(20, 28, 48, .08), 0 18px 48px rgba(20, 28, 48, .2);
  --scrim: rgba(18, 22, 32, .32);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs: 14px;
  --row-h: 32px;
  --cb-size: 15px;
  --t-red: #d64541; --t-orange: #de7a26; --t-yellow: #bf9010; --t-green: #3b9a5c; --t-teal: #1f9a92; --t-blue: #3a7bd5; --t-indigo: #5b62d6; --t-purple: #9256c9; --t-pink: #d24d8c; --t-gray: #7d8594;
  --tg-tint: 14%; --tg-ink: 52%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17191e; --side: #1e2027; --card: #22252d; --pop: #262a33; --fg: #e7e9ef; --muted: #9aa1b1; --faint: #626a7a;
    --line: #2c3039; --line-strong: #3a3f4a; --hover: #282c35; --accent: #6d8cff; --accent-ink: #0f1424; --accent-tint: #26304d;
    --sel: #263252; --cb: #5c6372; --red: #ff6a5f; --c-inbox: #5aa2ee; --c-today: #f6c443; --c-evening: #8d99f0;
    --c-upcoming: #ff6a5f; --c-anytime: #3cc3ad; --c-someday: #d9b370; --c-logbook: #4cc184; --c-trash: #9aa1b1; --c-area: #7cb59a; --c-board: #a891ee; --c-smart: #5cc0de; --c-template: #9fb0c6; --c-waiting: #f0a050; --c-timeline: #7aa2f2; --c-note: #e3b456;
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); --shadow-pop: 0 2px 8px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .55);
    --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
    --t-red: #ff7a70; --t-orange: #f59d4c; --t-yellow: #e8c547; --t-green: #5cc785; --t-teal: #45c9bd; --t-blue: #6aa5f5; --t-indigo: #8f96f7; --t-purple: #bb8cf2; --t-pink: #f27cb4; --t-gray: #9aa1b1;
    --tg-tint: 18%; --tg-ink: 66%;
  }
}
:root[data-theme="dark"], :root[data-app-theme="dark"] {
  --bg: #17191e; --side: #1e2027; --card: #22252d; --pop: #262a33; --fg: #e7e9ef; --muted: #9aa1b1; --faint: #626a7a;
  --line: #2c3039; --line-strong: #3a3f4a; --hover: #282c35; --accent: #6d8cff; --accent-ink: #0f1424; --accent-tint: #26304d;
  --sel: #263252; --cb: #5c6372; --red: #ff6a5f; --c-inbox: #5aa2ee; --c-today: #f6c443; --c-evening: #8d99f0;
  --c-upcoming: #ff6a5f; --c-anytime: #3cc3ad; --c-someday: #d9b370; --c-logbook: #4cc184; --c-trash: #9aa1b1; --c-area: #7cb59a; --c-board: #a891ee; --c-smart: #5cc0de; --c-template: #9fb0c6; --c-waiting: #f0a050; --c-timeline: #7aa2f2; --c-note: #e3b456;
  --shadow-card: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45); --shadow-pop: 0 2px 8px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .55);
  --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
  --t-red: #ff7a70; --t-orange: #f59d4c; --t-yellow: #e8c547; --t-green: #5cc785; --t-teal: #45c9bd; --t-blue: #6aa5f5; --t-indigo: #8f96f7; --t-purple: #bb8cf2; --t-pink: #f27cb4; --t-gray: #9aa1b1;
  --tg-tint: 18%; --tg-ink: 66%;
}
:root[data-app-theme="light"] {
  --bg: #ffffff; --side: #f3f4f7; --card: #ffffff; --pop: #ffffff; --fg: #1b1f27; --muted: #687082; --faint: #a4aab7;
  --line: #e5e7ed; --line-strong: #d3d7e0; --hover: #eceef3; --accent: #2c5be0; --accent-ink: #ffffff; --accent-tint: #e3eafc;
  --sel: #dfe7fb; --cb: #b9bfcb; --red: #e0453b; --c-inbox: #3e86d6; --c-today: #f0b31a; --c-evening: #5d6bd1;
  --c-upcoming: #e0453b; --c-anytime: #1f9e8b; --c-someday: #c49a52; --c-logbook: #36a46b; --c-trash: #8a909c; --c-area: #5b8f78; --c-timeline: #4f7fd9; --c-note: #c9962e;
  --shadow-card: 0 1px 2px rgba(20, 28, 48, .06), 0 10px 30px rgba(20, 28, 48, .13); --shadow-pop: 0 2px 6px rgba(20, 28, 48, .08), 0 18px 48px rgba(20, 28, 48, .2);
  --scrim: rgba(18, 22, 32, .32); color-scheme: light;
  --t-red: #d64541; --t-orange: #de7a26; --t-yellow: #bf9010; --t-green: #3b9a5c; --t-teal: #1f9a92; --t-blue: #3a7bd5; --t-indigo: #5b62d6; --t-purple: #9256c9; --t-pink: #d24d8c; --t-gray: #7d8594;
  --tg-tint: 14%; --tg-ink: 52%;
}

[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg); font: var(--fs)/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { background: transparent; border: 0; outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
input:focus-visible, textarea:focus-visible { outline: none; }
kbd { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--bg); }

/* ---------- icons ---------- */
.ic { display: inline-flex; flex: none; width: 18px; height: 18px; align-items: center; justify-content: center; }
.ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic svg .fill { fill: currentColor; stroke: none; }
.ic svg .pie-ring { stroke-width: 2; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--sbw, 268px) minmax(0, 1fr); height: 100%; }
.sidebar { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--side); border-right: 1px solid var(--line); }
/* drag the sidebar's right edge to resize it */
.sb-resize { position: absolute; top: 0; bottom: 0; right: -5px; width: 9px; cursor: col-resize; z-index: 5; touch-action: none; }
.sb-resize::after { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; width: 3px; background: transparent; transition: background .12s; }
.sb-resize:hover::after, .sb-resize.on::after { background: var(--accent); }
@media (max-width: 419px), (pointer: coarse) { .sb-resize { display: none; } }
/* hide the sidebar (Mac), or let it slide in over a narrow window */
.app { position: relative; }
.sb-show { position: absolute; z-index: 25; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); background: var(--bg); }
.sb-show:hover { background: var(--hover); color: var(--fg); }
.app > .sidebar { grid-column: 1; grid-row: 1; }
.app > .main { grid-column: 2; grid-row: 1; }
.app.sb-off { grid-template-columns: 0 minmax(0, 1fr); }
.app.sb-off .sidebar { visibility: hidden; border-right: 0; overflow: hidden; }
.app.sb-off .sb-resize { display: none; }
.app.sb-float .sidebar { visibility: visible; overflow: visible; position: absolute; z-index: 40; top: 0; bottom: 0; left: 0; width: min(var(--sbw, 268px), calc(100% - 44px)); border-right: 1px solid var(--line); box-shadow: var(--shadow-pop); animation: sbIn .16s ease-out; }
@keyframes sbIn { from { transform: translateX(-24px); opacity: .5; } }
.app.sb-off .main { animation: none; }
.sb-foot .sb-hide { margin-left: -2px; }
.app.sb-off:not(.sb-float) .banner { padding-left: 52px; }
@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) { .sb-foot .sb-hide, .sb-show { display: none !important; } }
/* a narrow main pane: lists keep more of the width */
.app.main-narrow .content { padding-left: 22px; padding-right: max(18px, env(safe-area-inset-right, 0px)); padding-top: 46px; }
.app.main-narrow .content.board-view { padding-left: 16px; padding-right: 12px; }
.main { position: relative; min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.content { max-width: 780px; margin: 0 auto; padding-block: 52px 140px; padding-left: 40px; padding-right: max(40px, env(safe-area-inset-right, 0px)); }

.sb-top { padding-block: 14px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 14px; }
.sb-find { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 8px; color: var(--muted); background: var(--hover); }
.sb-find .ic { width: 15px; height: 15px; }
.sb-find > span:not(.ic) { flex: 1; text-align: left; }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 6px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.sb-group { display: flex; flex-direction: column; gap: 1px; padding-block: 8px; }
.sb-group + .sb-group { border-top: 0; }
.sb-item { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 30px; padding: 4px 8px; border-radius: 7px; text-align: left; color: var(--fg); position: relative; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--sel); }
.sb-item .ic { width: 17px; height: 17px; }
.sb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-name.untitled { color: var(--muted); }
.sb-count { color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.sb-due { background: var(--red); color: #fff; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 0 6px; line-height: 17px; font-variant-numeric: tabular-nums; }
.sb-area-row { font-weight: 600; }
.sb-area-row .ic { color: var(--c-area); }
.sb-proj { padding-left: 8px; }
.sb-proj .ic { color: var(--accent); }
.sb-foot { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 10px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
.sb-new { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 7px; color: var(--muted); flex: 1; text-align: left; }
.sb-new:hover, .ib:hover { background: var(--hover); color: var(--fg); }
.ib { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 7px; color: var(--muted); flex: none; }
.ib .ic { width: 18px; height: 18px; }
.sb-brand { display: none; }

/* ---------- list header ---------- */
.lh { display: flex; align-items: flex-start; gap: 12px; padding: 0 10px 6px; }
.lh > .lh-ic { margin-top: 3px; }
.lh > .ib, .lh > .btn { margin-top: 2px; }
.lh-ic { width: 28px; height: 28px; }
.lh-ic.pie-lg { color: var(--accent); }
.lh-title { flex: 1; min-width: 0; font: 700 28px/1.2 var(--display); letter-spacing: -.01em; margin: 0; padding: 0; }
.lh-title::placeholder { color: var(--faint); }
.lh-sub { padding: 0 10px 0 50px; color: var(--muted); font-size: 13px; margin-top: -4px; }
.lh-notes { display: block; width: 100%; resize: none; padding: 6px 10px 2px 50px; color: var(--fg); min-height: 28px; line-height: 1.5; overflow: hidden; }
.lh-notes::placeholder { color: var(--faint); }
.lh-meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px 0 50px; }
.lh-banner { margin: 10px 10px 0 50px; padding: 8px 12px; border-radius: 8px; background: var(--hover); color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lh-banner b { color: var(--fg); font-weight: 600; }
.link-btn { color: var(--accent); font-weight: 600; }
.link-btn:hover { text-decoration: underline; }

/* ---------- tag filter bar ---------- */
.tagbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 10px 4px 50px; }
.tchip { font-size: 12px; line-height: 20px; padding: 1px 10px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line-strong); }
.tchip:hover { color: var(--fg); }
.tchip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* Any / All, once two or more tags are picked */
.tagbar .tb-match { flex-wrap: nowrap; padding: 2px; border-radius: 999px; }
.tagbar .tb-match button { font-size: 12px; line-height: 20px; padding: 0 9px; border-radius: 999px; }

/* ---------- sections & rows ---------- */
.list { padding-top: 18px; }
.sec { min-height: 6px; }
.sec-h { display: flex; align-items: center; gap: 8px; margin: 22px 10px 4px; padding-bottom: 5px; border-bottom: 1px solid var(--line); color: var(--fg); font-weight: 650; font-size: 14px; }
.sec-h .ic { width: 16px; height: 16px; }
.sec-h.evening { color: var(--c-evening); }
.sec-h.evening > span:not(.ic) { color: var(--fg); }
.sec-h .sec-link { cursor: pointer; }
.sec-h .sec-link:hover { text-decoration: underline; }
.sec-h .ghost-count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.grp-h { display: flex; align-items: center; gap: 8px; margin: 26px 10px 2px; padding-bottom: 5px; border-bottom: 1px solid var(--line); font-weight: 650; }
.grp-h.area-h { font-size: 15px; }
.grp-h .ic { width: 17px; height: 17px; }
.grp-h.area-h .ic { color: var(--c-area); }
.grp-h.proj-h .ic { color: var(--accent); }
.grp-h button { text-align: left; }
.grp-h button:hover { text-decoration: underline; }

.row { display: flex; align-items: flex-start; gap: 10px; min-height: var(--row-h); padding: 6px 10px; border-radius: 7px; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: default; }
.row.selected { background: var(--sel); }
.row.dragging { opacity: .35; }
.r-main { flex: 1; min-width: 0; }
.r-line { display: block; min-height: 20px; line-height: 20px; overflow-wrap: anywhere; }
.r-line > * { margin-right: 6px; vertical-align: -3px; }
.r-line > .r-title { vertical-align: baseline; }
.r-line > .tg, .r-line > .r-when { display: inline-block; vertical-align: 1px; }
.r-line > .r-ck { vertical-align: -2px; }
.r-title { min-width: 0; overflow-wrap: anywhere; }
.r-title.untitled { color: var(--faint); }
.r-sub { color: var(--muted); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-ic { color: var(--faint); width: 14px; height: 14px; }
.r-star { color: var(--c-today); width: 14px; height: 14px; }
.r-moon { color: var(--c-evening); width: 14px; height: 14px; }
.r-box { color: var(--c-someday); width: 14px; height: 14px; }
.r-when { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--hover); border-radius: 5px; padding: 0 6px; line-height: 18px; }
.r-ck { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
.r-right { display: flex; align-items: center; gap: 8px; flex: none; min-height: 20px; }
.dl { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dl .ic { width: 13px; height: 13px; }
.dl.due { color: var(--red); }
.tg { font-size: 11px; line-height: 17px; padding: 0 7px; border-radius: 999px; color: var(--muted); background: var(--hover); border: 1px solid transparent; white-space: nowrap; }
.row.selected .tg { background: transparent; border-color: var(--line-strong); }
/* tag colors: a soft tint behind the name, and the name in a deeper shade of the same color */
.tc-red { --tc: var(--t-red); } .tc-orange { --tc: var(--t-orange); } .tc-yellow { --tc: var(--t-yellow); } .tc-green { --tc: var(--t-green); } .tc-teal { --tc: var(--t-teal); }
.tc-blue { --tc: var(--t-blue); } .tc-indigo { --tc: var(--t-indigo); } .tc-purple { --tc: var(--t-purple); } .tc-pink { --tc: var(--t-pink); } .tc-gray { --tc: var(--t-gray); }
.tg[class*="tc-"] { background: color-mix(in srgb, var(--tc) var(--tg-tint), transparent); color: color-mix(in srgb, var(--tc) var(--tg-ink), var(--fg)); }
.row.selected .tg[class*="tc-"] { background: transparent; border-color: color-mix(in srgb, var(--tc) 45%, transparent); }
.c-tags .tg[class*="tc-"]:hover { border-color: color-mix(in srgb, var(--tc) 55%, transparent); color: color-mix(in srgb, var(--tc) var(--tg-ink), var(--fg)); }
.ic.tc-ic, .chip.tagc .chip-main .ic.tc-ic, .pick-i .ic.tc-ic { color: var(--tc); }
.tchip .tdot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--tc); vertical-align: 1px; }
.tchip.on[class*="tc-"] { background: color-mix(in srgb, var(--tc) var(--tg-tint), transparent); border-color: color-mix(in srgb, var(--tc) 55%, transparent); color: color-mix(in srgb, var(--tc) var(--tg-ink), var(--fg)); }
.row.done .r-title, .row.canceled .r-title { color: var(--muted); }
.row.canceled .r-title { text-decoration: line-through; }
/* a project or area name being renamed in place */
.rename-in { font: inherit; font-weight: 600; color: var(--fg); background: var(--card); border: 1px solid var(--accent); border-radius: 6px; padding: 1px 6px; margin: -2px 0 -2px -7px; width: calc(100% - 4px); max-width: 560px; outline: none; box-shadow: 0 0 0 3px var(--accent-tint); }
.bcol-t .rename-in { margin: -2px 0 -2px -7px; font-size: 15px; font-weight: 650; }
/* priority: !!! high, !! medium, ! low, before the title */
.r-pri { flex: none; margin-right: 5px; font-weight: 800; letter-spacing: -.5px; }
.r-pri.p3, .pri-bangs.p3, .chip.pri.p3 .pri-bangs { color: var(--red); }
.r-pri.p2, .pri-bangs.p2, .chip.pri.p2 .pri-bangs { color: var(--c-waiting); }
.r-pri.p1, .pri-bangs.p1, .chip.pri.p1 .pri-bangs { color: var(--c-inbox); }
.row.done .r-pri, .row.canceled .r-pri { color: var(--faint); }
.pri-bangs { font-weight: 800; letter-spacing: -.5px; }
.qe-p .pri-bangs { margin-right: 4px; }
.row.ghost { opacity: .55; cursor: pointer; }
.row.ghost:hover { opacity: .8; }
.row.trashed-row .r-title { color: var(--muted); }
.r-date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; min-width: 48px; padding-top: 1px; }
/* logged to-dos shown under their heading (Settings → Logged to-dos), with the day they were done */
.r-done { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.logged-in .row .r-title { color: var(--muted); }
.logged-in .row .cb { opacity: .7; }
.restore { font-size: 12px; color: var(--accent); font-weight: 600; padding: 0 4px; }

.cb { position: relative; flex: none; width: var(--cb-size); height: var(--cb-size); margin-top: 2.5px; border: 1.5px solid var(--cb); border-radius: 4.5px; background: var(--bg); display: inline-flex; align-items: center; justify-content: center; color: transparent; transition: background .15s, border-color .15s; }
.cb::before { content: ""; position: absolute; inset: -9px; }
.cb:hover { border-color: var(--muted); }
.cb .ic { width: 11px; height: 11px; }
.cb .ic svg { stroke-width: 3; }
.cb.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cb.canceled { background: var(--cb); border-color: var(--cb); color: var(--bg); }
.cb.repeat-due { border-style: dashed; }
.card .cb, .row .cb { background-clip: padding-box; }
.prow .pie-ic { color: var(--accent); width: 17px; height: 17px; margin-top: 1px; }
.prow .r-title { font-weight: 600; }
.prow { cursor: pointer; }

.hrow { display: flex; align-items: flex-start; gap: 6px; margin: 24px 10px 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--accent); user-select: none; -webkit-user-select: none; }
.hrow.dragging { opacity: .35; }
.h-title { flex: 1; min-width: 0; font-weight: 650; color: var(--accent); padding: 0; line-height: 1.45; }
.h-title::placeholder { color: var(--faint); }
.hrow .ib { width: 26px; height: 26px; opacity: 0; flex: none; }
.hrow:hover .ib, .hrow:focus-within .ib, .touch .hrow .ib { opacity: 1; }
.empty { padding: 56px 10px 24px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ic { width: 44px; height: 44px; opacity: .3; }
.empty p { margin: 0; max-width: 34ch; }
.show-more { margin: 10px 10px 0; color: var(--muted); font-size: 13px; padding: 4px 8px; border-radius: 6px; }
.show-more:hover { background: var(--hover); color: var(--fg); }

/* Upcoming */
.day-h { display: flex; align-items: baseline; gap: 10px; margin: 18px 10px 2px; padding-top: 10px; border-top: 1px solid var(--line); }
.day-n { font: 700 28px/1 var(--display); min-width: 34px; font-variant-numeric: tabular-nums; }
.day-w { font-weight: 650; color: var(--muted); }
.day-h.month .day-n { font-size: 22px; min-width: 0; }

/* Logbook */
.lb-h { margin: 24px 10px 4px; font-weight: 650; color: var(--muted); font-size: 13px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }

/* ---------- editor card ---------- */
.card { position: relative; margin: 10px -4px 16px; padding: 12px 14px 10px; background: var(--card); border-radius: 11px; box-shadow: var(--shadow-card); animation: cardIn .16s ease-out; }
@keyframes cardIn { from { transform: scale(.985); opacity: .6; } to { transform: none; opacity: 1; } }
.c-top { display: flex; align-items: flex-start; gap: 10px; }
.c-title { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; padding: 0; line-height: 21px; }
.c-title::placeholder { color: var(--faint); font-weight: 400; }
.c-body { padding-left: 25px; }
.c-notes { display: block; width: 100%; resize: none; margin-top: 6px; min-height: 24px; line-height: 1.5; color: var(--fg); overflow: hidden; padding: 0; }
.c-notes::placeholder { color: var(--faint); }
.c-tpl { margin: 2px 0 6px 25px; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.c-tpl .ic { width: 14px; height: 14px; }
.ck { margin-top: 10px; border-top: 1px solid var(--line); }
.ck-item { display: flex; align-items: center; gap: 8px; min-height: 30px; border-bottom: 1px solid var(--line); }
.ck-box { flex: none; width: 13px; height: 13px; border: 1.5px solid var(--cb); border-radius: 50%; position: relative; display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.ck-box::before { content: ""; position: absolute; inset: -8px; }
.ck-box.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ck-box .ic { width: 9px; height: 9px; }
.ck-box .ic svg { stroke-width: 3.4; }
.ck-input { flex: 1; min-width: 0; padding: 4px 0; }
.ck-item.on .ck-input { color: var(--muted); text-decoration: line-through; }
.ck-del { width: 22px; height: 22px; opacity: 0; }
.ck-item:hover .ck-del, .ck-item:focus-within .ck-del, .touch .ck-del { opacity: .7; }
.c-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.c-tags .tg { cursor: pointer; }
.c-tags .tg:hover { color: var(--fg); border-color: var(--muted); }
.c-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.c-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.c-tools { display: flex; gap: 2px; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border-radius: 7px; background: var(--hover); font-size: 13px; line-height: 20px; max-width: 100%; }
.chip > button.chip-main { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.chip .ic { width: 15px; height: 15px; }
.chip .chip-x { width: 18px; height: 18px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.chip .chip-x:hover { background: var(--line); color: var(--fg); }
/* a When that comes from the project: no ✕, and which project it's from */
.chip.follows { padding-right: 9px; }
.chip .chip-from { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chip .chip-x .ic { width: 11px; height: 11px; }
.chip.today .chip-main .ic { color: var(--c-today); }
.chip.evening .chip-main .ic { color: var(--c-evening); }
.chip.date .chip-main .ic { color: var(--c-upcoming); }
.chip.someday .chip-main .ic { color: var(--c-someday); }
.chip.deadline .chip-main .ic { color: var(--red); }
.chip.deadline.due { color: var(--red); }
.chip.repeat .chip-main .ic { color: var(--accent); }
.chip.tagc .chip-main .ic { color: var(--muted); }

/* ---------- magic plus, batch bar, mobile bar ---------- */
.magic { position: fixed; right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 10px rgba(44, 91, 224, .35), 0 1px 2px rgba(0, 0, 0, .15); display: flex; align-items: center; justify-content: center; z-index: 20; touch-action: none; transition: transform .12s; }
.magic:hover { transform: scale(1.05); }
.magic .ic { width: 22px; height: 22px; }
.magic .ic svg { stroke-width: 2.4; }
.magic.hidden-in { display: none; }
.batch { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 25; display: flex; align-items: center; gap: 2px; padding: 6px; border-radius: 14px; background: var(--pop); box-shadow: var(--shadow-pop); max-width: calc(100vw - 32px); overflow-x: auto; }
.batch .bcount { padding: 0 10px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.batch button { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 9px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.batch button:hover { background: var(--hover); color: var(--fg); }
.batch button .ic { width: 18px; height: 18px; }
.batch .bdone { color: var(--accent); font-weight: 600; font-size: 13px; padding: 8px 12px; }
.m-bar { display: none; }
.sel-ring { display: none; }

/* ---------- popovers, sheets, modals ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; }
.scrim.dim { background: var(--scrim); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.pop { position: fixed; z-index: 41; width: 286px; max-height: calc(100% - 24px); overflow-y: auto; background: var(--pop); border-radius: 12px; box-shadow: var(--shadow-pop); padding: 8px; animation: popIn .12s ease-out; }
.pop.wide { width: 320px; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } }
.modal { position: fixed; z-index: 41; left: 50%; top: 10vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); max-height: 80vh; overflow-y: auto; background: var(--pop); border-radius: 14px; box-shadow: var(--shadow-pop); animation: popIn .14s ease-out; }
.modal.narrow { width: min(400px, calc(100vw - 32px)); }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 8px; }
.modal-h h2 { margin: 0; font: 700 18px/1.3 var(--display); flex: 1; }
.modal-b { padding: 4px 18px 18px; }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 16px; flex-wrap: wrap; }
.btn { padding: 7px 14px; border-radius: 8px; background: var(--hover); font-weight: 600; font-size: 13px; }
.btn:hover { background: var(--line); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { background: var(--red); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }

.pk-h { font-weight: 650; text-align: center; padding: 4px 0 8px; }
.pick-grp { padding: 9px 10px 3px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pick-grp:first-child { padding-top: 3px; }
.pk-in, .field { width: 100%; padding: 7px 10px; border-radius: 8px; background: var(--hover); }
.pk-hint { min-height: 18px; font-size: 12px; color: var(--accent); padding: 4px 10px 2px; }
.pk-hint.bad { color: var(--muted); }
.pk-opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.pk-opt:hover, .pk-opt.kbd { background: var(--hover); }
.pk-opt .ic { width: 17px; height: 17px; }
.pk-opt.today .ic { color: var(--c-today); }
.pk-opt.evening .ic { color: var(--c-evening); }
.pk-opt.someday .ic { color: var(--c-someday); }
.pk-opt.on { font-weight: 650; }
.pk-opt .check { margin-left: auto; color: var(--accent); }
.pk-clear { display: block; width: 100%; margin-top: 6px; padding: 7px; border-radius: 8px; background: var(--hover); font-weight: 600; font-size: 13px; }
.pk-clear.on { color: var(--accent); }
.pk-h .pk-from { font-weight: 400; color: var(--muted); }
.pk-rem { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
.pk-rem .ic { width: 16px; height: 16px; color: var(--muted); }
.pk-rem input { flex: 1; padding: 4px 8px; border-radius: 6px; background: var(--hover); }
.pk-sep { height: 1px; background: var(--line); margin: 6px 0; }
.cal { padding: 4px 2px; }
.cal-h { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; font-weight: 650; }
.cal-h .ib { width: 26px; height: 26px; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal-g .wd { font-size: 10px; color: var(--muted); padding: 2px 0; text-transform: uppercase; letter-spacing: .04em; }
.cal-d { height: 32px; border-radius: 8px; font-variant-numeric: tabular-nums; font-size: 13px; }
.cal-d:hover { background: var(--hover); }
.cal-d.out { color: var(--faint); }
.cal-d.past { color: var(--faint); opacity: .5; pointer-events: none; }
.chip.donec .chip-main .ic { color: var(--c-logbook); }
.chip.donec.canceled .chip-main .ic { color: var(--muted); }
.cal-d.today { color: var(--c-today); font-weight: 700; }
.cal-d.today::after { content: "★"; font-size: 0; }
.cal-d.sel { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.menu-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.menu-i:hover, .menu-i.kbd { background: var(--hover); }
.menu-i .ic { width: 17px; height: 17px; color: var(--muted); }
.menu-i.danger, .menu-i.danger .ic { color: var(--red); }
.menu-i:disabled { opacity: .45; }
.menu-i .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
.menu-sep { height: 1px; background: var(--line); margin: 5px 4px; }
.menu-h { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px 4px; }
.pick-list { max-height: 320px; overflow-y: auto; margin-top: 6px; }
.pick-i { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; border-radius: 8px; text-align: left; }
.pick-i:hover, .pick-i.kbd { background: var(--hover); }
.pick-i .ic { width: 16px; height: 16px; color: var(--muted); }
.pick-i.p .ic { color: var(--accent); }
.pick-i.a { font-weight: 650; }
.pick-i.a .ic { color: var(--c-area); }
.pick-i.inbox .ic { color: var(--c-inbox); }
.pick-i.h { padding-left: 38px; color: var(--muted); font-size: 13px; }
.pick-i.cur { color: var(--accent); }
.pick-i .check { margin-left: auto; color: var(--accent); }
.pick-i .partial { margin-left: auto; color: var(--muted); }

/* Quick Find */
.qf-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.qf-in .ic { color: var(--muted); }
.qf-in input { flex: 1; font-size: 17px; }
.qf-res { padding: 6px; max-height: 56vh; overflow-y: auto; }
.qf-i { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; text-align: left; }
.qf-i.kbd { background: var(--sel); }
.qf-i .ic { width: 17px; height: 17px; }
.qf-i .qf-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qf-i .qf-s { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
.qf-g { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 10px 10px 4px; }
.qf-foot { display: flex; align-items: center; gap: 10px; padding: 8px 16px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.qf-foot label { display: flex; align-items: center; gap: 6px; margin-left: auto; cursor: pointer; }

/* Quick Entry */
.qe { padding: 16px 18px 14px; }
.qe .c-top { gap: 10px; }
.qe-title { flex: 1; min-width: 0; font-size: 16px; font-weight: 500; padding: 0; line-height: 22px; }
.qe-parsed { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 0 25px; }
.qe-p { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 4px 2px 8px; border-radius: 6px; background: var(--accent-tint); color: var(--accent); }
.qe-p button { color: inherit; opacity: .7; display: inline-flex; }
.qe-p .ic { width: 11px; height: 11px; }
.qe { position: relative; }
.qe-ac { position: absolute; z-index: 5; left: 40px; right: 18px; max-width: 420px; margin-top: 4px; padding: 4px; background: var(--pop); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-pop); }
.qe-ac-i { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13.5px; }
.qe-ac-i .ic { width: 16px; height: 16px; color: var(--muted); }
.qe-ac-i:hover { background: var(--hover); }
.qe-ac-i.on { background: var(--accent-tint); }
.qe-ac-t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qe-ac-s { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); text-align: right; }
.qe-p.qe-place .ic { width: 12px; height: 12px; }
.qe-dest { font-size: 12px; color: var(--muted); padding: 10px 0 0 25px; display: flex; gap: 6px; align-items: center; }
.qe-dest .ic { width: 14px; height: 14px; }

/* Settings: the panes listed on the left, the pane you're in on the right */
.modal.settings { width: min(780px, calc(100vw - 32px)); height: min(620px, calc(100vh - 64px)); max-height: none; top: max(24px, calc(50vh - 330px)); overflow: hidden; display: flex; }
.st { display: grid; grid-template-columns: 204px minmax(0, 1fr); width: 100%; min-height: 0; }
.st-side { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px 10px 10px; background: var(--side); border-right: 1px solid var(--line); }
.st-side-h { display: flex; align-items: center; gap: 8px; padding: 0 8px 10px; }
.st-side-h h2, .st-head h2 { flex: 1; min-width: 0; margin: 0; font: 700 18px/1.3 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-side-h .st-x { display: none; }
.st-search { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; padding: 6px 6px 6px 9px; border-radius: 8px; background: var(--hover); color: var(--muted); cursor: text; }
.st-search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
.st-search > .ic { width: 15px; height: 15px; }
.st-search input { flex: 1; min-width: 0; color: var(--fg); }
.st-search input::placeholder { color: var(--muted); }
.st-clear { display: inline-flex; flex: none; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; color: var(--muted); }
.st-clear:hover { background: var(--line-strong); color: var(--fg); }
.st-clear .ic { width: 11px; height: 11px; }
.st-clear .ic svg { stroke-width: 2.6; }
.st-tabs { display: flex; flex-direction: column; gap: 1px; flex: 1; min-height: 0; overflow-y: auto; }
.st-tab { display: flex; align-items: center; gap: 9px; flex: none; min-height: 30px; padding: 4px 8px; border-radius: 7px; text-align: left; }
.st-tab > span:not(.ic) { flex: 1; min-width: 0; }
.st-tab .ic { width: 17px; height: 17px; color: var(--muted); }
.st-tab .chev { display: none; }
.st-tab:hover { background: var(--hover); }
.st-tab.on { background: var(--sel); font-weight: 600; }
.st-tab.on .ic { color: var(--accent); }
.st-ver { padding: 8px 8px 0; font-size: 11.5px; color: var(--faint); }
.st-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.st-head { display: flex; align-items: center; gap: 8px; padding: 13px 12px 7px 24px; }
.st-back { display: none; align-items: center; gap: 2px; margin-left: -8px; padding: 5px 8px 5px 2px; border-radius: 7px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.st-back:hover { background: var(--hover); }
.st-back .ic { width: 18px; height: 18px; }
.st-body { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 24px 24px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.set-lead { margin: 4px 2px 14px; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 58ch; }
.set-fine { margin-top: 16px; font-size: 12px; }
.set-grp + .set-grp, .set-lead + .set-grp { margin-top: 18px; }
.set-grp h3 { margin: 0 2px 6px; font-size: 12px; font-weight: 650; color: var(--muted); }
.set-card { border: 1px solid var(--line-strong); border-radius: 10px; }
.set-grp > .note { margin: 6px 2px 0; }
.set-row { display: flex; align-items: center; gap: 16px; min-height: 44px; padding: 9px 12px; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-row .lbl { flex: 1; min-width: 0; }
.set-row .lbl > span { display: block; overflow-wrap: anywhere; }
.set-row .lbl small { display: block; margin-top: 1px; color: var(--muted); font-size: 12px; line-height: 1.4; }
.set-row .lbl small b { color: var(--fg); font-weight: 600; }
.set-row.tog { cursor: pointer; }
.set-ctl { display: flex; flex: none; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: 62%; }
.set-ctl .btn { white-space: nowrap; }
.btn.danger-quiet { color: var(--red); }
.set-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.set-grp + .set-btns { margin-top: 12px; }
.set-found + .set-found { margin-top: 22px; }
.set-found-h { display: inline-flex; align-items: center; gap: 7px; margin: 2px 0 8px -6px; padding: 3px 6px; border-radius: 7px; font-weight: 650; }
.set-found-h:hover { background: var(--hover); }

/* expandable projects in an area */
.exp-bar { display: flex; align-items: center; gap: 14px; margin: 18px 10px 2px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }

.disc { flex: none; width: 20px; height: 20px; margin: 0 -4px 0 -6px; border-radius: 5px; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; transition: transform .15s; }

/* sidebar: hide/show an area's projects */
.sb-disc { flex: none; width: 20px; height: 20px; margin-right: -4px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); opacity: 0; transition: opacity .12s; cursor: pointer; }

@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) { .sb-disc { width: 30px; height: 30px; margin-right: -6px; } .sb-disc .ic, .sb-area-row .sb-disc .ic { width: 16px; height: 16px; } }

/* a to-do's checklist, opened under its row */
.r-line > .r-ck-btn { vertical-align: -1px; }

@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) {

/* ---- Board: projects and areas side by side ---- */
.content.board-view { max-width: none; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.board-view .lh { padding-left: 4px; padding-right: 4px; }

.board-add { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px 6px 9px; }

.board { display: flex; align-items: flex-start; gap: 14px; overflow-x: auto; padding: 16px 8px 28px 2px; scroll-snap-type: x proximity; }
.bcol { position: relative; flex: 1 1 300px; min-width: 260px; background: var(--side); border: 1px solid var(--line); border-radius: 12px; padding: 8px 6px 10px; scroll-snap-align: start; scroll-margin-left: 2px; }
.bcol.closed { opacity: .75; }
.bcol-h { display: flex; align-items: center; gap: 8px; padding: 4px 4px 9px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }

.bcol-t { flex: 1; min-width: 0; }

.bcol-body { min-height: 40px; }

.bcol .sub-h { margin: 12px 8px 2px; }
/* a heading you can rename where it is (a Board column, under a project's row) */
.sub-hr { display: flex; align-items: flex-start; gap: 2px; }
.sub-h-t { flex: 1; min-width: 0; padding: 0; margin: 0; border: 0; background: none; resize: none; color: inherit; font: inherit; line-height: 1.45; outline: none; overflow: hidden; cursor: text; }
.sub-h-t::placeholder { color: var(--faint); font-weight: 500; }
.sub-hr .ib { width: 22px; height: 22px; margin: -2px 0 -3px; flex: none; color: var(--muted); opacity: 0; }
.sub-hr .ib .ic { width: 14px; height: 14px; }
.sub-hr:hover .ib, .sub-hr:focus-within .ib, .touch .sub-hr .ib { opacity: 1; }
.sub-hr .ib:hover { color: var(--fg); }
.sub-hr.done .sub-h-t { color: var(--muted); }
.bcol .row { padding-left: 8px; padding-right: 8px; }
.bcol .bcol-projs { margin-top: 6px; }
.bcol .pchildren { margin-left: 26px; }
.bcol-empty { padding: 10px; color: var(--faint); font-size: 13px; }
.bcol .card { margin-left: 0; margin-right: 0; }
.board-pop .pick-i.in-area { padding-left: 30px; }

@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) {
  .sb-board-g .sb-board-i { display: none; } /* the Board is for wider screens; Templates stays */
  .content.board-view { padding-left: 0; padding-right: 0; }
  .board-view .lh { padding-left: 16px; padding-right: 16px; }
  .board { padding: 10px 16px 24px; scroll-snap-type: x mandatory; scroll-padding-left: 16px; }
  .bcol, .bstack { flex: 0 0 86%; min-width: 0; }

/* stacks: columns one under another, sharing a width */
.bstack { flex: 1 1 300px; min-width: 260px; display: flex; flex-direction: column; gap: 14px; scroll-snap-align: start; scroll-margin-left: 2px; }
.bstack.sized { min-width: 0; }

.bstack-add { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: -4px; padding: 8px 10px; border: 1.5px dashed var(--line-strong); border-radius: 12px; color: var(--muted); font-weight: 600; font-size: 13px; background: none; opacity: 0; transition: opacity .12s; }
.bstack-add .ic { width: 15px; height: 15px; }

/* a column given its own height scrolls inside */

/* moving a column: grab its title bar, or the grip on its top edge */
@media (pointer: fine) { .bstack .bcol-h, .hcol[data-hcol^="h:"] .bcol-h { cursor: grab; } }
.bcol-grip { position: absolute; top: -1px; left: 50%; width: 56px; height: 10px; transform: translateX(-50%); cursor: grab; z-index: 2; touch-action: none; }
.bcol-grip::after { content: ""; position: absolute; left: 14px; right: 14px; top: 3px; height: 4px; border-radius: 2px; background: var(--line-strong); opacity: 0; transition: opacity .12s, background .12s; }
.bcol:hover > .bcol-grip::after { opacity: 1; }
.bcol-grip:hover::after { background: var(--muted); }
.bcol.col-lifted { opacity: .45; outline: 2px dashed var(--accent); outline-offset: -1px; }
body.col-dragging, body.col-dragging * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }
body.col-dragging .board { scroll-snap-type: none; }
body.col-dragging .bstack-add, body.col-dragging .bcol-grip::after { opacity: 0 !important; }
.col-drop { position: fixed; z-index: 99; background: var(--accent); border-radius: 2px; pointer-events: none; }
.col-drop.h { height: 3px; }
.col-drop.v { width: 3px; }

/* column width handle on each column's right edge */

.bcol-resize::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: transparent; transition: background .12s; }
.bcol-resize:hover::after, .bcol-resize.on::after { background: var(--accent); }
/* height handle on the bottom edge, both at the bottom-right corner */
.bcol-resize-b { position: absolute; left: 14px; right: 14px; bottom: -7px; height: 11px; cursor: row-resize; z-index: 3; touch-action: none; }
.bcol-resize-b::after { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 3px; border-radius: 2px; background: transparent; transition: background .12s; }
.bcol-resize-b:hover::after, .bcol-resize-b.on::after { background: var(--accent); }
.bcol-resize-c { position: absolute; right: -7px; bottom: -7px; width: 20px; height: 20px; cursor: nwse-resize; z-index: 4; touch-action: none; }
.bcol-resize-c::after { content: ""; position: absolute; right: 11px; bottom: 11px; width: 7px; height: 7px; border-right: 2px solid var(--line-strong); border-bottom: 2px solid var(--line-strong); border-bottom-right-radius: 3px; opacity: 0; transition: opacity .12s, border-color .12s; }
.bcol:hover > .bcol-resize-c::after { opacity: 1; }
.bcol-resize-c:hover::after, .bcol-resize-c.on::after { border-color: var(--accent); }
body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none !important; -webkit-user-select: none !important; }
body.col-resizing.rs-y, body.col-resizing.rs-y * { cursor: row-resize !important; }
body.col-resizing.rs-xy, body.col-resizing.rs-xy * { cursor: nwse-resize !important; }
body.col-resizing .board { scroll-snap-type: none; }
body.col-resizing .bstack-add { opacity: 0 !important; }
.bcol.sized { min-width: 0; }
@media (pointer: coarse) { .bcol-resize, .bcol-resize-b, .bcol-resize-c, .bcol-grip, .bstack-add { display: none; } }

/* Templates: a row per template, with what you can do to it at the right */

.tpl-list > .tpl-h:first-child { margin-top: 6px; }
.tpl-find { display: flex; align-items: center; gap: 8px; margin: 16px 10px 0; padding: 7px 11px; border-radius: 9px; background: var(--hover); color: var(--muted); cursor: text; }

/* the template's window */

/* the way back from a template's page */

  .tpl-use { padding: 7px 12px; font-size: 13.5px; }

.tl-now { width: var(--dw); background: color-mix(in srgb, var(--red) 9%, transparent); border-left: 2px solid color-mix(in srgb, var(--red) 55%, transparent); }

.tl-area .tl-lab { font-weight: 700; font-size: 13.5px; }
.tl-area .tl-name { color: var(--fg); }
.tl-proj .tl-name { font-weight: 600; }
.tl-ic { width: 16px; height: 16px; flex: none; }

/* ---------- Notepad ---------- */
:root { --npw: 340px; }
.app > .np { grid-column: 3; grid-row: 1; }
.np { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--side, var(--bg)); border-left: 1px solid var(--line); }

.app.np-dock { grid-template-columns: var(--sbw, 268px) minmax(0, 1fr) var(--npg, var(--npw)); }
.app.np-dock.sb-off { grid-template-columns: 0 minmax(0, 1fr) var(--npg, var(--npw)); }
/* while its edge is dragged the list stays put (one reflow on release, not one a frame) */

@keyframes npIn { from { transform: translateX(24px); opacity: .5; } }
.app.np-sheet .np { position: fixed; z-index: 58; inset: 0; border-left: 0; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* Attach To… */
.np-places { width: 300px; }

/* resize it (its left edge at the side, any edge or corner when it floats) and drag it by its title */
.np { position: relative; }
.np-rs { position: absolute; z-index: 6; display: none; touch-action: none; }

.np-rs.s { bottom: -5px; left: 0; right: 0; height: 9px; cursor: ns-resize; }
.np-rs.nw, .np-rs.ne, .np-rs.sw, .np-rs.se { width: 16px; height: 16px; z-index: 7; }
.np-rs.nw { left: -6px; top: -6px; cursor: nwse-resize; }
.np-rs.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
.np-rs.ne { right: -6px; top: -6px; cursor: nesw-resize; }
.np-rs.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }

.app.np-float .np { position: fixed; z-index: 36; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); animation: npPop .14s ease-out; }
.app.np-float .np-list { border-radius: 0 0 11px 11px; }
@keyframes npPop { from { transform: scale(.98); opacity: .6; } }
.np-h { user-select: none; -webkit-user-select: none; }
.np-h .np-fl .ic { width: 16px; height: 16px; }
body.np-sizing, body.np-sizing * { cursor: var(--np-cur) !important; user-select: none !important; -webkit-user-select: none !important; }
.np-snap { position: fixed; z-index: 35; top: 8px; bottom: 8px; right: 8px; width: min(var(--npw), calc(100% - 60px)); border-radius: 12px; border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; opacity: 0; transform: translateX(12px); transition: opacity .12s, transform .12s; }
.np-snap.on { opacity: 1; transform: none; }
/* notes read formatted; values copy in one click */
.np-view { font-size: 14px; line-height: 1.45; color: var(--fg); cursor: text; overflow-wrap: anywhere; min-height: 20px; }
.np-view > :first-child { margin-top: 0; }
.np-view > :last-child { margin-bottom: 0; }

.np-card.folded .np-view { max-height: 150px; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent); mask-image: linear-gradient(to bottom, #000 70%, transparent); }
/* a note's own height (drag the bar at its foot) */
.np-card { position: relative; }
.np-card.sized .np-view { height: var(--nh); max-height: none; overflow: hidden; }
.np-card.sized.clip .np-view { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 36px), transparent); }
.np-card.sized .np-text { min-height: var(--nh); }

.np-card.np-sizing-note { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.np-card.np-at-full > .np-grip::after { background: var(--c-logbook); }

#app.touch .np-grip::after { top: 9px; opacity: 1; }
.np-more { display: block; margin: 3px 0 0; padding: 0; font-size: 12px; font-weight: 600; color: var(--accent); background: none; }
.np-more:hover { text-decoration: underline; }
.np-val { display: inline; padding: 0 3px 0 4px; margin: 0 1px; border-radius: 5px; background: color-mix(in srgb, var(--c-note) 15%, transparent); color: var(--fg); font: .92em/1.5 var(--mono); cursor: copy; overflow-wrap: anywhere; text-align: left; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.np-val code { background: none; padding: 0; font: inherit; }
.np-val:hover { background: color-mix(in srgb, var(--c-note) 30%, transparent); }
.np-cp, .np-cpb { display: inline-flex; align-items: center; justify-content: center; color: var(--faint); vertical-align: -1px; }
.np-cp { width: 11px; height: 11px; margin-left: 3px; }
.np-cpb { width: 18px; height: 18px; margin-left: 2px; border-radius: 4px; vertical-align: -3px; }
.np-cp svg, .np-cpb svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.np-cpb svg { width: 12px; height: 12px; }
.np-val:hover .np-cp, .np-cpb:hover { color: var(--fg); }
.np-cpb:hover { background: var(--hover); }
.np-val.copied { background: color-mix(in srgb, var(--c-logbook) 25%, transparent); }
.np-val.copied .np-cp, .np-cpb.copied { color: var(--c-logbook); }
.np-tel { white-space: nowrap; }
@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) { .np-view { font-size: 16px; } .np-cpb { width: 26px; height: 26px; } }
/* archived notes, and notes grouped by page */
.np-card.archived { background: transparent; }
.np-card.archived .np-view { color: var(--muted); }
/* ---- live notes: formatted while you type; the line you're on shows its inline Markdown ---- */
.le { position: relative; cursor: text; overflow-wrap: anywhere; white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.le-ln { position: relative; min-height: 1.45em; }
.le.le-empty::before { content: attr(data-placeholder); position: absolute; left: 0; top: 0; color: var(--faint); pointer-events: none; }
.np-draft .le { min-height: 2.9em; }
.le .lb { display: none !important; }
.le .lm { color: var(--faint); font-weight: 400; font-style: normal; text-decoration: none; }
.le-ln:not(.le-on) .lm, .le:not(:focus) .lm { display: none; }
.le-h1 { font-size: 1.2em; font-weight: 700; }
.le-h2 { font-size: 1.08em; font-weight: 700; }
.le-h3 { font-weight: 700; }

.le-task::before { content: ""; left: .12em; top: .23em; cursor: pointer; }

.le strong { font-weight: 650; }
.le del { color: var(--muted); }

.le:focus .le-on .le-a { cursor: text; }
.np-arch .ic { width: 12px; height: 12px; color: var(--faint); }
.np-group { display: flex; flex-direction: column; gap: 8px; }
.np-group + .np-group { margin-top: 6px; }
.np-gh { display: flex; align-items: center; gap: 6px; padding: 4px 2px 0; min-height: 24px; }
.np-gl { display: inline-flex; align-items: center; gap: 5px; min-width: 0; font-size: 12px; font-weight: 650; color: var(--muted); }
.np-gl .ic, .np-gl svg { width: 13px; height: 13px; flex: none; }
.np-gl span:not(.ic) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.np-gl:hover { color: var(--fg); }
.np-gn { font-size: 11px; color: var(--faint); }
.np-arch-h { margin-top: 8px; }
.np-h .np-back { margin-left: -6px; }
/* a page's notes badge, in its header */
.lh-np { display: inline-flex; align-items: center; gap: 4px; flex: none; height: 26px; margin-top: 4px; padding: 0 9px 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--c-note) 14%, transparent); color: color-mix(in srgb, var(--c-note) 75%, var(--fg)); font-size: 12.5px; font-weight: 650; }

.lh-np:hover { background: color-mix(in srgb, var(--c-note) 24%, transparent); }
.lh-np.on { background: var(--c-note); color: #fff; }
/* stickies: a note on its own card, on every page */
.np-stickies { position: fixed; inset: 0; z-index: 37; pointer-events: none; }
.np-sticky { position: absolute; display: flex; flex-direction: column; pointer-events: auto; border-radius: 10px; background: color-mix(in srgb, var(--c-note) 20%, var(--pop)); border: 1px solid color-mix(in srgb, var(--c-note) 45%, var(--line)); box-shadow: 0 2px 6px rgba(20, 28, 48, .1), 0 10px 28px rgba(20, 28, 48, .18); animation: npPop .14s ease-out; }
.np-sticky.flash { animation: npPop .14s ease-out, npFlash 1.2s ease-out; }
.np-st-h { display: flex; align-items: center; gap: 0; height: 22px; padding: 0 3px 0 10px; border-radius: 10px 10px 0 0; background: color-mix(in srgb, var(--c-note) 14%, transparent); cursor: grab; user-select: none; -webkit-user-select: none; }
.np-st-t { flex: 1; }
.np-st-h .ib { width: 20px; height: 20px; color: var(--muted); opacity: 0; transition: opacity .12s; }
.np-sticky:hover .np-st-h .ib, .np-sticky:focus-within .np-st-h .ib { opacity: .75; }

.np-st-h .ib:hover { opacity: 1; color: var(--fg); }
.np-st-h .ib .ic { width: 13px; height: 13px; }
.np-st-b { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 10px; overflow: auto; }

.card .ck-item > span.ck-box { cursor: text; }

/* the Board's Timeline band */
.tl-band { margin: 4px 0 14px; padding: 8px 10px 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--card, var(--bg)); }
.tl-band-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 0 2px 6px; font-size: 13px; }
.tl-band-h > .ic { width: 16px; height: 16px; }

.tl-band .tl-lab, .tl-band .tl-head { background: var(--card, var(--bg)); }

.tl-lanes { --lane: 24px; min-height: calc(var(--lanes) * var(--lane) + 6px); }

.tl-nm.done { text-decoration: line-through; opacity: .6; }

.tl-fold { display: inline-flex; align-items: center; justify-content: center; padding: 0; border-radius: 4px; color: var(--faint); }
.tl-fold .ic { width: 12px; height: 12px; transition: transform .12s; }

.tl-fold:hover { color: var(--fg); background: var(--hover); }
.tl-tline { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--line-strong); border-radius: 1px; pointer-events: none; }
.tl-tick { --tlc: var(--accent); position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--tlc); box-shadow: 0 0 0 2px var(--bg); pointer-events: none; }
.tl-tick.late { --tlc: var(--red); }
.tl-tick.done { opacity: .45; }
.tl-nm.cnt { color: var(--muted); font-weight: 600; }
.tl.stack .tl-area.folded .tl-track { display: block; height: 30px; }
/* where a click on an empty day adds something */
.tl-ghost { position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); pointer-events: none; z-index: 1; }
.tl-ghost .ic { width: 12px; height: 12px; }
.tl-laned > .tl-lab { align-items: flex-start; padding-top: 5px; }
.tl.stack .tl-laned > .tl-lab { padding-top: 6px; }
.tl.stack .tl-track.tl-lanes { height: auto; }
.tl-lane { position: absolute; left: 0; right: 0; top: calc(var(--i) * var(--lane)); height: 30px; pointer-events: none; }
.tl-lane > .tl-bar, .tl-lane > .tl-mk, .tl-lane > .tl-od { pointer-events: auto; }
@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) {
  .tl-lanes { --lane: 30px; }
  .tl-lane { height: 36px; }
}
.board-tl.on { color: var(--c-timeline); background: color-mix(in srgb, var(--c-timeline) 12%, transparent); }

/* ---- sub-projects ---- */
/* where a sub-project is: its area and the projects it's in, above its title */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 0 10px 4px 46px; margin-top: -6px; font-size: 13px; color: var(--muted); }
.crumb { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 6px; color: var(--muted); max-width: 260px; }
.crumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb:hover { background: var(--hover); color: var(--fg); }
.crumb .crumb-ic { width: 13px; height: 13px; flex: none; }
.crumb .pie-ic, .crumb .crumb-ic:not([style]) { color: var(--accent); }

.sb-proj.sb-sub { padding-left: calc(8px + var(--d, 1) * 15px); font-size: 13px; min-height: 28px; }
.sb-proj.sb-sub .ic { width: 15px; height: 15px; }
.sb-proj .sb-disc { margin-left: -2px; }

.pick-i[style*="--d"] { padding-left: calc(10px + var(--d) * 18px); }
.pick-i.in[style*="--d"], .board-pop .pick-i.in-area[style*="--d"] { padding-left: calc(30px + var(--d) * 18px); }
.pick-in { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
/* a project's sub-projects: a little room above them */
.sub-bar { margin-top: 22px; }
.pchildren .subprojs .prow { min-height: 0; }
@media (max-width: 760px) and (pointer: coarse), (max-width: 419px) {
  .crumbs { padding-left: 6px; margin-top: 0; font-size: 14px; }

    if (!(row && row.dataset.kind === 'todo' && row.closest('[data-sec]'))) {
      const sec = boardNewSec();
      if (!sec) return { qe: true };
      opts = Object.assign({}, opts, { sec });
    }
  }
  closeEditor({ noRender: true });
  let props = defaultsForView(opts.extra || {});
  const place = Object.assign({}, opts.place || {});
  if (opts.sec) Object.assign(props, sectionProps(opts.sec) || {});
  else if (!opts.place) {
    const selId = ui.anchor && ui.sel.has(ui.anchor) ? ui.anchor : null;
    const row = selId && document.querySelector(`#content .row[data-id="${CSS.escape(selId)}"]`);
    const ref = row && rowItem(row);
    if (ref && ref.type === 'todo') {
      const sec = row.closest('[data-sec]');
      const sp = sec && sectionProps(sec.dataset.sec);
      if (sp) {
        Object.assign(props, sp);
        const ok = sec.dataset.ok || 'order';
        let nRow = nextRowEl(row);
        if (sinksDone()) while (nRow && (rowItem(nRow) || {}).status !== 'open') nRow = nextRowEl(nRow); // past the completed ones at the bottom
        const nxt = rowItem(nRow);
        place[ok] = one(orderBetween(ref[ok], nxt && nxt.type === 'todo' ? nxt[ok] : null, n));
        if (ok === 'order') place.todayOrder = one(orderBetween(ref.todayOrder, null, n));
        if (ok === 'todayOrder') place.order = one(orderBetween(ref.order, null, n));
      }
    }
  }
  if (props._fromInbox && props.start === 'inbox') props.start = props._fromInbox; // filed in a project or area, so not the Inbox
  for (const k of Object.keys(props)) if (k.startsWith('_') || props[k] === undefined) delete props[k];
  return { props, place };
}

/* checklist */

/* ===================== Popovers, sheets, dialogs, toasts ===================== */
const layers = [];
function openLayer({ html, cls = '', anchor = null, modal = false, onMount, onClose, wide = false, dim }) {
  const root = $('#layer');
  const scrim = document.createElement('div');
  scrim.className = 'scrim' + (modal || isMobile() || dim ? ' dim' : '');
  const el = document.createElement('div');
  el.className = (modal ? 'modal ' : 'pop ') + (wide ? 'wide ' : '') + cls;
  el.setAttribute('role', 'dialog');
  el.innerHTML = html;
  root.append(scrim, el);
  const L = { el, scrim, onClose, anchor };
  layers.push(L);
  scrim.addEventListener('pointerdown', (e) => { e.preventDefault(); closeLayer(L); });
  if (!modal) placePop(el, anchor);
  if (onMount) onMount(el, L);
  return L;
}
function placePop(el, anchor) {
  if (isMobile()) return;
  const r = anchor && anchor.isConnected ? anchor.getBoundingClientRect()
    : anchor && typeof anchor.x === 'number' ? { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y, width: 0 } // a pointer position (right-click)
    : { left: innerWidth / 2, right: innerWidth / 2, top: innerHeight / 3, bottom: innerHeight / 3, width: 0 };
  const pw = el.offsetWidth, ph = el.offsetHeight;
  let x = r.left + r.width / 2 - pw / 2; x = clamp(x, 12, innerWidth - pw - 12);
  let y = r.bottom + 6; if (y + ph > innerHeight - 12) y = Math.max(12, r.top - ph - 6);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function closeLayer(L = layers[layers.length - 1]) {
  if (!L) return;
  const i = layers.indexOf(L); if (i < 0) return;
  layers.splice(i, 1); L.el.remove(); L.scrim.remove();
  if (L.onClose) L.onClose();
  // the window underneath (Settings, say) can catch up with what changed while it was covered
  const under = layers[layers.length - 1];
  if (under && under.onReveal && under.el.isConnected) under.onReveal();
}
function closeAllLayers() { while (layers.length) closeLayer(); }
const topLayer = () => layers[layers.length - 1];

/* ---- toasts ---- */
function toast(msg, opts = {}) {

  el.innerHTML = `<span class="t-msg">${esc(msg)}</span>${opts.undo ? '<button data-t="undo">Undo</button>' : ''}${opts.action ? `<button data-t="act">${esc(opts.action)}</button>` : ''}`;

/* arrow-key navigation for any list of buttons inside a layer */
function listKeys(el, sel, input) {
  let k = -1;
  const items = () => $$(sel, el);
  const mark = () => { items().forEach((b, i) => b.classList.toggle('kbd', i === k)); const b = items()[k]; if (b) b.scrollIntoView({ block: 'nearest' }); };
  (input || el).addEventListener('keydown', (e) => {
    const n = items().length; if (!n) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); k = (k + 1) % n; mark(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); k = (k - 1 + n) % n; mark(); }
    else if (e.key === 'Enter' && k >= 0 && items()[k]) { e.preventDefault(); e.stopPropagation(); items()[k].click(); }
  });
  el.tabIndex = -1; if (!input) el.focus({ preventScroll: true });
  return { reset: () => { k = -1; mark(); }, first: () => { k = 0; mark(); } };
}

/* ---- calendar ---- */
function calHTML(y, m, selected, allowPast, maxDate = null) {
  const ws = S.settings.weekStart || 0, T = T0();
  const first = new Date(y, m, 1).getDay(), offset = (first - ws + 7) % 7, n = daysInMonth(y, m);
  let cells = '';
  for (let i = 0; i < 7; i++) cells += `<span class="wd">${WD[(i + ws) % 7].slice(0, 2)}</span>`;
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= n; d++) {
    const s = dateFromParts(y, m, d);
    const cls = ['cal-d'];
    if (s === T) cls.push('today'); if (s === selected) cls.push('sel'); if ((!allowPast && s < T) || (maxDate && s > maxDate)) cls.push('past');
    cells += `<button class="${cls.join(' ')}" data-date="${s}"${maxDate && s > maxDate ? ' disabled' : ''} aria-label="${fmtDate(s)}">${s === T ? '★' : d}</button>`;
  }
  return `<div class="cal-h"><button class="ib" data-cal="-1" aria-label="Previous month">${ic('chevL')}</button><span>${MONTHS[m]} ${y}</span><button class="ib" data-cal="1" aria-label="Next month">${ic('chevR')}</button></div><div class="cal-g">${cells}</div>`;
}

/* ---- Tags picker ---- */
function openTagPicker(ids, anchor, kind = 'item') {
  const targets = () => kind === 'area' ? ids.map(getA).filter(Boolean) : itemsFor(ids);
  const build = (q = '') => {
    const ql = q.trim().toLowerCase();
    // groups are headings: shown when one of their tags is, and typing a group's name shows all of its tags
    const tree = tagTree(), groupOf = (tag) => { let p = tag, g = 0; while (p && !p.group && p.parentId && g++ < 8) p = getTag(p.parentId); return p && p.group ? p : null; };
    const hit = (n) => !ql || n.tag.title.toLowerCase().includes(ql) || (groupOf(n.tag) && groupOf(n.tag).title.toLowerCase().includes(ql));
    const shown = tree.filter((n) => !n.tag.group && hit(n)), withGroups = new Set(shown.map((n) => groupOf(n.tag)).filter(Boolean).map((g) => g.id));
    // tags outside any group first, then each group under its heading, so a heading's tags are clearly its own
    const order = tree.filter((n) => !groupOf(n.tag)).concat(tree.filter((n) => groupOf(n.tag)));
    const rows = order.filter((n) => (n.tag.group ? withGroups.has(n.tag.id) : shown.includes(n))).map((n) => {
      if (n.tag.group) return `<div class="pick-grp" role="presentation">${esc(n.tag.title)}</div>`;
      const ts = targets(); const count = ts.filter((x) => x.tags.includes(n.tag.id)).length;
      return `<button class="pick-i" data-tag="${n.tag.id}" style="padding-left:${10 + n.depth * 16}px">${ic('tag', 'tc-ic ' + tcls(n.tag))}<span>${esc(n.tag.title)}</span>${count === ts.length && count ? `<span class="check">${ic('check')}</span>` : count ? '<span class="partial">–</span>' : ''}</button>`;
    }).join('');
    const exact = S.tags.some((t) => t.title.toLowerCase() === ql); // a group's name too: no tag of the same name
    return rows + (ql && !exact ? `<button class="pick-i" data-new="1">${ic('plus')}<span>Create tag “${esc(q.trim())}”</span></button>` : '') + (!rows && !ql ? '<p class="note" style="padding:6px 10px">No tags yet. Type a name to create one.</p>' : '');
  };
  const L = openLayer({ anchor, cls: 'tags-pop', html: `<div class="pk-h">Tags</div><input class="pk-in" id="tg-in" placeholder="Find or create a tag" autocomplete="off" aria-label="Tag name"><div class="pick-list" id="tg-list">${build()}</div><div class="pk-sep"></div><button class="menu-i" data-manage="1">${ic('edit')}<span>Manage Tags…</span></button>`,
    onMount: (el) => {
      const inp = $('#tg-in', el), list = $('#tg-list', el);
      const nav = listKeys(el, '.pick-i', inp);
      const refresh = () => { list.innerHTML = build(inp.value); nav.reset(); };
      const toggle = (tagId) => {
        if (kind === 'area') { const a = getA(ids[0]); commit('Tags', () => { a.tags = a.tags.includes(tagId) ? a.tags.filter((t) => t !== tagId) : a.tags.concat(tagId); }); }
        else toggleTagOn(ids, tagId);
        refresh();
      };
      inp.addEventListener('input', refresh);
      inp.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || $('.pick-i.kbd', el)) return; e.preventDefault();
        const q = inp.value.trim(); if (!q) { closeLayer(L); return; }
        const exact = S.tags.find((t) => t.title.toLowerCase() === q.toLowerCase());
        if (exact && exact.group) { toast(`“${exact.title}” is a group. Pick one of its tags.`); return; }
        if (exact) toggle(exact.id); else { let t; commit('New Tag', () => { t = findOrCreateTag(q); }, { render: false }); if (t) toggle(t.id); }
        inp.value = ''; refresh();
      });

/* ---- Move picker ----

function openMove(ids, anchor, opts = {}) {

    if (projectsOnly) {

/* Saving a file. In the installed app (Dock or Home Screen) Safari can turn a download
   into a page load that replaces Sectis with an error page, so there the download runs
   inside a hidden frame (a failure stays in the frame), and on iPhone it goes through
   the share sheet, which has Save to Files. Returns 'saved', 'shared' or 'failed'. */
const isStandalone = () => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };

    try { await navigator.share({ files: [file] }); return 'shared'; } catch (e) { return e && e.name === 'AbortError' ? 'cancelled' : 'failed'; }
  }

    const url = URL.createObjectURL(new Blob([text], { type }));
    if (isStandalone()) {
      const f = document.createElement('iframe');

}

/* ===================== Sync (Firebase Firestore) =====================
   No accounts. A random sync key decides where the data lives in Firestore
   (a hash of it) and encrypts every record (AES-GCM) before upload.
   Each to-do, project, area and tag is its own document (headings still arrive from a device on
   an older version, and become sub-projects here); the most
   recent edit of an item wins. Deletions leave a small marker.
   Two rules keep an old copy from coming back over a newer one:
   - When Sectis opens, the other devices' changes come in before anything here is sent. What
     looks changed here at that point (an edit made while closed, or a field this version reads
     differently) goes up as "the next version of what this device last saw", so it only wins
     if nobody changed that item since. Edits after that are stamped as they're made.
   - Sending never overwrites a copy that's as new or newer: that one comes here instead.
   After an update each device compares everything once (and Settings → Sync → Check
   Everything does it any time): anything that never arrived comes in, and anything an older
   copy overwrote goes back up. */
const SYNC_KEY = 'sectis.sync.v1';
const FB_VERSION = '10.14.1';
const SYNC_KINDS = { todo: 'todos', project: 'projects', heading: 'headings', area: 'areas', tag: 'tags', smart: 'smart', focus: 'focuses', note: 'notes' };
const Y = {
  enabled: false, cfg: null, key: null, space: null, base: {}, pending: {}, cursor: [0, 0], lastSync: 0,
  status: 'off', error: '', db: null, col: null, aes: null, unsub: null, pushing: false, again: false,
  queue: Promise.resolve(), firstPull: null, hints: {}, applying: false,
  pulled: false, // the other devices' changes are in (or can't be: offline), so edits here can be stamped
};
const SYNC_CHECK = '1.44.0'; // compare everything once after updating to this
const syncAvailable = () => SECTIS_WEB && !IN_FRAME && !!(window.crypto && crypto.subtle);

/* ---- small helpers ---- */

  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }

const utf8 = (s) => new TextEncoder().encode(s);
async function sha256hex(s) { const h = await crypto.subtle.digest('SHA-256', utf8(s)); return Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join(''); }
function newSyncKey() {
  const bytes = crypto.getRandomValues(new Uint8Array(26)), A = 'abcdefghijkmnpqrstuvwxyz23456789';
  return Array.from(bytes, (b) => A[b % 32]).join('');
}
function syncHint(id) { Y.hints[id] = pd(T0()).getTime(); }

function syncSaveState() {
  if (!Y.enabled) { lsSet(SYNC_KEY, JSON.stringify({ enabled: false })); return; }

}
const syncSaveSoon = debounce(syncSaveState, 400);
window.addEventListener('pagehide', () => { if (Y.enabled) syncSaveSoon.flush(); });

}

/* ---- Firebase config & join codes ---- */
function parseFirebaseConfig(text) {
  const t = String(text || '').trim(); if (!t) return null;
  let cfg = null;
  try { const j = JSON.parse(t); if (j && typeof j === 'object') cfg = j; } catch (e) { /* not JSON */ }
  if (!cfg) { cfg = {}; t.replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (m, k, v) => { cfg[k] = v; return m; }); }

}

}

    const j = JSON.parse(decodeURIComponent(escape(atob(raw + '==='.slice((raw.length + 3) % 4)))));

/* ---- connection ---- */
function loadScript(src) {
  return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = resolve; s.onerror = () => reject(new Error('Couldn’t download the sync library. Check your internet connection.')); document.head.append(s); });

  const material = await crypto.subtle.importKey('raw', utf8(key), 'PBKDF2', false, ['deriveKey']);

}

}
function friendlySyncError(e) {

  if (/unavailable|network|timeout/i.test(code) || /network|timed out|internet/i.test((e && e.message) || '')) return 'Can’t reach Firebase right now. Changes are kept and will sync when you’re back online.';
  if (/not-found/i.test(code)) return 'This Firebase project has no Firestore database yet. Create one in the Firebase console.';
  if (/invalid-api-key|api-key/i.test(code + ((e && e.message) || ''))) return 'Firebase didn’t accept that config. Copy it again from Project settings → Your apps.';

function setSyncStatus(status, error = '') {

function relTime(ms) {

/* ---- pushing local changes ---- */
function syncRecords() {
  const out = new Map();
  for (const [kind, list] of Object.entries(SYNC_KINDS)) for (const r of S[list]) if (r && r.id && !r.isDraft) out.set(r.id, { k: kind, rec: r });
  return out;
}
/* startup: what changed here before the other devices' changes came in is only the next version

function syncDiff(startup = false) {
  const recs = syncRecords(), now = Date.now(); let changed = false;
  for (const [id, { k, rec }] of recs) {
    const h = recHash(rec), b = Y.base[id];
    if (b && !b.d && b.h === h) continue;
    const bm = (b && b.m) || 0;
    const m = Y.hints[id] ? Math.max(Y.hints[id], bm + 1) : startup && b ? Math.max(bm + 1, (Y.pending[id] && Y.pending[id].m) || 0) : Math.max(now, bm + 1);
    Y.pending[id] = { k, m }; Y.base[id] = { h, m, k }; changed = true;
  }
  for (const id of Object.keys(Y.base)) {
    const b = Y.base[id];
    if (recs.has(id) || b.d) continue;
    const m = startup ? (b.m || 0) + 1 : Math.max(now, (b.m || 0) + 1);
    Y.pending[id] = { k: b.k, m, d: true }; Y.base[id] = { h: '', m, k: b.k, d: true }; changed = true;

/* the other devices' changes are in, or can't come in yet: from now on edits are stamped as made */
function syncReady() {

}
const pushSoon = debounce(() => syncPush(), 600);
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error(msg), { code: 'timeout' })), ms))]); }
async function syncPush() {

  Y.pushing = true; setSyncStatus('syncing');

    const recs = syncRecords(), newer = [];
    for (let i = 0; i < ids.length; i += 200) {
      const chunk = ids.slice(i, i + 200), pend = {}, enc = {};
      for (const id of chunk) {
        const p = Y.pending[id]; if (!p) continue;
        pend[id] = p; const r = recs.get(id);
        if (r && !p.d) enc[id] = await encryptRec(r.rec);
      }
      const want = Object.keys(pend); if (!want.length) continue;
      let sent = {}, kept = [];
      // in one transaction: read what's there, and write only over older copies
      await withTimeout(Y.db.runTransaction(async (tx) => {
        sent = {}; kept = [];
        const refs = want.map((id) => Y.col.doc(id)), snaps = await Promise.all(refs.map((ref) => tx.get(ref)));

          const p = pend[id], cur = snaps[j].exists ? snaps[j].data() : null;

      for (const id of Object.keys(sent)) if (Y.pending[id] && Y.pending[id].m === sent[id]) delete Y.pending[id];

  } finally {

}

/* ---- pulling remote changes ---- */
function normalizeRecord(kind, rec) {
  if (kind === 'todo') return Object.assign(newTodoShape(), rec, { tags: rec.tags || [], checklist: rec.checklist || [] });
  if (kind === 'project') return Object.assign(newProjectShape(), rec, { tags: rec.tags || [] });
  if (kind === 'area') return Object.assign({ title: '', tags: [], order: 0 }, rec, { tags: rec.tags || [] });
  if (kind === 'focus') return normalizeFocus(rec);
  if (kind === 'note') return normalizeNote(rec);

}

  const updates = [];
