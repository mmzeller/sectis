}
function checklistMenu(todoId, ckId, el) {
  const t = getT(todoId); if (!t) return;
  const items = [];
  if (!t.isTemplate) items.push({ label: 'Make Separate To-Do', icon: 'move', fn: () => ckToTodo(todoId, ckId) });
  const i = t.checklist.findIndex((c) => c.id === ckId);
  if (i > 0) items.push({ label: 'Move Up', icon: 'chevL', hint: MODK + '↑', fn: () => ckMove(todoId, ckId, -1) });
  if (i >= 0 && i < t.checklist.length - 1) items.push({ label: 'Move Down', icon: 'chevD', hint: MODK + '↓', fn: () => ckMove(todoId, ckId, 1) });
  items.push({ sep: 1 }, { label: 'Delete Item', icon: 'trash', danger: true, fn: () => ckRemove(todoId, ckId, false) });
  openMenu(el, items);
}

/* drag the grip to reorder (mouse and touch) */
document.addEventListener('pointerdown', (e) => {
  const grip = e.target.closest('[data-ckgrip]'); if (!grip) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const item = grip.closest('.ck-item'), list = item && item.parentElement, card = grip.closest('.card');
  if (!item || !list || !card) return;
  e.preventDefault();
  const todoId = card.dataset.id;
  const startOrder = $$(':scope > .ck-item[data-ck]', list).map((x) => x.dataset.ck).join();
  item.classList.add('ck-dragging');
  document.body.classList.add('dragging-active');
  const move = (ev) => {
    if (ev.cancelable) ev.preventDefault();
    const items = $$(':scope > .ck-item[data-ck]', list).filter((x) => x !== item);
    let before = null;
    for (const it of items) { const r = it.getBoundingClientRect(); if (ev.clientY < r.top + r.height / 2) { before = it; break; } }
    const target = before || list.querySelector(':scope > .ck-item:not([data-ck])');
    if (item.nextElementSibling !== target) list.insertBefore(item, target);
  };
  const up = () => {
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    item.classList.remove('ck-dragging');
    document.body.classList.remove('dragging-active');
    const order = $$(':scope > .ck-item[data-ck]', list).map((x) => x.dataset.ck);
    const t = getT(todoId); if (!t || order.join() === startOrder) return;
    commit('Reorder Checklist', () => { const byId = new Map(t.checklist.map((c) => [c.id, c])); t.checklist = order.map((id) => byId.get(id)).filter(Boolean); touch(t); });
  };
  document.addEventListener('pointermove', move, { passive: false });
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
});

/* ===================== Automatic backups =====================
   Once a day each device keeps a copy of everything in its own storage (IndexedDB),
   plus a copy before big changes such as importing or restoring. */
const BK_INDEX = 'backups:index';
const bk = { lastDay: null, running: false };
const BK_LABELS = { daily: 'Daily', import: 'Before import', erase: 'Before erasing', restore: 'Before restoring a backup', join: 'Before joining sync' };
function backupsSupported() { return 'indexedDB' in window; }
function hasRealData() { return S.todos.some((t) => !t.sample && !t.isDraft) || S.projects.some((p) => !p.sample) || S.areas.some((a) => !a.sample); }
function backupCounts(data) {
  return {
    todos: (data.todos || []).filter((t) => !t.trashed && !t.isTemplate && !t.isDraft && t.status === 'open').length,
    projects: (data.projects || []).filter((p) => !p.trashed && !p.isTemplate && p.status === 'open').length,
  };
}
async function makeBackup(reason = 'daily') {
  if (!backupsSupported()) return false;
  try {
    const list = (await idbGet(BK_INDEX)) || [];
    const snap = { schema: S.schema, savedAt: S.savedAt, todos: S.todos.filter((t) => !t.isDraft), projects: S.projects, headings: S.headings, areas: S.areas, tags: S.tags };
    const data = JSON.stringify(snap);
    const key = 'backup:' + Date.now();
    await idbSet(key, data);
    list.unshift({ key, at: Date.now(), day: T0(), reason, counts: backupCounts(snap), size: data.length });
    const daily = list.filter((b) => b.reason === 'daily'), other = list.filter((b) => b.reason !== 'daily');
    const keep = new Set([...daily.slice(0, 14), ...other.slice(0, 10)].map((b) => b.key));
    for (const b of list) if (!keep.has(b.key)) { try { await idbDel(b.key); } catch (e) { /* ignore */ } }
    await idbSet(BK_INDEX, list.filter((b) => keep.has(b.key)));
    if (reason === 'daily') bk.lastDay = T0();
    return true;
  } catch (e) { return false; }
}
async function dailyBackup() {
  if (bk.running || bk.lastDay === T0() || !backupsSupported() || !S || !hasRealData()) return;
  bk.running = true;
  try {
    const list = (await idbGet(BK_INDEX)) || [];
    if (list.some((b) => b.reason === 'daily' && b.day === T0())) { bk.lastDay = T0(); return; }
    await makeBackup('daily');
  } catch (e) { /* storage unavailable here */ } finally { bk.running = false; }
}
function restoreSnapshot(data) {
  commit('Restore Backup', () => {
    for (const k of ['todos', 'projects', 'headings', 'areas', 'tags']) S[k] = Array.isArray(data[k]) ? data[k] : [];
    S = normalizeState(S);
  });
}
async function openBackups() {
  let list = null;
  try { list = backupsSupported() ? (await idbGet(BK_INDEX)) || [] : null; } catch (e) { list = null; }
  const when = (b) => { const d = new Date(b.at); return `${fmtDate(ymd(d), { weekday: true })}, ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`; };
  const rows = () => (list || []).map((b) => `<div class="bk-row"><div class="bk-main"><b>${esc(when(b))}</b><small>${esc(BK_LABELS[b.reason] || b.reason)} · ${plural(b.counts.todos, 'open to-do')}, ${plural(b.counts.projects, 'project')}</small></div><button class="btn" data-bk="copy" data-key="${b.key}">Copy</button><button class="btn" data-bk="restore" data-key="${b.key}">Restore</button></div>`).join('');
  const body = list === null ? '<p class="note" style="margin:0">Backups aren’t available in this browser.</p>'
    : list.length ? rows() : '<p class="note" style="margin:0">No backups yet. The first one is saved later today.</p>';
  const L = openLayer({ modal: true, html: `<div class="modal-h"><h2>Backups</h2><button class="ib" data-action="close-layer" aria-label="Close">${ic('x')}</button></div>
    <div class="modal-b"><p style="margin-top:0">Sectis keeps a copy of your to-dos on this device once a day for the last 14 days, plus a copy before big changes like importing or restoring. Each device keeps its own.</p><div class="bk-list">${body}</div><p class="note" id="bk-note"></p></div>
    <div class="modal-f">${list ? '<button class="btn" data-bk="now">Back Up Now</button>' : ''}<button class="btn primary" data-action="close-layer">Done</button></div>`,
    onMount: (el) => el.addEventListener('click', async (e) => {
      const b = e.target.closest('[data-bk]'); if (!b) return;
      const note = $('#bk-note', el);
      if (b.dataset.bk === 'now') { b.disabled = true; const ok = await makeBackup('daily'); list = (await idbGet(BK_INDEX)) || []; $('.bk-list', el).innerHTML = rows(); b.disabled = false; note.textContent = ok ? 'Backed up.' : 'Couldn’t save a backup in this browser.'; return; }
      const raw = await idbGet(b.dataset.key).catch(() => null);
      if (!raw) { note.textContent = 'That backup couldn’t be read.'; return; }
      const meta = (list || []).find((x) => x.key === b.dataset.key);
      if (b.dataset.bk === 'copy') { copyText(JSON.stringify(Object.assign({ app: 'Sectis', version: APP_VERSION, exportedAt: new Date().toISOString() }, JSON.parse(raw))), null, note); return; }
      const ok = await confirmDialog({ title: 'Restore this backup?', body: `Your lists will go back to how they were on ${esc(when(meta))}.${Y.enabled ? ' Your other synced devices will change too.' : ''} A copy of what you have now is saved first, and you can undo right after.`, ok: 'Restore' });
      if (!ok) return;
      await makeBackup('restore');
      restoreSnapshot(JSON.parse(raw));
      closeLayer(L); navigate('today');
      toast(`Restored the backup from ${when(meta)}`, { undo: true });
    }) });
}

/* ===================== Share and export =====================
   Turns a list, area, project, selection or single to-do into plain text,
   Markdown, a spreadsheet (CSV) or a printable page. */
const SHARE_PREF = 'sectis.share';
function sharePrefs() {
  const d = { format: 'text', notes: true, checklist: true, dates: true, tags: false, done: false };
  let saved = {};
  try { saved = JSON.parse(lsGet(SHARE_PREF) || '{}') || {}; } catch (e) { saved = {}; }
  if ('meta' in saved && !('dates' in saved)) saved.dates = saved.meta; // older setting
  delete saved.meta;
  return Object.assign(d, saved);

/* ---- collect what to export as a flat list of blocks:
   { h: level, text, proj? } headings, and { item } to-dos or projects ---- */
function projectTodos(p) {
  return S.todos.filter((t) => t.projectId === p.id && !t.trashed && !t.isTemplate && !t.isDraft && (t.status === 'open' || !t.logged));
}
function addProjectBody(B, p, level) {
  const todos = projectTodos(p);
  todos.filter((t) => !t.headingId || !getH(t.headingId) || getH(t.headingId).archived).sort(byOrder).forEach((t) => B.push({ item: t }));
  S.headings.filter((h) => h.projectId === p.id && !h.archived).sort(byOrder).forEach((h) => {
    const ts = todos.filter((t) => t.headingId === h.id).sort(byOrder);
    if (ts.length) { B.push({ h: level, text: h.title || 'Untitled heading' }); ts.forEach((t) => B.push({ item: t })); }
  });
}
function addGrouped(B, todos, extraProjects = []) {
  // loose to-dos, then each project (outside areas first), then each area with its to-dos and projects
  todos.filter((t) => !t.projectId && !t.areaId).sort(byOrder).forEach((t) => B.push({ item: t }));
  const sortT = (a, b) => { const ha = a.headingId && getH(a.headingId), hb = b.headingId && getH(b.headingId); return ((ha ? ha.order + 1 : 0) - (hb ? hb.order + 1 : 0)) || byOrder(a, b); };
  const proj = (p) => { const ts = todos.filter((t) => t.projectId === p.id).sort(sortT); if (ts.length) { B.push({ h: 2, text: pTitle(p), proj: p }); ts.forEach((t) => B.push({ item: t })); } };
  const projectsIn = (areaId) => S.projects.filter((p) => !p.trashed && !p.isTemplate && (p.areaId || null) === areaId).sort(byOrder);
  extraProjects.filter((p) => !p.areaId).forEach((p) => B.push({ item: p }));
  projectsIn(null).forEach(proj);
  S.areas.slice().sort(byOrder).forEach((a) => {
    const at = todos.filter((t) => t.areaId === a.id && !t.projectId).sort(byOrder);
    const ap = extraProjects.filter((p) => p.areaId === a.id);
    const inner = projectsIn(a.id).filter((p) => todos.some((t) => t.projectId === p.id));
    if (!at.length && !ap.length && !inner.length) return;
    B.push({ h: 2, text: aTitle(a) });
    at.forEach((t) => B.push({ item: t })); ap.forEach((p) => B.push({ item: p }));
    inner.forEach((p) => { const ts = todos.filter((t) => t.projectId === p.id).sort(sortT); B.push({ h: 3, text: pTitle(p), proj: p }); ts.forEach((t) => B.push({ item: t })); });
  });
}

        ['Anytime', todos.filter((t) => t.start === 'anytime' && !t.when && !isTodayItem(t)).sort(byOrder)], ['Inbox', todos.filter((t) => isInbox(t) && !isTodayItem(t)).sort(byOrder)],
        ['Someday', todos.filter((t) => t.start === 'someday' && !isTodayItem(t)).sort(byOrder)]].forEach(([label, list]) => { if (list.length) { B.push({ h: 2, text: label }); list.forEach((t) => B.push({ item: t })); } });

function projectLine(p) {

  else if (p.when) bits.push(p.when <= T0() ? 'Today' : fmtDate(p.when));

  return bits.join(', ');
}

/* ---- format each item ---- */
const cap = (t) => (t ? t[0].toUpperCase() + t.slice(1) : t);
function shareDates(x, o) {
  if (!o.dates) return [];
  const bits = [];
  if (x.type === 'project') { const l = projectLine(x); return l ? [l] : []; }
  if (x.status === 'done') bits.push(x.completedAt ? 'done ' + fmtDate(stampDay(x.completedAt), { weekday: false }) : 'done');
  else if (x.status === 'canceled') bits.push('canceled');
  else if (x.start === 'someday') bits.push('Someday');
  else if (isEveningItem(x)) bits.push('This Evening');
  else if (x.when && x.when <= T0()) bits.push('Today');
  else if (x.when) bits.push(fmtDate(x.when));
  if (x.deadline && x.status === 'open') bits.push('due ' + fmtDate(x.deadline));

}
function shareTags(x, o) { return o.tags ? x.tags.map(tagTitle).filter(Boolean).map((t) => '#' + t.replace(/\s+/g, '')) : []; }
function itemLabel(x, o, sep = ' — ') {
  const d = shareDates(x, o), t = shareTags(x, o);
  return (d.length ? sep + d.join(', ') : '') + (t.length ? '  ' + t.join(' ') : '');
}
function itemName(x) { return x.type === 'project' ? pTitle(x) : x.title || 'New To-Do'; }
function shareItems(doc, o) {
  const keep = (x) => doc.forceDone || o.done || x.status === 'open';
  const out = []; let pendingH = [];
  for (const b of doc.blocks) {
    if (b.h) { pendingH = pendingH.filter((p) => p.h < b.h); pendingH.push(b); continue; }
    if (!keep(b.item)) continue;

}
function headingLabel(b, o) { const extra = b.proj && o.dates ? projectLine(b.proj) : ''; return b.text + (extra ? ' — ' + extra : ''); }
/* Plain text: no underlines or brackets; sections are indented under their heading */
function buildText(doc, o) {
  const L = [doc.title];
  if (doc.sub) L.push(cap(doc.sub));
  if (o.notes && doc.notes && doc.notes.trim()) L.push('', ...doc.notes.trim().split('\n'));
  L.push('');
  const box = (x) => (x.type === 'project' ? '○' : x.status === 'done' ? '☑' : x.status === 'canceled' ? '☒' : '☐');
  let depth = 0, lastHeading = false;
  for (const b of shareItems(doc, o)) {
    if (b.h) {

      L.push('  '.repeat(b.h - 2) + headingLabel(b, o));

    }
    lastHeading = false;

}
function buildMarkdown(doc, o) {
  const L = [`# ${doc.title}`];
  if (doc.sub) L.push('', cap(doc.sub));
  if (o.notes && doc.notes && doc.notes.trim()) L.push('', doc.notes.trim());
  let inList = false;
  for (const b of shareItems(doc, o)) {
    if (b.h) { L.push('', `${'#'.repeat(b.h)} ${headingLabel(b, o)}`); inList = false; continue; }
    if (!inList) { L.push(''); inList = true; }
    const x = b.item;
    const name = x.type === 'project' ? `**${pTitle(x)}**` : itemName(x);
    L.push(`- [${x.status === 'open' || x.type === 'project' ? ' ' : 'x'}] ${x.status === 'canceled' ? `~~${name}~~` : name}${itemLabel(x, o)}`);
    if (o.notes && x.notes && x.notes.trim()) x.notes.trim().split('\n').forEach((n) => L.push('  ' + n));
    if (o.checklist && x.type === 'todo') x.checklist.forEach((c) => L.push(`  - [${c.done ? 'x' : ' '}] ${c.title}`));

/* Spreadsheet: only the columns that are switched on */
function buildCSV(doc, o) {
  const q = (v) => { const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

  const cols = [['Title', (x) => itemName(x)]];
  if (items.some((x) => x.type === 'project')) cols.push(['Type', (x) => (x.type === 'project' ? 'Project' : 'To-Do')]);
  cols.push(['List', (x) => (x.type === 'project' ? (areaOf(x) ? aTitle(areaOf(x)) : '') : parentLabel(x).split(' › ')[0])]);
  if (items.some((x) => x.type === 'todo' && x.headingId && getH(x.headingId))) cols.push(['Heading', (x) => { const h = x.type === 'todo' && x.headingId && getH(x.headingId); return h ? h.title : ''; }]);
  if (showStatus) cols.push(['Status', (x) => ({ open: 'Open', done: 'Done', canceled: 'Canceled' }[x.status])]);
  if (o.dates) {
    cols.push(['When', (x) => (x.start === 'someday' ? 'Someday' : x.when ? fmtDate(x.when, { year: true }) : '')]);
    cols.push(['Deadline', (x) => (x.deadline ? fmtDate(x.deadline, { year: true }) : '')]);
  }
  if (o.tags) cols.push(['Tags', (x) => x.tags.map(tagTitle).filter(Boolean).join(', ')]);
  if (o.notes) cols.push(['Notes', (x) => x.notes]);
  if (o.checklist) cols.push(['Checklist', (x) => (x.type === 'todo' ? x.checklist.map((c) => `${c.done ? '✓' : '–'} ${c.title}`).join('\n') : '')]);

}
function buildPrintHTML(doc, o) {
  let h = `<h1>${esc(doc.title)}</h1>${doc.sub ? `<p class="sub">${esc(cap(doc.sub))}</p>` : ''}${o.notes && doc.notes && doc.notes.trim() ? `<div class="md pnotes">${renderMarkdown(doc.notes)}</div>` : ''}`;
  for (const b of shareItems(doc, o)) {
    if (b.h) { h += `<h${b.h}>${esc(b.text)}</h${b.h}>${b.proj && o.dates && projectLine(b.proj) ? `<p class="sub">${esc(cap(projectLine(b.proj)))}</p>` : ''}`; continue; }
    const x = b.item, meta = [...shareDates(x, o), ...shareTags(x, o)];
    h += `<div class="pi ${x.type} ${x.status}"><span class="pbox">${x.status === 'done' ? '✓' : x.status === 'canceled' ? '×' : ''}</span><div class="pmain"><div class="pt">${esc(x.type === 'project' ? pTitle(x) : x.title || 'New To-Do')}${meta.length ? ` <span class="pm">${esc(meta.join(' · '))}</span>` : ''}</div>`
      + (o.notes && x.notes && x.notes.trim() ? `<div class="md pn">${renderMarkdown(x.notes)}</div>` : '')
      + (o.checklist && x.type === 'todo' && x.checklist.length ? `<ul class="pc">${x.checklist.map((c) => `<li class="${c.done ? 'done' : ''}">${esc(c.title)}</li>`).join('')}</ul>` : '') + '</div></div>';

const PRINT_CSS = `#print-root{font:11pt/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#111;background:#fff}
#print-root h1{font-size:20pt;margin:0 0 2pt}#print-root h2{font-size:13pt;margin:16pt 0 4pt;padding-bottom:2pt;border-bottom:1px solid #ccc}
#print-root h3{font-size:11pt;margin:12pt 0 3pt;color:#2c5be0}#print-root .sub{color:#666;margin:0 0 6pt}
#print-root .pi{display:flex;gap:8pt;padding:3pt 0;break-inside:avoid}#print-root .pbox{flex:none;width:10pt;height:10pt;margin-top:2.5pt;border:1.2pt solid #888;border-radius:2.5pt;font-size:8pt;line-height:9pt;text-align:center}
#print-root .pi.project .pbox{border-radius:50%}#print-root .pi.done .pt,#print-root .pi.canceled .pt{color:#777}#print-root .pi.canceled .pt{text-decoration:line-through}
#print-root .pm{color:#777;font-size:9pt;margin-left:4pt}#print-root .pn{color:#444;font-size:10pt;margin-top:1pt}#print-root .pn p{margin:0 0 3pt}
#print-root .pc{list-style:none;margin:2pt 0 0;padding:0;font-size:10pt}#print-root .pc li::before{content:"○ ";color:#888}#print-root .pc li.done{color:#888;text-decoration:line-through}
#print-root .pc li.done::before{content:"● "}#print-root a{color:#2c5be0}#print-root code{font:9pt ui-monospace,Menlo,monospace}`;
function printDoc(doc, o) {
  let root = document.getElementById('print-root');
  if (!root) { root = document.createElement('div'); root.id = 'print-root'; document.body.append(root); }
  root.innerHTML = `<style>${PRINT_CSS}</style>${buildPrintHTML(doc, o)}`;
  document.documentElement.classList.add('printing');

/* ---- the Share dialog ---- */
function shareFileName(doc, ext) {
  const base = doc.title.replace(/[\\/:*?"<>|#]+/g, '').replace(/\s+/g, ' ').trim().slice(0, 60) || 'Sectis';
  return `${base} ${T0()}.${ext}`;
}
function openShare(scope) {
  if (ui.editing) closeEditor({ noRender: false });
  const doc = collectExport(scope);
  const o = sharePrefs();
  const canSave = SECTIS_WEB && !IN_FRAME, canPrint = SECTIS_WEB && !IN_FRAME, canShare = !IN_FRAME && typeof navigator.share === 'function';
  const out = () => (o.format === 'markdown' ? buildMarkdown(doc, o) : o.format === 'csv' ? buildCSV(doc, o) : buildText(doc, o));
  const count = () => shareItems(doc, o).filter((b) => b.item).length;
  const fmtBtn = (v, l) => `<button data-sh-fmt="${v}" class="${o.format === v ? 'on' : ''}">${l}</button>`;
  const opt = (k, l) => `<label class="sh-opt"><input type="checkbox" data-sh-opt="${k}" ${o[k] ? 'checked' : ''}> ${l}</label>`;
  const L = openLayer({ modal: true, cls: 'share-modal', html: `<div class="modal-h"><h2>Share “${esc(doc.title)}”</h2><button class="ib" data-action="close-layer" aria-label="Close">${ic('x')}</button></div>
    <div class="modal-b">
      <div class="seg sh-fmt" role="group" aria-label="Format">${fmtBtn('text', 'Text')}${fmtBtn('markdown', 'Markdown')}${fmtBtn('csv', 'Spreadsheet')}</div>
      <p class="note" id="sh-desc"></p>
      <div class="sh-opts">${opt('notes', 'Notes')}${opt('checklist', 'Checklists')}${opt('dates', 'Dates')}${opt('tags', 'Tags')}${doc.forceDone ? '' : opt('done', 'Completed to-dos')}</div>
      <textarea class="ta" id="sh-out" readonly aria-label="Preview"></textarea>
      <p class="note" id="sh-note"></p>
    </div>
    <div class="modal-f">${canPrint ? '<button class="btn" data-sh="print" style="margin-right:auto">Print or PDF…</button>' : ''}${canSave ? '<button class="btn" data-sh="save">Save File</button>' : ''}<button class="btn${canShare ? '' : ' primary'}" data-sh="copy">Copy</button>${canShare ? '<button class="btn primary" data-sh="share">Share…</button>' : ''}</div>`,
    onMount: (el) => {
      const ta = $('#sh-out', el), note = $('#sh-note', el);
      const refresh = () => {
        ta.value = out(); ta.classList.toggle('csv', o.format === 'csv');
        const n = count();
        $('#sh-desc', el).textContent = (o.format === 'csv' ? 'A file that opens in Numbers, Excel or Google Sheets, one row per to-do. ' : o.format === 'markdown' ? 'Checkbox lists for Notes, Obsidian, GitHub and other Markdown apps. ' : 'Readable anywhere: Messages, Mail, Notes. ')
          + `${plural(n, 'item')}.`;
        $$('[data-sh-fmt]', el).forEach((b) => b.classList.toggle('on', b.dataset.shFmt === o.format));
        lsSet(SHARE_PREF, JSON.stringify(o)); note.textContent = '';
      };

      el.addEventListener('click', async (e) => {
        const f = e.target.closest('[data-sh-fmt]'); if (f) { o.format = f.dataset.shFmt; refresh(); return; }

        const type = o.format === 'csv' ? 'text/csv' : o.format === 'markdown' ? 'text/markdown' : 'text/plain';

        if (b.dataset.sh === 'print') { closeLayer(L); printDoc(doc, o); return; }

/* ===================== One to-do in several places =====================
   "Also Add To…" makes a linked copy in another project or area. Linked copies
   share their title, notes, tags and checklist items; each place keeps its own
   checkbox (and checklist ticks, dates and position), so it can be checked off
   in one place or everywhere. */
function linkSiblings(t) {
  if (!t || !t.linkId) return [];
  return S.todos.filter((x) => x !== t && x.linkId === t.linkId && !x.trashed && !x.isDraft && !x.isTemplate);
}
function placeLabel(t) {
  const p = projectOf(t);
  if (p) { const h = t.headingId && getH(t.headingId); return pTitle(p) + (h && h.title ? ` › ${h.title}` : ''); }
  const a = areaOf(t); if (a) return aTitle(a);
  return isInbox(t) ? 'Inbox' : 'No list';
}
function samePlace(t, target) {
  if (target.type === 'project') return t.projectId === target.id;
  if (target.type === 'area') return !t.projectId && t.areaId === target.id;
  return false;
}
/* the most recently edited copy wins for the shared parts */
function propagateLinks() {
  const groups = new Map();
  for (const t of S.todos) if (t.linkId && !t.trashed && !t.isDraft && !t.isTemplate) { if (!groups.has(t.linkId)) groups.set(t.linkId, []); groups.get(t.linkId).push(t); }
  let changed = false;
  for (const g of groups.values()) {
    if (g.length < 2) continue;
    const src = g.reduce((a, b) => ((b.modifiedAt || 0) > (a.modifiedAt || 0) ? b : a));
    const ckKey = (list) => list.map((c) => c.id + '\u0000' + c.title).join('\u0001');
    for (const t of g) {
      if (t === src) continue;
      if (t.title !== src.title) { t.title = src.title; changed = true; }
      if (t.notes !== src.notes) { t.notes = src.notes; changed = true; }
      if (t.tags.join() !== src.tags.join()) { t.tags = src.tags.slice(); changed = true; }
      if (ckKey(t.checklist) !== ckKey(src.checklist)) {
        const done = new Map(t.checklist.map((c) => [c.id, c.done]));
        t.checklist = src.checklist.map((c) => ({ id: c.id, title: c.title, done: done.get(c.id) || false }));
        changed = true;
      }
    }
  }
  return changed;
}
function alsoAddTo(ids, target) {
  if (target.type === 'inbox' || target.type === 'none') { toast('Pick a project or an area'); return; }
  let added = 0, skipped = 0;
  commit('Also Add To', () => ids.forEach((id) => {
    const t = getT(id);
    if (!t || t.isTemplate || isTplChild(t) || t.templateId) { skipped++; return; }
    if ([t, ...linkSiblings(t)].some((x) => samePlace(x, target))) { skipped++; return; }
    if (!t.linkId) t.linkId = t.id;
    const c = makeTodo({
      title: t.title, notes: t.notes, tags: t.tags.slice(), linkId: t.linkId,
      checklist: t.checklist.map((k) => ({ id: k.id, title: k.title, done: false })),
      start: t.start === 'inbox' ? 'anytime' : t.start, when: t.when, evening: t.evening, deadline: t.deadline, reminder: t.reminder,
      projectId: target.type === 'project' ? target.id : null, headingId: target.type === 'project' ? target.headingId || null : null,
      areaId: target.type === 'area' ? target.id : null, modifiedAt: t.modifiedAt,
    });
    c.order = endOrder(S.todos.filter((x) => !x.trashed && containerKey(x) === containerKey(c)));
    c.todayOrder = orderBetween(t.todayOrder, null)[0];
    S.todos.push(c); added++;
  }));
  const name = target.type === 'project' ? pTitle(getP(target.id)) : aTitle(getA(target.id));
  if (added) toast(`${added > 1 ? plural(added, 'to-do') + ' are' : 'Also'} in ${name}${added > 1 ? ' too' : ''}`, { undo: true });
  else if (skipped) toast(ids.length > 1 ? `Those to-dos are already in ${name}` : `Already in ${name}`);
}
function openAlsoAddTo(ids, anchor) {
  ids = ids.filter((id) => { const t = getT(id); return t && !t.isTemplate && !isTplChild(t) && !t.templateId; });
  if (!ids.length) { toast('Repeating to-dos can’t be in more than one place'); return null; }
  return openMove(ids, anchor, { title: 'Also Add To', noInbox: true, onPick: (target) => alsoAddTo(ids, target) });
}
function completeEverywhere(id) {
  const t = getT(id); if (!t) return;
  const all = [t, ...linkSiblings(t)].filter((x) => x.status === 'open');
  if (!all.length) return;
  commit('Complete Everywhere', () => all.forEach((x) => setStatus(x, 'done')));
  toast(`Completed in ${plural([t, ...linkSiblings(t)].length, 'place')}`, { undo: true });
}
function unlinkTodo(id) {
  const t = getT(id); if (!t) return;
  commit('Unlink', () => { t.linkId = null; touch(t); });
  toast('This copy is now separate', { undo: true });
}
/* after checking one copy off, offer the others */
function afterLinkedComplete(items) {
  if (items.length !== 1) return;
  const t = items[0]; if (t.status !== 'done') return;
  const open = linkSiblings(t).filter((x) => x.status === 'open');
  if (!open.length) return;
  toast(`Done in ${placeLabel(t)}. Still open in ${open.length > 1 ? plural(open.length, 'other place') : placeLabel(open[0])}.`, { action: 'Complete Everywhere', fn: () => completeEverywhere(t.id), ms: 7000 });
}

/* ---- expandable projects inside an area ---- */
function loadExpanded() { try { ui.expanded = new Set(JSON.parse(lsGet('sectis.expanded') || '[]')); } catch (e) { ui.expanded = new Set(); } }
function setExpanded(ids, on) {
  ids.forEach((id) => (on ? ui.expanded.add(id) : ui.expanded.delete(id)));

}
function areaProjectIds(areaId) { return S.projects.filter((p) => p.areaId === areaId && liveProject(p)).map((p) => p.id); }
function projectChildrenHTML(p) {
  const todos = S.todos.filter((t) => t.projectId === p.id && !t.trashed && !t.isTemplate && !t.isDraft && (t.status === 'open' || !t.logged)).filter(matchesTagFilter);
  const headings = S.headings.filter((h) => h.projectId === p.id && !h.archived).sort(byOrder);

}
